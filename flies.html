<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>여름 파리 잡기 🪰</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#AEE3F5;
    --sky-mid:#CDEFF6;
    --sky-low:#FFF4D6;
    --grass:#B6E0A0;
    --grass-dark:#9CCF86;
    --sun:#FFD56B;
    --sun-glow:#FFE9A8;
    --melon-pink:#FF8FA3;
    --melon-rind:#76C893;
    --melon-skin:#D6F2C4;
    --ink:#4A4458;
    --ink-soft:#7B7390;
    --card:#FFFFFF;
    --accent:#FF7BA0;
    --accent-deep:#E85D86;
    --ring:#FFC83D;
    --shadow:rgba(74,68,88,.18);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{
    font-family:'Gaegu',system-ui,sans-serif;
    color:var(--ink);
    overflow:hidden;
    background:#AEE3F5;
    user-select:none;
    -webkit-user-select:none;
    touch-action:manipulation;
  }
  #game{position:fixed;inset:0;overflow:hidden;}

  /* ---------- 여름 풍경 ---------- */
  .scene{position:absolute;inset:0;z-index:0;
    background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-mid) 45%,var(--sky-low) 72%,#FFF4D6 100%);}
  .sun{position:absolute;top:6%;right:9%;width:120px;height:120px;border-radius:50%;
    background:radial-gradient(circle at 38% 38%,#FFF0BE,var(--sun));
    box-shadow:0 0 0 18px var(--sun-glow),0 0 70px 30px rgba(255,213,107,.45);
    animation:sunPulse 5s ease-in-out infinite;}
  @keyframes sunPulse{50%{transform:scale(1.04);}}
  .cloud{position:absolute;background:#fff;border-radius:50px;opacity:.92;
    filter:drop-shadow(0 8px 10px rgba(120,160,200,.25));}
  .cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%;}
  .cloud.c1{width:150px;height:46px;top:14%;left:-160px;animation:drift 38s linear infinite;}
  .cloud.c1::before{width:64px;height:64px;top:-26px;left:24px;}
  .cloud.c1::after{width:48px;height:48px;top:-18px;left:80px;}
  .cloud.c2{width:110px;height:36px;top:30%;left:-160px;animation:drift 52s linear infinite;animation-delay:-12s;}
  .cloud.c2::before{width:48px;height:48px;top:-20px;left:18px;}
  .cloud.c2::after{width:38px;height:38px;top:-14px;left:58px;}
  .cloud.c3{width:130px;height:40px;top:8%;left:-160px;animation:drift 46s linear infinite;animation-delay:-30s;}
  .cloud.c3::before{width:56px;height:56px;top:-24px;left:20px;}
  .cloud.c3::after{width:42px;height:42px;top:-16px;left:70px;}
  @keyframes drift{to{transform:translateX(calc(100vw + 220px));}}

  .grass{position:absolute;left:0;right:0;bottom:0;height:24%;
    background:linear-gradient(180deg,var(--grass),var(--grass-dark));
    border-radius:50% 50% 0 0 / 22% 22% 0 0;}
  .grass::after{content:"";position:absolute;left:0;right:0;top:-10px;height:20px;
    background:radial-gradient(circle at 12px -2px,var(--grass) 10px,transparent 11px) repeat-x;
    background-size:24px 22px;}
  .melon{position:absolute;bottom:5%;left:5%;width:150px;height:84px;
    transform:rotate(-8deg);filter:drop-shadow(0 10px 8px var(--shadow));}

  /* ---------- 상단 점수판 ---------- */
  .hud{position:absolute;top:0;left:0;right:0;z-index:30;
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px;pointer-events:none;}
  .score{pointer-events:auto;background:var(--card);border-radius:26px;
    padding:10px 22px 12px;display:flex;align-items:center;gap:10px;
    box-shadow:0 8px 0 rgba(255,123,160,.25),0 10px 18px var(--shadow);
    border:3px solid #FFE3EC;}
  .score .lbl{font-family:'Gaegu';font-weight:700;font-size:20px;color:var(--ink-soft);}
  .score .num{font-family:'Jua';font-size:40px;line-height:1;color:var(--accent-deep);min-width:54px;text-align:center;}
  .score .num.pop{animation:numPop .35s ease;}
  @keyframes numPop{40%{transform:scale(1.4);color:var(--ring);}}
  .top-right{display:flex;gap:10px;pointer-events:auto;}
  .iconbtn{width:58px;height:58px;border:none;border-radius:20px;cursor:pointer;
    font-size:28px;background:var(--card);color:var(--ink);
    box-shadow:0 6px 0 #E9DDF0,0 8px 14px var(--shadow);transition:transform .08s;}
  .iconbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #E9DDF0;}

  /* ---------- 파리 놀이판 ---------- */
  #playfield{position:absolute;inset:0;z-index:20;}
  .fly{position:absolute;width:96px;height:96px;left:0;top:0;
    will-change:transform;cursor:pointer;touch-action:none;}
  .fly svg{width:100%;height:100%;display:block;
    filter:drop-shadow(0 6px 5px rgba(60,50,80,.28));}
  .fly .fly-emoji{display:flex;align-items:center;justify-content:center;
    width:100%;height:100%;font-size:74px;line-height:1;
    filter:drop-shadow(0 6px 5px rgba(60,50,80,.3));
    animation:flap .14s ease-in-out infinite alternate;}
  @keyframes flap{from{transform:scale(1,1);}to{transform:scale(1.04,.92);}}
  .fly.scan-target{outline:none;}
  .fly.scan-target::after{content:"";position:absolute;inset:-10px;border-radius:50%;
    border:6px dashed var(--ring);animation:scanSpin 2.4s linear infinite;}
  @keyframes scanSpin{to{transform:rotate(360deg);}}
  .fly.gone{pointer-events:none;animation:flyPoof .4s ease forwards;}
  @keyframes flyPoof{to{transform:translate(var(--fx),var(--fy)) scale(.2);opacity:0;}}

  /* ---------- 파리채 ---------- */
  #swatter{position:absolute;z-index:25;width:150px;height:170px;
    left:0;top:0;transform-origin:80% 92%;pointer-events:none;opacity:0;
    transition:opacity .15s;}
  #swatter svg{width:100%;height:100%;filter:drop-shadow(0 8px 8px rgba(60,50,80,.3));}
  #swatter.smack{opacity:1;animation:smack .42s cubic-bezier(.3,1.6,.4,1);}
  @keyframes smack{
    0%{transform:rotate(-46deg) translateY(-30px) scale(1.05);opacity:1;}
    32%{transform:rotate(8deg) translateY(6px) scale(1);}
    55%{transform:rotate(-4deg) translateY(0) scale(.98);}
    100%{transform:rotate(0deg) translateY(0) scale(1);opacity:0;}
  }

  /* ---------- 별가루 효과 ---------- */
  .burst{position:absolute;z-index:24;pointer-events:none;width:0;height:0;}
  .spark{position:absolute;font-size:26px;left:0;top:0;will-change:transform,opacity;
    animation:sparkFly .65s ease-out forwards;}
  @keyframes sparkFly{
    0%{transform:translate(0,0) scale(.4);opacity:0;}
    20%{opacity:1;}
    100%{transform:translate(var(--sx),var(--sy)) scale(1.1) rotate(var(--sr));opacity:0;}
  }
  .splat{position:absolute;z-index:23;width:90px;height:90px;margin:-45px 0 0 -45px;
    border-radius:50%;pointer-events:none;
    background:radial-gradient(circle,rgba(255,213,107,.9) 0%,rgba(255,143,163,.6) 45%,transparent 70%);
    animation:splatGo .5s ease-out forwards;}
  @keyframes splatGo{0%{transform:scale(.2);opacity:.95;}100%{transform:scale(1.6);opacity:0;}}

  /* ---------- 스캔 모드 큰 버튼 ---------- */
  #catchBtn{position:absolute;z-index:40;left:50%;bottom:22px;transform:translateX(-50%);
    display:none;align-items:center;justify-content:center;gap:12px;
    font-family:'Jua';font-size:34px;color:#fff;padding:18px 46px;border:none;
    border-radius:30px;cursor:pointer;
    background:linear-gradient(180deg,var(--accent),var(--accent-deep));
    box-shadow:0 8px 0 #C24870,0 14px 22px rgba(232,93,134,.4);transition:transform .08s;}
  #catchBtn:active{transform:translateX(-50%) translateY(5px);box-shadow:0 3px 0 #C24870;}
  #catchBtn.show{display:flex;}

  /* ---------- 오버레이(시작/설정) ---------- */
  .overlay{position:absolute;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
    padding:20px;background:rgba(74,68,88,.34);backdrop-filter:blur(3px);}
  .overlay[hidden]{display:none;}
  .card{background:var(--card);border-radius:34px;padding:30px 28px 32px;max-width:460px;width:100%;
    text-align:center;box-shadow:0 20px 50px rgba(60,50,80,.3);border:5px solid #FFE3EC;}
  .title{font-family:'Jua';font-size:48px;color:var(--accent-deep);margin:4px 0 2px;line-height:1.1;}
  .title .em{display:inline-block;animation:bob 1.4s ease-in-out infinite;}
  @keyframes bob{50%{transform:translateY(-7px) rotate(-6deg);}}
  .subtitle{font-family:'Gaegu';font-weight:700;font-size:22px;color:var(--ink-soft);margin:0 0 22px;}
  .bigbtn{font-family:'Jua';font-size:34px;color:#fff;border:none;cursor:pointer;
    padding:16px 40px;border-radius:26px;width:100%;
    background:linear-gradient(180deg,#7FD68A,#56B96A);
    box-shadow:0 8px 0 #3E9A52,0 14px 22px rgba(86,185,106,.4);transition:transform .08s;}
  .bigbtn:active{transform:translateY(5px);box-shadow:0 3px 0 #3E9A52;}
  .panel-title{font-family:'Jua';font-size:32px;color:var(--ink);margin:2px 0 18px;}
  .row{display:flex;flex-direction:column;gap:8px;text-align:left;margin-bottom:18px;}
  .row > .row-label{font-family:'Gaegu';font-weight:700;font-size:21px;color:var(--ink);}
  .seg{display:flex;gap:8px;}
  .seg button{flex:1;font-family:'Gaegu';font-weight:700;font-size:19px;padding:12px 4px;cursor:pointer;
    border:3px solid #EADFF2;background:#F8F2FB;color:var(--ink-soft);border-radius:16px;transition:.12s;}
  .seg button.on{background:linear-gradient(180deg,#FFE0EA,#FFC9DC);color:var(--accent-deep);
    border-color:var(--accent);box-shadow:0 4px 0 rgba(232,93,134,.25);}
  .toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:#F8F2FB;border:3px solid #EADFF2;border-radius:18px;padding:12px 16px;cursor:pointer;}
  .toggle .t-txt{font-family:'Gaegu';font-weight:700;font-size:20px;color:var(--ink);}
  .toggle .t-sub{font-family:'Gaegu';font-size:15px;color:var(--ink-soft);}
  .switch{width:62px;height:34px;border-radius:20px;background:#D8CDE4;position:relative;flex:0 0 auto;transition:.18s;}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;
    background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:.18s;}
  .toggle.on .switch{background:var(--melon-rind);}
  .toggle.on .switch::after{left:31px;}
  .closebtn{font-family:'Jua';font-size:26px;color:#fff;border:none;cursor:pointer;
    padding:14px 30px;border-radius:22px;width:100%;margin-top:4px;
    background:linear-gradient(180deg,var(--accent),var(--accent-deep));
    box-shadow:0 6px 0 #C24870;transition:transform .08s;}
  .closebtn:active{transform:translateY(4px);box-shadow:0 2px 0 #C24870;}
  .hint{font-family:'Gaegu';font-size:17px;color:var(--ink-soft);margin-top:14px;line-height:1.5;}

  @media (max-width:480px){
    .title{font-size:40px;}
    .sun{width:84px;height:84px;}
    .score .num{font-size:32px;}
    .fly{width:84px;height:84px;}
  }
  @media (prefers-reduced-motion: reduce){
    .cloud,.sun,.title .em{animation:none!important;}
  }
</style>
</head>
<body>
<div id="game">
  <!-- 여름 풍경 -->
  <div class="scene">
    <div class="sun"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
    <div class="grass"></div>
    <svg class="melon" viewBox="0 0 150 84">
      <path d="M3 78 A72 72 0 0 1 147 78 Z" fill="var(--melon-rind)"/>
      <path d="M11 78 A64 64 0 0 1 139 78 Z" fill="#fff"/>
      <path d="M18 78 A57 57 0 0 1 132 78 Z" fill="var(--melon-pink)"/>
      <circle cx="55" cy="58" r="4" fill="#3a3a4a"/>
      <circle cx="80" cy="50" r="4" fill="#3a3a4a"/>
      <circle cx="98" cy="62" r="4" fill="#3a3a4a"/>
      <circle cx="68" cy="68" r="4" fill="#3a3a4a"/>
    </svg>
  </div>

  <!-- 점수판 -->
  <div class="hud">
    <div class="score">
      <span class="lbl">잡은 파리</span>
      <span class="num" id="scoreVal">0</span>
      <span style="font-size:30px">🪰</span>
    </div>
    <div class="top-right">
      <button class="iconbtn" id="settingsBtn" aria-label="설정">⚙️</button>
    </div>
  </div>

  <!-- 파리들 -->
  <div id="playfield"></div>

  <!-- 파리채 -->
  <div id="swatter">
    <svg viewBox="0 0 150 170">
      <rect x="68" y="74" width="14" height="92" rx="7" fill="#C77B3A"/>
      <rect x="68" y="74" width="14" height="92" rx="7" fill="url(#hg)" opacity=".4"/>
      <ellipse cx="75" cy="44" rx="58" ry="46" fill="#FF6F91"/>
      <ellipse cx="75" cy="44" rx="48" ry="37" fill="#FF89A6"/>
      <g fill="#E85D86">
        <circle cx="55" cy="30" r="4"/><circle cx="75" cy="26" r="4"/><circle cx="95" cy="30" r="4"/>
        <circle cx="48" cy="48" r="4"/><circle cx="68" cy="44" r="4"/><circle cx="88" cy="48" r="4"/><circle cx="105" cy="44" r="4"/>
        <circle cx="58" cy="64" r="4"/><circle cx="78" cy="62" r="4"/><circle cx="98" cy="64" r="4"/>
      </g>
      <defs><linearGradient id="hg" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
      </linearGradient></defs>
    </svg>
  </div>

  <!-- 스캔 모드 버튼 -->
  <button id="catchBtn">🪳 찰싹 잡기!</button>

  <!-- 시작 화면 -->
  <div class="overlay" id="startScreen">
    <div class="card">
      <div class="title">여름 <span class="em">🪰</span> 파리 잡기</div>
      <p class="subtitle">윙~ 날아다니는 파리를 콕! 눌러 잡아요</p>
      <button class="bigbtn" id="startBtn">▶ 시작하기</button>
      <p class="hint">파리를 손가락이나 마우스로 누르면<br>파리채가 <b>착!</b> 하고 잡아요. 소리를 켜 주세요 🔊</p>
    </div>
  </div>

  <!-- 설정 화면 -->
  <div class="overlay" id="settingsPanel" hidden>
    <div class="card">
      <div class="panel-title">⚙️ 설정</div>

      <div class="row">
        <span class="row-label">파리 빠르기</span>
        <div class="seg" id="segSpeed">
          <button data-val="slow">🐢 천천히</button>
          <button data-val="normal" class="on">😊 보통</button>
          <button data-val="fast">⚡ 빠르게</button>
        </div>
      </div>

      <div class="row">
        <span class="row-label">파리 수</span>
        <div class="seg" id="segCount">
          <button data-val="2">2 마리</button>
          <button data-val="3" class="on">3 마리</button>
          <button data-val="5">5 마리</button>
        </div>
      </div>

      <div class="row">
        <div class="toggle on" id="tgSound">
          <div><div class="t-txt">🔊 소리</div><div class="t-sub">윙~ 소리와 착! 소리</div></div>
          <div class="switch"></div>
        </div>
      </div>

      <div class="row">
        <div class="toggle" id="tgScan">
          <div><div class="t-txt">🟡 스위치 / 스캔 모드</div><div class="t-sub">파리를 자동으로 골라줘요. 큰 버튼·스페이스바로 잡기</div></div>
          <div class="switch"></div>
        </div>
      </div>

      <button class="closebtn" id="closeSettings">완료</button>
      <p class="hint">잡은 수를 다시 0으로 만들려면 새로고침 하세요</p>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";
  const $ = (s)=>document.querySelector(s);
  const playfield = $("#playfield");
  const swatter   = $("#swatter");
  const scoreVal  = $("#scoreVal");
  const catchBtn  = $("#catchBtn");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------------- 설정 상태 ---------------- */
  const settings = { speed:"normal", count:3, sound:true, scan:false };
  const SPEED = { slow:0.55, normal:1.0, fast:1.7 };
  const SCAN_MS = { slow:1900, normal:1400, fast:1000 };

  let score = 0, flies = [], running = false, rafId = null, lastT = 0;
  let scanIdx = 0, scanTimer = null;

  /* ---------------- 사운드 (Web Audio) ---------------- */
  let actx = null, buzzGain = null, buzzOsc = null, buzzLFO = null, buzzLFOGain = null, masterBuzz = null;

  function initAudio(){
    if (actx) return;
    actx = new (window.AudioContext || window.webkitAudioContext)();
    // 윙~ 버즈음: 톱니파 + 비브라토
    buzzOsc = actx.createOscillator();
    buzzOsc.type = "sawtooth";
    buzzOsc.frequency.value = 158;
    buzzLFO = actx.createOscillator();
    buzzLFO.frequency.value = 7;
    buzzLFOGain = actx.createGain();
    buzzLFOGain.gain.value = 12;
    buzzLFO.connect(buzzLFOGain).connect(buzzOsc.frequency);
    const lp = actx.createBiquadFilter();
    lp.type = "lowpass"; lp.frequency.value = 900;
    buzzGain = actx.createGain();
    buzzGain.gain.value = 0;            // 살아있는 파리 수에 따라 조절
    masterBuzz = actx.createGain();
    masterBuzz.gain.value = 0.9;
    buzzOsc.connect(lp).connect(buzzGain).connect(masterBuzz).connect(actx.destination);
    buzzOsc.start(); buzzLFO.start();
  }
  function resumeAudio(){ if (actx && actx.state === "suspended") actx.resume(); }

  function setBuzzLevel(){
    if (!buzzGain || !actx) return;
    const alive = flies.filter(f=>f.alive).length;
    const target = settings.sound && running && alive>0 ? Math.min(0.018 + alive*0.012, 0.07) : 0;
    buzzGain.gain.setTargetAtTime(target, actx.currentTime, 0.15);
    if (buzzOsc) buzzOsc.frequency.setTargetAtTime(150 + alive*6, actx.currentTime, 0.3);
  }

  // 착! 타격음: 짧은 노이즈 슬랩 + 낮은 텅 소리
  function playSwat(){
    if (!settings.sound || !actx) return;
    const now = actx.currentTime;
    const buf = actx.createBuffer(1, actx.sampleRate*0.18, actx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i=0;i<d.length;i++){ d[i] = (Math.random()*2-1) * Math.pow(1 - i/d.length, 2.5); }
    const src = actx.createBufferSource(); src.buffer = buf;
    const bp = actx.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=1600; bp.Q.value=0.8;
    const g = actx.createGain(); g.gain.setValueAtTime(0.9, now); g.gain.exponentialRampToValueAtTime(0.001, now+0.18);
    src.connect(bp).connect(g).connect(actx.destination); src.start(now);
    // 낮은 텅
    const thump = actx.createOscillator(); thump.type="sine";
    thump.frequency.setValueAtTime(200, now); thump.frequency.exponentialRampToValueAtTime(60, now+0.12);
    const tg = actx.createGain(); tg.gain.setValueAtTime(0.5, now); tg.gain.exponentialRampToValueAtTime(0.001, now+0.14);
    thump.connect(tg).connect(actx.destination); thump.start(now); thump.stop(now+0.16);
  }

  // 잡았을 때 칭찬음: 상승하는 두 음
  function playCheer(){
    if (!settings.sound || !actx) return;
    const now = actx.currentTime;
    [ [660,0], [990,0.09] ].forEach(([f,t])=>{
      const o = actx.createOscillator(); o.type="triangle"; o.frequency.value=f;
      const g = actx.createGain();
      g.gain.setValueAtTime(0.0001, now+t);
      g.gain.exponentialRampToValueAtTime(0.28, now+t+0.02);
      g.gain.exponentialRampToValueAtTime(0.001, now+t+0.22);
      o.connect(g).connect(actx.destination); o.start(now+t); o.stop(now+t+0.24);
    });
  }

  /* ---------------- 파리 만들기 ---------------- */
  const FLY_HTML = `<span class="fly-emoji">🪰</span>`;

  function rand(a,b){ return a + Math.random()*(b-a); }

  function spawnFly(){
    const W = playfield.clientWidth, H = playfield.clientHeight;
    const size = 96;
    const f = {
      el: document.createElement("div"),
      x: rand(40, W-size-40),
      y: rand(90, H-size-140),
      tx: 0, ty: 0, alive: true, size, retarget: 0
    };
    f.el.className = "fly";
    f.el.innerHTML = FLY_HTML;
    f.el.style.transform = `translate(${f.x}px,${f.y}px)`;
    pickTarget(f);
    f.el.addEventListener("pointerdown", (e)=>{ e.preventDefault(); hitFly(f); }, {passive:false});
    playfield.appendChild(f.el);
    flies.push(f);
    return f;
  }

  function pickTarget(f){
    const W = playfield.clientWidth, H = playfield.clientHeight, s = f.size;
    f.tx = rand(20, Math.max(30, W-s-20));
    f.ty = rand(80, Math.max(120, H-s-130));
    f.retarget = performance.now() + rand(700, 1700);
  }

  /* ---------------- 움직임 루프 ---------------- */
  function loop(t){
    if (!running){ return; }
    const dt = Math.min(40, t - lastT); lastT = t;
    const spd = SPEED[settings.speed] * (reduceMotion ? 0.6 : 1);
    for (const f of flies){
      if (!f.alive) continue;
      if (t > f.retarget) pickTarget(f);
      const dx = f.tx - f.x, dy = f.ty - f.y;
      const ease = 0.0026 * spd * dt;
      f.x += dx * ease + Math.sin(t/90 + f.x)*0.6*spd;   // 살랑살랑 버즈 흔들림
      f.y += dy * ease + Math.cos(t/70 + f.y)*0.6*spd;
      const ang = Math.sin(t/120 + f.x) * 10;
      f.el.style.transform = `translate(${f.x}px,${f.y}px) rotate(${ang}deg)`;
    }
    rafId = requestAnimationFrame(loop);
  }

  /* ---------------- 파리 잡기 ---------------- */
  function hitFly(f){
    if (!f.alive || !running) return;
    f.alive = false;
    resumeAudio();
    const cx = f.x + f.size/2, cy = f.y + f.size/2;

    // 파리채 착!
    swatter.style.left = (cx - 75) + "px";
    swatter.style.top  = (cy - 150) + "px";
    swatter.classList.remove("smack"); void swatter.offsetWidth; swatter.classList.add("smack");

    playSwat();
    setTimeout(playCheer, 120);

    // 파리 사라짐 + 별가루
    f.el.style.setProperty("--fx", "0px");
    f.el.style.setProperty("--fy", "10px");
    f.el.classList.add("gone");
    starBurst(cx, cy);
    splat(cx, cy);

    score++;
    scoreVal.textContent = score;
    scoreVal.classList.remove("pop"); void scoreVal.offsetWidth; scoreVal.classList.add("pop");
    setBuzzLevel();

    // 정리 후 새 파리 등장
    const idx = flies.indexOf(f);
    setTimeout(()=>{
      f.el.remove();
      const i = flies.indexOf(f);
      if (i>-1) flies.splice(i,1);
      if (running && flies.filter(x=>x.alive).length < settings.count){
        const nf = spawnFly();
        setBuzzLevel();
      }
    }, 450);
  }

  function starBurst(x,y){
    const burst = document.createElement("div");
    burst.className = "burst";
    burst.style.left = x + "px"; burst.style.top = y + "px";
    const icons = ["⭐","✨","💫","🌟","⭐"];
    for (let i=0;i<6;i++){
      const s = document.createElement("span");
      s.className = "spark";
      s.textContent = icons[i % icons.length];
      const ang = (Math.PI*2) * (i/6) + rand(-0.3,0.3);
      const dist = rand(55, 95);
      s.style.setProperty("--sx", Math.cos(ang)*dist + "px");
      s.style.setProperty("--sy", Math.sin(ang)*dist - 20 + "px");
      s.style.setProperty("--sr", rand(-90,90)+"deg");
      burst.appendChild(s);
    }
    playfield.appendChild(burst);
    setTimeout(()=>burst.remove(), 700);
  }
  function splat(x,y){
    const d = document.createElement("div");
    d.className = "splat"; d.style.left = x+"px"; d.style.top = y+"px";
    playfield.appendChild(d);
    setTimeout(()=>d.remove(), 520);
  }

  /* ---------------- 스캔 / 스위치 모드 ---------------- */
  function clearScanHL(){ flies.forEach(f=>f.el.classList.remove("scan-target")); }
  function scanTick(){
    const alive = flies.filter(f=>f.alive);
    clearScanHL();
    if (!alive.length) return;
    scanIdx = scanIdx % alive.length;
    alive[scanIdx].el.classList.add("scan-target");
    scanIdx++;
  }
  function startScan(){
    stopScan();
    scanIdx = 0; scanTick();
    scanTimer = setInterval(scanTick, SCAN_MS[settings.speed]);
  }
  function stopScan(){ if (scanTimer){ clearInterval(scanTimer); scanTimer=null; } clearScanHL(); }
  function catchHighlighted(){
    const target = flies.find(f=>f.alive && f.el.classList.contains("scan-target"));
    if (target) hitFly(target);
  }
  function applyScanMode(){
    if (settings.scan && running){ catchBtn.classList.add("show"); startScan(); }
    else { catchBtn.classList.remove("show"); stopScan(); }
  }
  catchBtn.addEventListener("click", ()=>{ resumeAudio(); catchHighlighted(); });
  document.addEventListener("keydown", (e)=>{
    if ((e.code==="Space" || e.code==="Enter") && settings.scan && running){
      e.preventDefault(); resumeAudio(); catchHighlighted();
    }
  });

  /* ---------------- 게임 시작/재구성 ---------------- */
  function rebuildFlies(){
    flies.forEach(f=>f.el.remove());
    flies = [];
    for (let i=0;i<settings.count;i++) spawnFly();
    setBuzzLevel();
    if (settings.scan) startScan();
  }
  function startGame(){
    initAudio(); resumeAudio();
    running = true;
    lastT = performance.now();
    rebuildFlies();
    cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(loop);
    applyScanMode();
  }

  /* ---------------- 설정 UI ---------------- */
  $("#startBtn").addEventListener("click", ()=>{ $("#startScreen").hidden = true; startGame(); });
  $("#settingsBtn").addEventListener("click", ()=>{ $("#settingsPanel").hidden = false; });
  $("#closeSettings").addEventListener("click", ()=>{ $("#settingsPanel").hidden = true; });

  function bindSeg(id, key, parse){
    $(id).addEventListener("click", (e)=>{
      const b = e.target.closest("button"); if (!b) return;
      $(id).querySelectorAll("button").forEach(x=>x.classList.remove("on"));
      b.classList.add("on");
      settings[key] = parse(b.dataset.val);
      if (key==="count" && running){
        const alive = flies.filter(f=>f.alive).length;
        if (alive < settings.count) for (let i=alive;i<settings.count;i++) spawnFly();
        else { // 너무 많으면 초과분 제거
          const extra = flies.filter(f=>f.alive).slice(settings.count);
          extra.forEach(f=>{ f.alive=false; f.el.remove(); flies.splice(flies.indexOf(f),1); });
        }
        setBuzzLevel();
      }
      if (key==="speed" && settings.scan && running) startScan();
    });
  }
  bindSeg("#segSpeed","speed", v=>v);
  bindSeg("#segCount","count", v=>parseInt(v,10));

  function bindToggle(id, key, onChange){
    $(id).addEventListener("click", ()=>{
      const el = $(id); el.classList.toggle("on");
      settings[key] = el.classList.contains("on");
      onChange && onChange();
    });
  }
  bindToggle("#tgSound","sound", ()=>{ resumeAudio(); setBuzzLevel(); });
  bindToggle("#tgScan","scan", ()=>{ applyScanMode(); });

  // 화면 회전/리사이즈 시 파리가 화면 밖에 안 나가도록
  window.addEventListener("resize", ()=>{
    const W = playfield.clientWidth, H = playfield.clientHeight;
    flies.forEach(f=>{
      f.x = Math.min(f.x, W-f.size-10); f.y = Math.min(f.y, H-f.size-10);
      pickTarget(f);
    });
  });
})();
</script>
</body>
</html>
