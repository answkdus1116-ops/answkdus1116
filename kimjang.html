<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f4b26b">
<title>맛있는 김장 체험</title>
<script src="guard.js"></script>
<link rel="stylesheet" href="playkit.css">
<script src="playkit.js"></script>
<style>
  body{background:#fff3e2;}
  .pk-stage{padding:0;gap:0;}
  #stage{position:relative;flex:1;min-height:0;width:100%;overflow:hidden;}
  #bg{position:absolute;inset:0;width:100%;height:100%;}
  .layer{position:absolute;inset:0;}
  #leaves{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
  .leaf{position:absolute;top:-40px;width:22px;height:14px;border-radius:70% 0;opacity:.85;animation:fall linear infinite;}
  @keyframes fall{from{transform:translate(0,0) rotate(0)}to{transform:translate(70px,118vh) rotate(420deg)}}

  /* ---------- 사진 카드 (재료) ---------- */
  .item{position:absolute;transform:translate(-50%,-50%);padding:22px 24px 30px;border-radius:30px;
        cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;}
  .pc{position:relative;width:clamp(100px,22vw,150px);aspect-ratio:1;border-radius:22px;border:6px solid #fff;
      box-shadow:0 10px 16px rgba(120,70,30,.28);overflow:hidden;background:#fffaf2;
      display:flex;align-items:center;justify-content:center;pointer-events:none;}
  .pc img{width:100%;height:100%;object-fit:cover;display:block;}
  .pc.svg{background:#fff6e6;}
  .pc.svg img{object-fit:contain;padding:12px;}
  .tag{position:absolute;left:50%;bottom:0;transform:translateX(-50%);white-space:nowrap;
       font-size:clamp(15px,2.6vw,21px);background:#fff;border-radius:999px;padding:2px 12px;
       box-shadow:0 3px 8px rgba(120,70,30,.2);color:var(--pk-ink);}
  .item.on{outline:5px dashed #ffb03b;outline-offset:6px;border-radius:30px;}
  .item.gone{opacity:0;transform:translate(-50%,-50%) scale(.2);transition:transform .6s,opacity .6s;pointer-events:none;}
  .item.back{transition:left .35s,top .35s;}
  .item.dragging{transition:none;z-index:40;}

  /* ---------- 장바구니 ---------- */
  #basket{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);width:clamp(170px,38vw,280px);text-align:center;pointer-events:none;}
  #basket svg{width:100%;height:auto;display:block;}
  #basketCount{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-size:clamp(20px,3.4vw,30px);
               color:#6a3a1b;background:rgba(255,255,255,.85);border-radius:999px;padding:2px 14px;}
  #basketMini{position:absolute;left:50%;bottom:58%;transform:translateX(-50%);display:flex;gap:4px;}
  #basketMini img{width:34px;height:34px;object-fit:cover;border-radius:50%;border:2px solid #fff;}

  /* ---------- 공통 : 가로 막대 ---------- */
  .mini-meter{position:absolute;left:50%;transform:translateX(-50%);width:min(460px,86%);
              background:rgba(255,255,255,.93);border:4px solid #e5b26b;border-radius:999px;padding:5px 12px;
              display:flex;align-items:center;gap:10px;font-size:clamp(16px,2.7vw,21px);color:#6a3a1b;}
  .mini-meter .bar{flex:1;height:18px;background:#f3e4cc;border-radius:999px;overflow:hidden;}
  .mini-meter .fill{height:100%;width:0;background:linear-gradient(90deg,#ffb03b,#c8261b);transition:width .3s;}
  #mixMeter{top:5%;}
  #stirMeter{top:86%;}
  #paintMeter{top:5%;}

  /* ---------- 양념 만들기 ---------- */
  #bowlWrap{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:clamp(250px,52vw,420px);touch-action:none;}
  #bowlWrap svg.bowl{width:100%;height:auto;display:block;}
  #bowlWrap.stirring{cursor:grab;}
  #bowlIn{position:absolute;left:14%;right:14%;top:18.2%;height:16.4%;pointer-events:none;overflow:hidden;border-radius:50%;}
  #paste{position:absolute;left:14%;right:14%;top:18.2%;height:16.4%;border-radius:50%;
         background:radial-gradient(ellipse at 45% 40%,#d2583e 0,#a8341f 60%,#7a2416 100%);
         opacity:0;transition:opacity .4s;pointer-events:none;}
  #spoonHead{position:absolute;left:0;top:0;width:42px;height:154px;pointer-events:none;opacity:0;transition:opacity .3s;
             transform-origin:14px 130px;}
  #spoonHead svg{width:100%;height:100%;display:block;overflow:visible;}
  #bowlWrap.stirring #spoonHead{opacity:1;}
  .pour{position:absolute;width:14px;height:14px;border-radius:50%;animation:pourdrop .55s ease-in forwards;pointer-events:none;}
  @keyframes pourdrop{from{transform:translateY(-110px) scale(1.2);opacity:1}to{transform:translateY(0) scale(.7);opacity:0}}
  .seasoning{position:absolute;transform:translate(-50%,-50%);padding:16px;border-radius:26px;cursor:grab;touch-action:none;}
  .seasoning.on{outline:5px dashed #ffb03b;outline-offset:6px;}
  .seasoning .count{position:absolute;right:4px;top:4px;background:#c8261b;color:#fff;border-radius:999px;
                    font-size:15px;padding:0 8px;min-width:24px;text-align:center;}
  .seasoning.empty{opacity:.45;}

  /* ---------- 배추 칠하기 ---------- */
  #cabWrap{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);
           width:clamp(240px,62vw,420px);aspect-ratio:1;border-radius:26px;overflow:hidden;
           box-shadow:0 14px 26px rgba(120,70,30,.3);touch-action:none;background:#efdcb4;}
  #cabBase,#paintCv{position:absolute;inset:0;width:100%;height:100%;display:block;}
  #paintCv{pointer-events:none;}
  #leafNum{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);background:rgba(255,255,255,.9);
           border-radius:999px;padding:3px 14px;font-size:clamp(15px,2.6vw,20px);color:#6a3a1b;white-space:nowrap;}
  #pasteTool{position:absolute;left:14%;bottom:8%;transform:translate(-50%,0);padding:12px;border-radius:24px;
             background:rgba(255,255,255,.8);cursor:pointer;touch-action:manipulation;text-align:center;}
  #pasteTool.on{outline:5px dashed #ffb03b;outline-offset:4px;}
  #pasteTool.shake{animation:shk .4s;}
  @keyframes shk{20%{transform:translate(calc(-50% - 8px),0)}40%{transform:translate(calc(-50% + 8px),0)}60%{transform:translate(calc(-50% - 5px),0)}80%{transform:translate(calc(-50% + 5px),0)}}
  #pasteTool img{width:clamp(80px,14vw,112px);display:block;pointer-events:none;}
  #loadBar{height:12px;width:100%;background:#f3e4cc;border-radius:999px;overflow:hidden;margin-top:6px;}
  #loadFill{height:100%;width:0;background:#c8261b;transition:width .2s;}
  #pasteTool .tg{font-size:clamp(14px,2.4vw,18px);color:#6a3a1b;margin-top:4px;}

  /* ---------- 장독 (몸통과 뚜껑을 따로) ---------- */
  #kimchi{position:absolute;left:26%;top:60%;transform:translate(-50%,-50%);width:clamp(140px,28vw,210px);cursor:grab;touch-action:none;padding:14px;}
  #kimchi .pc{width:100%;}
  #kimchi.on{outline:5px dashed #ffb03b;outline-offset:6px;border-radius:30px;}
  #kimchi.gone{opacity:0;transform:translate(-50%,-50%) scale(.1);transition:transform .8s,opacity .8s;pointer-events:none;}
  #kimchi.drag{transition:none;z-index:40;}
  #jarWrap{position:absolute;left:70%;top:57%;transform:translate(-50%,-50%);width:clamp(150px,30vw,230px);touch-action:manipulation;}
  #jarWrap svg{width:100%;height:auto;display:block;overflow:visible;}
  #jarWrap img{width:100%;height:auto;display:block;}
  #jarWrap.hit{animation:bump .4s;}
  @keyframes bump{50%{transform:translate(-50%,-50%) scale(1.05)}}
  #jarKim{opacity:0;transition:opacity .6s;}
  #jarWrap.hasKim #jarKim{opacity:1;}
  #jarLidOn{opacity:0;transform:translateY(-70px);transition:transform .7s cubic-bezier(.3,1.3,.5,1),opacity .5s;}
  #jarWrap.closed #jarLidOn{opacity:1;transform:translateY(0);}
  #lid{position:absolute;left:86%;top:18%;transform:translate(-50%,-50%);width:clamp(110px,20vw,150px);touch-action:none;
       cursor:grab;padding:12px;opacity:0;transition:opacity .6s;}
  #lid.show{opacity:1;}
  #lid.drag{transition:none;z-index:40;}
  #lid svg{width:100%;height:auto;display:block;pointer-events:none;}
  #lid.on{outline:5px dashed #ffb03b;outline-offset:6px;border-radius:30px;}

  /* ---------- 안내 · 완료 ---------- */
  .overlay{position:absolute;inset:0;z-index:20;background:rgba(255,243,226,.94);display:flex;align-items:center;justify-content:center;padding:16px;}
  .card{background:#fff;border-radius:28px;padding:22px;width:min(640px,100%);box-shadow:0 14px 34px rgba(120,70,30,.22);
        display:flex;flex-direction:column;gap:14px;text-align:center;}
  .card h2{margin:0;font-size:clamp(26px,4.6vw,38px);color:#6a3a1b;}
  .steps{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  .step{border:3px solid #f0dcc0;border-radius:20px;padding:12px 8px;background:#fffaf2;font-size:clamp(17px,3vw,24px);color:#6a3a1b;transition:all .35s;}
  .step .n{font-size:clamp(34px,6vw,52px);display:block;}
  .step.on{border-color:#ff8a3d;background:#ffe7cc;transform:scale(1.04);}
  .badge{font-size:clamp(90px,18vw,150px);line-height:1;animation:jump .7s cubic-bezier(.2,1.7,.4,1);}
  @keyframes jump{from{transform:scale(.3)}to{transform:none}}
  .stars{font-size:clamp(30px,6vw,46px);letter-spacing:6px;}
  .row2{display:flex;gap:10px;}
  .row2 .pk-big,.row2 a.pk-big{font-size:clamp(17px,3.2vw,23px);padding:16px 6px;white-space:nowrap;text-decoration:none;text-align:center;}
  .puff{position:absolute;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);
        background:radial-gradient(circle,rgba(255,255,255,.9),rgba(255,255,255,0));animation:puff .6s ease-out forwards;}
  @keyframes puff{to{transform:translate(-50%,-50%) scale(2.4);opacity:0}}
  #pkSay{white-space:normal;line-height:1.25;}
  .pk-top .pk-say{font-size:clamp(17px,3vw,26px);}
</style>
</head>
<body>

<div class="pk-top">
  <a class="pk-icon" href="index.html" title="목록으로">←</a>
  <div class="pk-say" id="pkSay">맛있는 김장을 해 볼까요?</div>
  <button class="pk-icon" id="btnSet" title="설정">⚙️</button>
</div>

<div class="pk-stage">
  <div id="stage">

    <!-- 가을 시골집 마당 -->
    <svg id="bg" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffd9a8"/><stop offset=".6" stop-color="#ffefd6"/><stop offset="1" stop-color="#fff6e6"/>
        </linearGradient>
        <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#f1d8a0"/><stop offset="1" stop-color="#e2c07e"/>
        </linearGradient>
      </defs>
      <rect x="-100" y="-100" width="1200" height="900" fill="url(#sky)"/>
      <circle cx="840" cy="120" r="64" fill="#ffe9a6" opacity=".9"/>
      <path d="M-40 380 Q120 300 280 360 T600 340 T1040 360 V460 H-40Z" fill="#f2c79a" opacity=".85"/>
      <path d="M-40 410 Q160 350 360 400 T760 390 T1040 410 V480 H-40Z" fill="#e9b07c" opacity=".9"/>
      <rect x="500" y="300" width="380" height="200" fill="#f8e7c9"/>
      <path d="M470 310 L690 190 L910 310 Z" fill="#b5673f"/>
      <path d="M490 300 L690 200 L890 300 Z" fill="#cc7a4c" opacity=".6"/>
      <rect x="590" y="380" width="80" height="120" rx="6" fill="#8a5a33"/>
      <rect x="720" y="350" width="110" height="80" rx="6" fill="#fff" opacity=".7"/>
      <path d="M720 350 H830 M775 350 V430" stroke="#b5673f" stroke-width="6"/>
      <rect x="110" y="380" width="26" height="190" fill="#7a4f2c"/>
      <g>
        <circle cx="120" cy="300" r="120" fill="#e96f3a"/>
        <circle cx="50" cy="350" r="78" fill="#f2a14b"/>
        <circle cx="200" cy="350" r="82" fill="#d94a2b"/>
        <circle cx="120" cy="230" r="80" fill="#f6c35a"/>
        <circle cx="90" cy="290" r="26" fill="#ffd978" opacity=".7"/>
      </g>
      <rect x="-100" y="540" width="1200" height="300" fill="url(#ground)"/>
      <path d="M-100 560 Q300 530 620 555 T1100 545" stroke="#d6b470" stroke-width="5" fill="none" opacity=".7"/>
    </svg>
    <div id="leaves"></div>

    <!-- ① 재료 고르기 -->
    <div class="layer" id="layer-pick" hidden></div>
    <div id="basket" hidden>
      <svg viewBox="0 0 300 150" xmlns="http://www.w3.org/2000/svg">
        <path d="M24 46 H276 L256 140 Q254 146 246 146 H54 Q46 146 44 140Z" fill="#d9a466" stroke="#a9733b" stroke-width="4"/>
        <g stroke="#b9854a" stroke-width="5" fill="none" opacity=".8">
          <path d="M40 70 H260 M42 96 H258 M46 120 H254"/>
          <path d="M70 52 L80 140 M120 52 L130 140 M170 52 L180 140 M220 52 L230 140"/>
        </g>
        <path d="M24 46 Q150 12 276 46" stroke="#a9733b" stroke-width="10" fill="none" stroke-linecap="round"/>
      </svg>
      <div id="basketCount">0 / 6</div>
    </div>
    <div id="basketMini" hidden></div>

    <!-- ② 양념 만들기 -->
    <div class="layer" id="layer-mix" hidden>
      <div class="mini-meter" id="mixMeter"><span>넣은 양</span><div class="bar"><div class="fill" id="mixFill"></div></div><span id="mixNum">0/4</span></div>
      <div id="bowlWrap">
        <svg class="bowl" viewBox="0 0 300 220" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="150" cy="206" rx="126" ry="12" fill="#6b4a2a" opacity=".18"/>
          <path d="M26 56 H274 Q274 186 150 200 Q26 186 26 56Z" fill="#7fb7d8" stroke="#5a9bc2" stroke-width="3"/>
          <path d="M40 92 Q150 118 260 92" stroke="#ffffff" stroke-width="6" fill="none" opacity=".5" stroke-linecap="round"/>
          <path d="M60 130 Q150 160 240 130" stroke="#ffffff" stroke-width="4" fill="none" opacity=".3" stroke-linecap="round"/>
          <ellipse cx="150" cy="56" rx="124" ry="26" fill="#bfe0f2" stroke="#5a9bc2" stroke-width="3"/>
          <ellipse cx="150" cy="58" rx="108" ry="18" fill="#efe3d0"/>
        </svg>
        <div id="bowlIn"></div>
        <div id="paste"></div>
        <div id="spoonHead">
          <svg viewBox="0 0 60 220" xmlns="http://www.w3.org/2000/svg">
            <path d="M24 176 C28 140 36 96 44 40" stroke="#8a5528" stroke-width="10" fill="none" stroke-linecap="round"/>
            <path d="M24 176 C28 140 36 96 44 40" stroke="#c98a4a" stroke-width="5" fill="none" stroke-linecap="round" opacity=".7"/>
            <ellipse cx="22" cy="186" rx="17" ry="27" transform="rotate(-8 22 186)" fill="#d59a58" stroke="#8a5528" stroke-width="3"/>
            <ellipse cx="20" cy="180" rx="8" ry="14" fill="#f2c48a" opacity=".5"/>
          </svg>
        </div>
      </div>
      <div class="seasoning" id="s-chili" style="left:18%;top:86%"><div class="pc svg"><img src="kim/powder.svg" alt="고춧가루"></div><span class="count" id="c-chili">0</span></div>
      <div class="seasoning" id="s-fish" style="left:50%;top:88%"><div class="pc svg"><img src="kim/fishsauce.svg" alt="멸치액젓"></div><span class="count" id="c-fish">0</span></div>
      <div class="seasoning" id="s-shr" style="left:82%;top:86%"><div class="pc svg"><img src="kim/saltedshrimp.svg" alt="새우젓"></div><span class="count" id="c-shr">0</span></div>
      <div class="mini-meter" id="stirMeter" hidden><span>쓱싹쓱싹</span><div class="bar"><div class="fill" id="stirFill"></div></div><span id="stirNum">0/6</span></div>
    </div>

    <!-- ③ 배추에 양념 바르기 (잎 한 장씩) -->
    <div class="layer" id="layer-paint" hidden>
      <div class="mini-meter" id="paintMeter"><span>빨갛게</span><div class="bar"><div class="fill" id="paintFill"></div></div><span id="paintNum">0%</span></div>
      <div id="cabWrap">
        <canvas id="cabBase"></canvas>
        <canvas id="paintCv"></canvas>
      </div>
      <canvas id="pileCv" width="160" height="160" style="position:absolute;left:84%;top:20%;transform:translate(-50%,-50%);width:clamp(90px,18vw,130px);height:auto;aspect-ratio:1;border-radius:50%;background:#fbf1dc;box-shadow:0 6px 14px rgba(120,70,30,.25);"></canvas>
      <div id="leafNum">잎 0/2</div>
      <div id="pasteTool">
        <img src="kim/bowl-paste.svg" alt="양념 그릇">
        <div id="loadBar"><div id="loadFill"></div></div>
        <div class="tg">누르면 양념을 묻혀요</div>
      </div>
    </div>

    <!-- ④ 장독대에 담기 -->
    <div class="layer" id="layer-store" hidden>
      <div id="kimchi"><div class="pc svg"><img id="kimImg" src="" alt="포기김치"></div></div>
      <div id="jarWrap"><img src="kim/photo/jar-cutout.png" alt="장독"></div>
    </div>

    <!-- 처음 안내 -->
    <div class="overlay" id="intro">
      <div class="card">
        <h2>🏺 맛있는 김장하기</h2>
        <div class="steps">
          <div class="step" id="st1"><span class="n">🥬</span>1. 재료 고르기</div>
          <div class="step" id="st2"><span class="n">🥣</span>2. 양념 만들기</div>
          <div class="step" id="st3"><span class="n">🖌️</span>3. 배추에 바르기</div>
          <div class="step" id="st4"><span class="n">🏺</span>4. 장독대에 담기</div>
        </div>
        <button class="pk-big" id="btnStart">▶ 시작하기</button>
      </div>
    </div>

    <!-- 끝 -->
    <div class="overlay" id="done" hidden>
      <div class="card">
        <div class="badge">🏅</div>
        <h2>최고의 김치 요리사!</h2>
        <div class="stars">⭐⭐⭐</div>
        <p style="margin:0;font-size:clamp(17px,3vw,22px);color:#6a3a1b">직접 만든 김치가 장독대에 잘 담겼어요.</p>
        <div class="row2">
          <button class="pk-big ok" id="btnAgain">🔄 다시 하기</button>
          <a class="pk-big" href="index.html">🏠 목록으로</a>
        </div>
      </div>
    </div>

  </div>
</div>

<div class="pk-sheet" id="setSheet" hidden>
  <div class="pk-panel">
    <h2>⚙️ 설정</h2>
    <div class="pk-field">
      <span>소리 / 말 / 음악</span>
      <div class="pk-opts" id="optSound">
        <button class="pk-opt" data-v="true">효과음 켜기</button>
        <button class="pk-opt" data-v="false">효과음 끄기</button>
      </div>
      <div class="pk-opts" id="optVoice">
        <button class="pk-opt" data-v="true">말해 주기</button>
        <button class="pk-opt" data-v="false">말 안 하기</button>
      </div>
      <div class="pk-opts" id="optBgm">
        <button class="pk-opt" data-v="1">🎵 가을 음악 켜기</button>
        <button class="pk-opt" data-v="0">음악 끄기</button>
      </div>
    </div>
    <button class="pk-big ok" id="btnClose">시작하기</button>
    <button class="pk-big" id="btnRestart">🔄 처음부터 다시</button>
  </div>
</div>

<script src="kimjang.js"></script>
</body>
</html>
