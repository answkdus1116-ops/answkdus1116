<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>반짝반짝 여름 나비 꽃밭</title>
  <link rel="stylesheet" href="GARDEN.css">
  <!-- AI 배경 제거(무료, 브라우저에서 실행 · API키 불필요). 실패하면 자동으로 기본 방식으로 넘어감 -->
  <script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/dist/imgly-background-removal.browser.min.js"></script>
  <script src="guard.js"></script>
</head>
<body>
  <!-- 꽃밭 배경 + 친구들이 그려지는 캔버스 -->
  <canvas id="gardenCanvas"></canvas>

  <!-- 입장 화면 -->
  <div id="entryOverlay">
    <div class="entry-content">
      <div class="entry-icon">🌻🦋☀️🍉</div>
      <h1>자연쌤의 여름 꽃밭</h1>
      <button class="btn-start" onclick="Garden.startApp()">꽃밭에 들어가기</button>
    </div>
  </div>

  <!-- 상단 UI (얇은 한 줄 · 좌측 정렬 · 접기 가능) -->
  <div class="ui-panel" id="uiPanel">
    <button class="btn btn-bar-toggle" id="collapseBtn" onclick="Garden.toggleBar()"><span class="ico">🦋</span><span id="collapseLabel">닫기</span></button>
    <div class="btn-cluster" id="btnCluster">
      <button class="btn btn-bug" onclick="Garden.chooseAdd('fly')"><span class="ico">🦋</span><span>곤충</span></button>
      <button class="btn btn-plant" onclick="Garden.chooseAdd('stay')"><span class="ico">🌻</span><span>꽃·수박</span></button>
      <button class="btn btn-ghost" onclick="Garden.saveScene()"><span class="ico">💾</span><span>저장</span></button>
      <button class="btn btn-ghost" id="audioBtn" onclick="Garden.toggleAudio()"><span class="ico">🔇</span><span>소리 끔</span></button>
      <button class="btn btn-ghost" id="voiceBtn" onclick="Garden.toggleVoice()"><span class="ico">🗣️</span><span>말 켬</span></button>
      <button class="btn btn-ghost" onclick="Garden.clearStage()"><span class="ico">🧹</span><span>청소</span></button>
      <button class="btn btn-ghost" onclick="Garden.toggleFullScreen()"><span class="ico">🖥️</span><span>크게</span></button>
      <button class="btn btn-exit" onclick="location.href='index.html'"><span class="ico">🏠</span><span>메인</span></button>
    </div>
  </div>

  <!-- 올리기 종류 선택 모달 -->
  <div id="addChoice" class="modal">
    <div class="choice-box">
      <h2 id="addChoiceTitle">넣기</h2>
      <div class="choice-btns">
        <button class="btn btn-primary" onclick="Garden.addByCamera()"><span class="ico">📸</span><span>촬영하기</span></button>
        <button class="btn btn-accent2" onclick="Garden.addByFile()"><span class="ico">📁</span><span>앨범에서</span></button>
      </div>
      <button class="btn-close-cam" onclick="Garden.closeAddChoice()">닫기</button>
    </div>
  </div>

  <!-- 카메라 모달 -->
  <div id="cameraModal" class="modal">
    <div class="camera-content">
      <video id="video" autoplay playsinline></video>
      <canvas id="captureCanvas" style="display:none;"></canvas>
      <div class="camera-ui">
        <button class="btn-capture" onclick="Garden.takeSnapshot()"></button>
        <button class="btn-close-cam" onclick="Garden.closeCamera()">닫기</button>
      </div>
    </div>
  </div>

  <!-- 로딩 알림 -->
  <div id="customAlert" class="custom-alert">
    <div class="spin">🦋</div>
    <div class="msg" id="alertMessage">준비 중...</div>
  </div>

  <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="Garden.handleFileUpload(event)">

  <!-- 배경음악: summer_bgm.mp3 파일을 같은 폴더에 직접 넣어주세요 (자세한 내용은 채팅 설명 참고) -->
  <audio id="bgm" loop src="summer_bgm.mp3"></audio>

  <script src="GARDEN.js"></script>
</body>
</html>
