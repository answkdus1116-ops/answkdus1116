<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마음이의 감정 교실</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FFF9EF; --cream2:#FFF3DC; --ink:#5B4A3F; --ink-soft:#8A7466;
  --joy:#FFD93D; --joy-soft:#FFF1B8;
  --sad:#74B9FF; --sad-soft:#D6E9FF;
  --angry:#FF7675; --angry-soft:#FFD9D8;
  --surprise:#A29BFE; --surprise-soft:#E4E1FF;
  --fear:#81ECEC; --fear-soft:#DDFBFB;
  --neutral:#B2BEC3; --neutral-soft:#ECF0F1;
  --mint:#55EFC4; --pink:#FD79A8;
  --card-shadow:0 8px 0 rgba(91,74,63,.12);
  --radius:28px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Gaegu',sans-serif; background:var(--cream); color:var(--ink);
  display:flex; flex-direction:column; overflow:hidden;
}
h1,h2,h3,.jua{font-family:'Jua',sans-serif;font-weight:400}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:focus-visible{outline:4px solid var(--sad);outline-offset:3px;border-radius:16px}

/* ── 상단 바 ───────────────────────── */
header{
  display:flex;align-items:center;gap:12px;padding:10px 16px;
  background:var(--cream2);border-bottom:3px dashed rgba(91,74,63,.15);flex-shrink:0;
}
header .logo{display:flex;align-items:center;gap:10px}
header .logo svg{width:44px;height:44px}
header h1{font-size:1.5rem}
header .spacer{flex:1}
.top-btn{
  font-family:'Jua';font-size:1.05rem;padding:8px 16px;border-radius:999px;
  background:#fff;box-shadow:0 4px 0 rgba(91,74,63,.15);color:var(--ink);
}
.top-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(91,74,63,.15)}
.top-btn.hidden{display:none}

/* ── 화면 전환 ─────────────────────── */
main{flex:1;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:16px;overflow:auto}
.screen.active{display:flex}

/* ── 홈 ───────────────────────────── */
#home{align-items:center;justify-content:center;gap:22px;text-align:center}
.mascot-hello{display:flex;align-items:center;gap:14px}
.mascot-hello svg{width:110px;height:110px;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.bubble{
  background:#fff;border-radius:24px;padding:14px 20px;font-size:1.35rem;
  box-shadow:var(--card-shadow);position:relative;max-width:340px;
}
.bubble::before{
  content:'';position:absolute;left:-12px;top:50%;transform:translateY(-50%);
  border:12px solid transparent;border-right-color:#fff;border-left:0;
}
.mode-grid{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
.mode-card{
  width:230px;padding:24px 18px;border-radius:var(--radius);background:#fff;
  box-shadow:var(--card-shadow);display:flex;flex-direction:column;align-items:center;gap:10px;
  transition:transform .15s;
}
.mode-card:hover{transform:translateY(-4px)}
.mode-card:active{transform:translateY(2px)}
.mode-card .icon{font-size:3.4rem;line-height:1}
.mode-card h2{font-size:1.5rem}
.mode-card p{font-size:1.1rem;color:var(--ink-soft);line-height:1.35}
.mode-card.m1{background:linear-gradient(180deg,#fff,var(--joy-soft))}
.mode-card.m2{background:linear-gradient(180deg,#fff,var(--fear-soft))}
.mode-card.m3{background:linear-gradient(180deg,#fff,var(--surprise-soft))}

/* ── 감정 카드 배우기 ─────────────── */
#learn{align-items:center;justify-content:center;gap:14px}
.emo-card{
  width:min(480px,92vw);border-radius:36px;background:#fff;box-shadow:var(--card-shadow);
  display:flex;flex-direction:column;align-items:center;gap:8px;padding:26px 20px 22px;
  border:6px solid transparent;
}
.emo-card svg.face{width:min(160px,38vw);height:auto}
.emo-name{font-size:2.4rem;letter-spacing:.05em}
.emo-desc{font-size:1.3rem;text-align:center;line-height:1.45;color:var(--ink-soft)}
.ex-title{font-size:1.05rem;color:var(--ink-soft);font-family:'Jua';margin-top:4px}
.example-row{display:flex;gap:12px;width:100%;justify-content:center}
.ex-item{
  flex:1;max-width:200px;background:var(--cream2);border-radius:20px;padding:10px 8px 8px;
  display:flex;flex-direction:column;align-items:center;gap:6px;border:3px solid transparent;
  transition:transform .12s;
}
.ex-item:active{transform:scale(.95)}
.ex-item.playing{border-color:var(--joy);background:#fff}
.ex-item svg{width:100%;height:auto;border-radius:12px}
.ex-item .cap{font-size:1.08rem;text-align:center;line-height:1.3}
.learn-controls{display:flex;align-items:center;gap:18px}
.round-btn{
  width:72px;height:72px;border-radius:50%;background:#fff;box-shadow:0 6px 0 rgba(91,74,63,.15);
  font-size:2rem;display:flex;align-items:center;justify-content:center;
}
.round-btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(91,74,63,.15)}
.round-btn.speak{background:var(--joy);width:86px;height:86px;font-size:2.4rem}
.dots{display:flex;gap:8px;justify-content:center}
.dots span{width:14px;height:14px;border-radius:50%;background:rgba(91,74,63,.18)}
.dots span.on{background:var(--joy);transform:scale(1.25)}

/* ── 카메라 공통 ─────────────────── */
.cam-wrap{
  position:relative;border-radius:var(--radius);overflow:hidden;background:#3b3129;
  box-shadow:var(--card-shadow);aspect-ratio:4/3;width:100%;
}
.cam-wrap video,.cam-wrap canvas{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);
}
.cam-status{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;color:#fff;font-size:1.3rem;background:rgba(59,49,41,.85);text-align:center;padding:20px;
  transition:opacity .3s;z-index:5;
}
.cam-status.hide{opacity:0;pointer-events:none}
.cam-status .spin{
  width:44px;height:44px;border-radius:50%;border:5px solid rgba(255,255,255,.25);
  border-top-color:var(--joy);animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.start-cam-btn{
  font-family:'Jua';font-size:1.4rem;padding:14px 28px;border-radius:999px;
  background:var(--joy);color:var(--ink);box-shadow:0 5px 0 rgba(91,74,63,.25);
}

/* ── 표정 거울 ────────────────────── */
#mirror .mirror-layout{
  display:flex;gap:18px;flex:1;align-items:stretch;justify-content:center;
  max-width:1100px;margin:0 auto;width:100%;
}
#mirror .cam-col{flex:1.4;display:flex;flex-direction:column;gap:12px;min-width:0}
#mirror .result-col{flex:1;display:flex;flex-direction:column;gap:12px;min-width:230px}
.now-face{
  background:#fff;border-radius:var(--radius);box-shadow:var(--card-shadow);
  display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px;flex:1;justify-content:center;
}
.now-face svg{width:120px;height:120px;transition:transform .2s}
.now-face .now-name{font-size:2.2rem;font-family:'Jua'}
.meter-list{display:flex;flex-direction:column;gap:8px;background:#fff;border-radius:var(--radius);
  box-shadow:var(--card-shadow);padding:16px}
.meter{display:flex;align-items:center;gap:10px;font-size:1.15rem}
.meter .m-label{width:64px;text-align:right;font-family:'Jua'}
.meter .m-bar{flex:1;height:18px;border-radius:999px;background:var(--cream2);overflow:hidden}
.meter .m-fill{height:100%;width:0%;border-radius:999px;transition:width .15s}
.debug-box{
  background:#3b3129;color:#B8F5D0;border-radius:16px;padding:10px 12px;
  font-family:monospace;font-size:.85rem;line-height:1.5;white-space:pre;
}

/* ── 표정 따라하기 ────────────────── */
#play .play-layout{
  display:flex;gap:18px;flex:1;align-items:stretch;justify-content:center;
  max-width:1100px;margin:0 auto;width:100%;
}
#play .target-col{flex:1;display:flex;flex-direction:column;gap:12px;min-width:240px}
#play .cam-col{flex:1.4;display:flex;flex-direction:column;gap:12px;min-width:0}
.target-card{
  background:#fff;border-radius:var(--radius);box-shadow:var(--card-shadow);flex:1;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;
  border:6px solid var(--joy);
}
.target-card .t-title{font-size:1.3rem;color:var(--ink-soft)}
.target-card svg{width:min(170px,38vw);height:auto}
.target-card .t-name{font-size:2.4rem;font-family:'Jua'}
.progress-wrap{background:#fff;border-radius:var(--radius);box-shadow:var(--card-shadow);padding:16px 18px;
  display:flex;flex-direction:column;gap:8px}
.progress-wrap .p-label{font-size:1.2rem;display:flex;justify-content:space-between}
.p-bar{height:30px;border-radius:999px;background:var(--cream2);overflow:hidden}
.p-fill{height:100%;width:0%;border-radius:999px;
  background:linear-gradient(90deg,var(--mint),var(--joy));transition:width .12s}
.star-row{display:flex;gap:10px;justify-content:center;font-size:2rem;min-height:2.4rem}
.star-row .got{animation:pop .4s}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.4)}100%{transform:scale(1)}}

/* 성공 오버레이 */
#successOverlay{
  position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;
  gap:16px;background:rgba(255,249,239,.92);z-index:50;text-align:center;
}
#successOverlay.show{display:flex}
#successOverlay .big{font-size:3rem;font-family:'Jua';animation:pop .5s}
#successOverlay svg{width:150px;height:150px;animation:bob 1.6s ease-in-out infinite}
.confetti{position:fixed;top:-20px;font-size:1.6rem;animation:fall linear forwards;z-index:51;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* ── 설정 ─────────────────────────── */
#settingsModal{
  position:fixed;inset:0;background:rgba(59,49,41,.45);display:none;
  align-items:center;justify-content:center;z-index:60;padding:16px;
}
#settingsModal.show{display:flex}
.settings-box{
  background:#fff;border-radius:var(--radius);box-shadow:var(--card-shadow);
  padding:24px;width:min(440px,94vw);max-height:88vh;overflow:auto;
  display:flex;flex-direction:column;gap:18px;
}
.settings-box h2{font-size:1.6rem;display:flex;align-items:center;gap:8px}
.set-group{display:flex;flex-direction:column;gap:8px}
.set-group .g-title{font-family:'Jua';font-size:1.15rem}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{
  flex:1;min-width:80px;padding:10px;border-radius:16px;background:var(--cream2);
  font-size:1.1rem;font-family:'Jua';border:3px solid transparent;
}
.seg button.on{background:var(--joy-soft);border-color:var(--joy)}
.emo-check{display:flex;gap:8px;flex-wrap:wrap}
.emo-check button{
  padding:8px 14px;border-radius:999px;background:var(--cream2);font-size:1.1rem;
  border:3px solid transparent;display:flex;align-items:center;gap:6px;
}
.emo-check button.on{background:#fff;border-color:var(--mint)}
.sens-row{display:flex;align-items:center;gap:10px;padding:4px 0;font-size:1.05rem}
.sens-row .s-label{width:70px;font-family:'Jua'}
.sens-row input[type=range]{flex:1;accent-color:var(--joy)}
.sens-row .s-val{width:38px;text-align:right;font-family:monospace}
.close-set{
  font-family:'Jua';font-size:1.25rem;padding:12px;border-radius:18px;
  background:var(--joy);box-shadow:0 4px 0 rgba(91,74,63,.2);
}

/* ── 반응형 ───────────────────────── */
@media (max-width:760px){
  #mirror .mirror-layout,#play .play-layout{flex-direction:column}
  #play .target-col{flex-direction:row;min-width:0}
  .target-card svg{width:110px}
  .target-card .t-name{font-size:1.8rem}
  header h1{font-size:1.2rem}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
  <script src="guard.js"></script>
</head>
<body>

<header>
  <div class="logo">
    <svg viewBox="0 0 100 100" id="logoMaeumi"></svg>
    <h1>마음이의 감정 교실</h1>
  </div>
  <div class="spacer"></div>
  <button class="top-btn hidden" id="homeBtn">🏠 처음으로</button>
  <button class="top-btn" id="settingsBtn">⚙️ 선생님 설정</button>
</header>

<main>
  <!-- 홈 -->
  <section class="screen active" id="home">
    <div class="mascot-hello">
      <svg viewBox="0 0 100 100" id="homeMaeumi"></svg>
      <div class="bubble jua" id="homeBubble">안녕! 나는 마음이야.<br>오늘은 마음 공부를 해 보자!</div>
    </div>
    <div class="mode-grid">
      <button class="mode-card m1" data-go="learn">
        <span class="icon">🃏</span>
        <h2>감정 카드 배우기</h2>
        <p>여러 가지 마음을<br>그림으로 알아봐요</p>
      </button>
      <button class="mode-card m2" data-go="mirror">
        <span class="icon">🪞</span>
        <h2>표정 거울</h2>
        <p>카메라가 내 표정을<br>알아맞혀요</p>
      </button>
      <button class="mode-card m3" data-go="play">
        <span class="icon">🎯</span>
        <h2>표정 따라하기</h2>
        <p>마음이 표정을 따라 하면<br>별을 받아요</p>
      </button>
    </div>
  </section>

  <!-- 감정 카드 배우기 -->
  <section class="screen" id="learn">
    <div class="emo-card" id="emoCard">
      <svg class="face" viewBox="0 0 100 100" id="learnFace"></svg>
      <div class="emo-name" id="learnName"></div>
      <div class="emo-desc" id="learnDesc"></div>
      <div class="ex-title">👆 그림을 누르면 이야기를 들려줘요</div>
      <div class="example-row" id="exampleRow"></div>
    </div>
    <div class="dots" id="learnDots"></div>
    <div class="learn-controls">
      <button class="round-btn" id="prevEmo" aria-label="이전 감정">◀</button>
      <button class="round-btn speak" id="speakEmo" aria-label="설명 듣기">🔊</button>
      <button class="round-btn" id="nextEmo" aria-label="다음 감정">▶</button>
    </div>
  </section>

  <!-- 표정 거울 -->
  <section class="screen" id="mirror">
    <div class="mirror-layout">
      <div class="cam-col">
        <div class="cam-wrap">
          <video id="mirrorVideo" playsinline muted></video>
          <div class="cam-status" id="mirrorStatus">
            <button class="start-cam-btn" id="mirrorStart">📷 카메라 켜기</button>
          </div>
        </div>
      </div>
      <div class="result-col">
        <div class="now-face">
          <svg viewBox="0 0 100 100" id="mirrorFace"></svg>
          <div class="now-name" id="mirrorName">표정을 지어 봐요!</div>
        </div>
        <div class="meter-list" id="meterList"></div>
        <button class="top-btn" id="mirrorCalib">🎯 무표정 기준 잡기</button>
        <div class="debug-box" id="debugBox" hidden></div>
      </div>
    </div>
  </section>

  <!-- 표정 따라하기 -->
  <section class="screen" id="play">
    <div class="play-layout">
      <div class="target-col">
        <div class="target-card" id="targetCard">
          <div class="t-title">이 표정을 따라 해 봐요!</div>
          <svg viewBox="0 0 100 100" id="targetFace"></svg>
          <div class="t-name" id="targetName"></div>
          <button class="top-btn" id="targetSpeak">🔊 다시 듣기</button>
          <button class="top-btn" id="playCalib">🎯 무표정 기준 잡기</button>
        </div>
        <div class="star-row" id="starRow"></div>
      </div>
      <div class="cam-col">
        <div class="cam-wrap">
          <video id="playVideo" playsinline muted></video>
          <div class="cam-status" id="playStatus">
            <button class="start-cam-btn" id="playStart">📷 카메라 켜고 시작!</button>
          </div>
        </div>
        <div class="progress-wrap">
          <div class="p-label jua"><span id="pHint">얼굴을 보여 주세요</span><span id="pPercent">0%</span></div>
          <div class="p-bar"><div class="p-fill" id="pFill"></div></div>
        </div>
      </div>
    </div>
  </section>
</main>

<!-- 성공 오버레이 -->
<div id="successOverlay">
  <svg viewBox="0 0 100 100" id="successMaeumi"></svg>
  <div class="big" id="successText">참 잘했어요! ⭐</div>
  <div class="jua" style="font-size:1.4rem;color:var(--ink-soft)" id="successSub"></div>
</div>

<!-- 선생님 설정 -->
<div id="settingsModal">
  <div class="settings-box">
    <h2>⚙️ 선생님 설정</h2>
    <div class="set-group">
      <div class="g-title">난이도 (표정 인식 민감도)</div>
      <div class="seg" id="segDiff">
        <button data-v="easy">쉬움</button>
        <button data-v="normal" class="on">보통</button>
        <button data-v="hard">어려움</button>
      </div>
    </div>
    <div class="set-group">
      <div class="g-title">따라하기 유지 시간</div>
      <div class="seg" id="segHold">
        <button data-v="1">1초</button>
        <button data-v="2" class="on">2초</button>
        <button data-v="3">3초</button>
      </div>
    </div>
    <div class="set-group">
      <div class="g-title">사용할 감정 (따라하기)</div>
      <div class="emo-check" id="emoCheck"></div>
    </div>
    <div class="set-group">
      <div class="g-title">감정별 인식 민감도 (잘 안 되는 감정만 올려 주세요)</div>
      <div id="sensSliders"></div>
    </div>
    <div class="set-group">
      <div class="g-title">음성 안내(TTS)</div>
      <div class="seg" id="segTts">
        <button data-v="on" class="on">켜기</button>
        <button data-v="off">끄기</button>
      </div>
    </div>
    <div class="set-group">
      <div class="g-title">인식 값 보기 (문제 확인용)</div>
      <div class="seg" id="segDebug">
        <button data-v="on">켜기</button>
        <button data-v="off" class="on">끄기</button>
      </div>
    </div>
    <button class="close-set" id="closeSettings">저장하고 닫기</button>
  </div>
</div>

<script type="module">
/* ══════════════════════════════════════════
   마음이의 감정 교실
   - MediaPipe Face Landmarker(blendshapes) 기반 표정 인식
   - 단일 파일 · GitHub Pages 배포용
   ══════════════════════════════════════════ */

/* ── 감정 정의 ─────────────────────────── */
const EMOTIONS = {
  joy:      {name:'기쁨',  color:'var(--joy)',      soft:'var(--joy-soft)',      emoji:'😄',
             desc:'좋아하는 일이 생기면 기뻐요.\n입꼬리가 쓱 올라가요!',
             tts:'기쁨. 좋아하는 일이 생기면 기뻐요. 활짝 웃어 볼까요?',
             examples:[
               {cap:'좋아하는 간식을 먹어요', tts:'좋아하는 간식을 먹으면 기뻐요. 냠냠, 맛있다!'},
               {cap:'친구와 재미있게 놀아요', tts:'친구와 공놀이를 하면 기뻐요. 재미있다!'},
             ]},
  sad:      {name:'슬픔',  color:'var(--sad)',      soft:'var(--sad-soft)',      emoji:'😢',
             desc:'속상한 일이 생기면 슬퍼요.\n입꼬리가 아래로 내려가요.',
             tts:'슬픔. 속상한 일이 생기면 슬퍼요. 입꼬리가 아래로 내려가요.',

/* ── TTS ──────────────────────────────── */
let koVoice = null;
function pickVoice(){
  const vs = speechSynthesis.getVoices();
  koVoice = vs.find(v=>v.lang.startsWith('ko')) || null;
}
if('speechSynthesis' in window){
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}
function speak(text){
  if(!settings.tts || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang='ko-KR'; u.rate=0.92; u.pitch=1.1;
  if(koVoice) u.voice=koVoice;
  speechSynthesis.speak(u);
}

/* ── 효과음 (Web Audio) ────────────────── */
let audioCtx=null;
function tone(freq,dur=0.15,type='sine',when=0,gain=0.18){
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=type;o.frequency.value=freq;
    g.gain.setValueAtTime(gain,audioCtx.currentTime+when);
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+when+dur);
    o.connect(g).connect(audioCtx.destination);
    o.start(audioCtx.currentTime+when);o.stop(audioCtx.currentTime+when+dur);
  }catch(e){}
}

let current='home';
function goto(id){
  screens.forEach(s=>document.getElementById(s).classList.toggle('active',s===id));
  document.getElementById('homeBtn').classList.toggle('hidden',id==='home');
  current=id;
  speechSynthesis?.cancel();
  if(id!=='mirror') stopLoop('mirror');
  if(id!=='play')   stopLoop('play');
  if(id==='learn')  renderLearn();
  if(id==='play')   setupPlayRound(true);
}
document.querySelectorAll('.mode-card').forEach(b=>{
  b.addEventListener('click',()=>{clickSound();goto(b.dataset.go);});
});
document.getElementById('homeBtn').addEventListener('click',()=>{clickSound();goto('home');});

/* ══════════════════════════════════════════
   모드 1. 감정 카드 배우기
   ══════════════════════════════════════════ */
let learnIdx=0;
function renderLearn(){
  const key=LEARN_ORDER[learnIdx], e=EMOTIONS[key];
  document.getElementById('learnFace').innerHTML=faceSVG(key);
  document.getElementById('learnName').textContent=e.name+' '+e.emoji;
  document.getElementById('learnDesc').innerHTML=e.desc.replace('\n','<br>');
  const row=document.getElementById('exampleRow');
  row.innerHTML=e.examples.map((ex,i)=>`
    <button class="ex-item" data-i="${i}" aria-label="${ex.cap} 듣기">
      ${sceneSVG(key,i)}
      <span class="cap">${ex.cap}</span>
    </button>`).join('');
  row.querySelectorAll('.ex-item').forEach(btn=>{
    btn.addEventListener('click',()=>{
      clickSound();
      row.querySelectorAll('.ex-item').forEach(x=>x.classList.remove('playing'));
      btn.classList.add('playing');
      speak(e.examples[+btn.dataset.i].tts);
      setTimeout(()=>btn.classList.remove('playing'),3000);
    });
  });
  const card=document.getElementById('emoCard');
  card.style.borderColor=e.color;
  card.style.background=`linear-gradient(180deg,#fff 55%,${e.soft})`;
  const dots=document.getElementById('learnDots');
  dots.innerHTML=LEARN_ORDER.map((k,i)=>`<span class="${i===learnIdx?'on':''}"></span>`).join('');
  speak(e.tts);
}
document.getElementById('prevEmo').addEventListener('click',()=>{
  clickSound(); learnIdx=(learnIdx-1+LEARN_ORDER.length)%LEARN_ORDER.length; renderLearn();
});
document.getElementById('nextEmo').addEventListener('click',()=>{
  clickSound(); learnIdx=(learnIdx+1)%LEARN_ORDER.length; renderLearn();
});
document.getElementById('speakEmo').addEventListener('click',()=>{
  speak(EMOTIONS[LEARN_ORDER[learnIdx]].tts);
});

/* ══════════════════════════════════════════
   MediaPipe Face Landmarker 로딩
   ══════════════════════════════════════════ */
let FaceLandmarkerCls=null, FilesetResolverCls=null, landmarker=null, loadingPromise=null;
async function ensureLandmarker(statusEl){
  if(landmarker) return landmarker;
  if(!loadingPromise){
    loadingPromise=(async()=>{
      statusEl.innerHTML=`<div class="spin"></div><div>마음이가 준비하고 있어요…<br><span style="font-size:1rem;opacity:.8">(표정 인식 모델 내려받는 중)</span></div>`;
      const vision=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14');
      FaceLandmarkerCls=vision.FaceLandmarker; FilesetResolverCls=vision.FilesetResolver;
      const fileset=await FilesetResolverCls.forVisionTasks(
        'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
      landmarker=await FaceLandmarkerCls.createFromOptions(fileset,{
        baseOptions:{
          modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
          delegate:'GPU'
        },
        outputFaceBlendshapes:true,
        runningMode:'VIDEO',
        numFaces:1
      });
      return landmarker;
    })().catch(err=>{loadingPromise=null;throw err;});
  }
  return loadingPromise;
}

/* ── 카메라 ───────────────────────────── */
async function startCamera(video){
  const stream=await navigator.mediaDevices.getUserMedia({
    video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false
  });
  video.srcObject=stream;
  await video.play();
  return stream;
}

/* ── blendshape → 감정 점수 ────────────── */
function bsMap(blendshapes){
  const m={};
  blendshapes.forEach(b=>m[b.categoryName]=b.score);
  return m;
}
function rawFeatures(m){
  const g=k=>m[k]||0;
  return {
    smile:(g('mouthSmileLeft')+g('mouthSmileRight'))/2,
    frown:Math.max(g('mouthFrownLeft'),g('mouthFrownRight')),
    shrug:g('mouthShrugLower'),
    press:(g('mouthPressLeft')+g('mouthPressRight'))/2,
    browDown:(g('browDownLeft')+g('browDownRight'))/2,
    browUp:g('browInnerUp'),
    jaw:g('jawOpen'),
    eyeWide:(g('eyeWideLeft')+g('eyeWideRight'))/2,
    squint:(g('eyeSquintLeft')+g('eyeSquintRight'))/2,
  };
}

/* 무표정 기준(개인 보정) + 스무딩 */
let baseline=null, emaScores=null, lastRawF=null;
let calibSamples=null, calibUntil=0, calibDoneCb=null;
function startCalibration(done){
  calibDoneCb=done;
  speak('편안한 얼굴로 가만히 있어 주세요.');
  setTimeout(()=>{calibSamples=[];calibUntil=performance.now()+1400;},1600);
}
function feedCalibration(f){
  if(!calibUntil) return;
  if(performance.now()<calibUntil){calibSamples.push({...f});return;}
  // 수집 종료 → 평균을 기준으로 저장
  if(calibSamples&&calibSamples.length){
    baseline={};
    for(const k in calibSamples[0]){
      baseline[k]=calibSamples.reduce((a,s)=>a+s[k],0)/calibSamples.length;
    }
  }
  calibUntil=0;calibSamples=null;emaScores=null;
  tone(784,.15);tone(1047,.25,'sine',.12);
  speak('기준 잡기 완료! 이제 표정을 지어 봐요.');
  if(calibDoneCb){calibDoneCb();calibDoneCb=null;}
}

const clamp01=v=>Math.min(1,Math.max(0,v));
function emotionScores(m){
  let f=rawFeatures(m);
  lastRawF=f;
  feedCalibration(f);
  if(baseline){
    const c={};
    for(const k in f)c[k]=Math.max(0,f[k]-baseline[k]);
    f=c;
  }
  const mult=DIFF_MULT[settings.diff];
  const per=settings.emoSens;
  const noSmile=clamp01(1-f.smile*1.6);
  let s={
    joy:      f.smile*1.35,
    sad:      (f.frown*3.2 + f.shrug*1.1 + f.browUp*0.7) * clamp01(1-f.jaw*0.9) * noSmile,
    angry:    (f.browDown*1.8 + f.squint*0.4 + f.press*0.6) * noSmile * clamp01(1-f.jaw*0.6),
    surprise: f.jaw*0.9 + f.eyeWide*0.7 + f.browUp*0.45,
  };
  for(const k in s) s[k]=clamp01(s[k]*mult*(per[k]||1));
  // 스무딩(떨림 방지)
  if(!emaScores) emaScores={...s};
  else for(const k in s) emaScores[k]=emaScores[k]*0.6+s[k]*0.4;
  const out={...emaScores};
  const top=Math.max(...Object.values(out));
  out.neutral=Math.max(0,1-top*1.6);
  return out;
}
function topEmotion(s){
  let best='neutral',v=s.neutral;
  for(const k of PLAYABLE) if(s[k]>v){best=k;v=s[k];}
  return {key:best,score:v};
}

/* ── 인식 루프 관리 ────────────────────── */
const loops={mirror:{raf:0,stream:null},play:{raf:0,stream:null}};
function stopLoop(which){
  const L=loops[which];
  if(L.raf) cancelAnimationFrame(L.raf), L.raf=0;
  if(L.stream){L.stream.getTracks().forEach(t=>t.stop());L.stream=null;}
  const v=document.getElementById(which==='mirror'?'mirrorVideo':'playVideo');
  if(v) v.srcObject=null;
  const st=document.getElementById(which==='mirror'?'mirrorStatus':'playStatus');
  if(st){st.classList.remove('hide');
    st.innerHTML=`<button class="start-cam-btn" id="${which}Start">📷 카메라 켜기</button>`;
    st.querySelector('button').addEventListener('click',which==='mirror'?startMirror:startPlay);
  }
}

/* ══════════════════════════════════════════
   모드 2. 표정 거울
   ══════════════════════════════════════════ */
const METER_KEYS=['joy','sad','angry','surprise','neutral'];
(function buildMeters(){
  const wrap=document.getElementById('meterList');
  wrap.innerHTML=METER_KEYS.map(k=>`
    <div class="meter">
      <span>${EMOTIONS[k].emoji}</span>
      <span class="m-label">${EMOTIONS[k].name}</span>
      <div class="m-bar"><div class="m-fill" id="mf_${k}" style="background:${EMOTIONS[k].color}"></div></div>
    </div>`).join('');
})();

let mirrorLastSpoken='', mirrorSpeakCooldown=0;
async function startMirror(){
  const status=document.getElementById('mirrorStatus');
  try{
    await ensureLandmarker(status);
    status.innerHTML=`<div class="spin"></div><div>카메라를 켜고 있어요…</div>`;
    loops.mirror.stream=await startCamera(document.getElementById('mirrorVideo'));
    status.classList.add('hide');
    speak('거울아 거울아! 얼굴을 보여 주세요.');
    mirrorLoop();
  }catch(err){
    status.classList.remove('hide');
    status.innerHTML=`<div>카메라를 켤 수 없어요 😢<br><span style="font-size:1rem">${camErrMsg(err)}</span></div>
      <button class="start-cam-btn">다시 해 보기</button>`;
    status.querySelector('button').addEventListener('click',startMirror);
  }
}
function mirrorLoop(){
  const video=document.getElementById('mirrorVideo');
  const run=()=>{
    if(current!=='mirror'){return;}
    if(video.readyState>=2 && landmarker){
      const res=landmarker.detectForVideo(video,performance.now());
      if(res.faceBlendshapes && res.faceBlendshapes.length){
        const s=emotionScores(bsMap(res.faceBlendshapes[0].categories));
        METER_KEYS.forEach(k=>{
          document.getElementById('mf_'+k).style.width=Math.round(s[k]*100)+'%';
        });
        const top=topEmotion(s);
        const strong = top.key!=='neutral' && top.score>DIFF_THRESH[settings.diff];
        const showKey = strong? top.key : 'neutral';
        document.getElementById('mirrorFace').innerHTML=faceSVG(showKey);
        document.getElementById('mirrorName').textContent=
          strong? `${EMOTIONS[showKey].name} ${EMOTIONS[showKey].emoji}` : '편안한 얼굴이에요';
        const now=performance.now();
        if(strong && showKey!==mirrorLastSpoken && now>mirrorSpeakCooldown){
          speak(`${EMOTIONS[showKey].name} 표정이에요!`);
          mirrorLastSpoken=showKey; mirrorSpeakCooldown=now+2500;
        }
        if(!strong) mirrorLastSpoken='';
        if(settings.debug && lastRawF){
          const d=document.getElementById('debugBox');
          d.hidden=false;
          d.textContent=Object.entries(lastRawF)
            .map(([k,v])=>`${k.padEnd(9)} ${v.toFixed(2)}${baseline?` (-${baseline[k].toFixed(2)})`:''}`)
            .join('\n');
        }else{
          document.getElementById('debugBox').hidden=true;
        }
      }else{
        document.getElementById('mirrorName').textContent='얼굴을 찾고 있어요…';
      }
    }
    loops.mirror.raf=requestAnimationFrame(run);
  };
  run();
}
document.getElementById('mirrorStart').addEventListener('click',startMirror);
function bindCalib(btnId){
  const btn=document.getElementById(btnId);
  btn.addEventListener('click',()=>{
    clickSound();
    btn.textContent='😐 편안한 얼굴로 잠깐만…';
    startCalibration(()=>{btn.textContent='✅ 기준 잡기 완료';
      setTimeout(()=>btn.textContent='🎯 무표정 기준 잡기',2500);});
  });
}
bindCalib('mirrorCalib');
bindCalib('playCalib');

/* ══════════════════════════════════════════
   모드 3. 표정 따라하기
   ══════════════════════════════════════════ */
let playTarget='joy', playProgress=0, playStars=0, playLock=false, lastTargets=[];
function pickTarget(){
  const pool=[...settings.enabled].filter(k=>PLAYABLE.includes(k));
  if(!pool.length) pool.push('joy');
  let cand=pool.filter(k=>k!==lastTargets[lastTargets.length-1]);
  if(!cand.length) cand=pool;
  const t=cand[Math.floor(Math.random()*cand.length)];
  lastTargets.push(t); if(lastTargets.length>4)lastTargets.shift();
  return t;
}
function setupPlayRound(resetStars=false){
  if(resetStars){playStars=0;renderStars();}
  playTarget=pickTarget(); playProgress=0; playLock=false;
  const e=EMOTIONS[playTarget];
  document.getElementById('targetFace').innerHTML=faceSVG(playTarget);
  document.getElementById('targetName').textContent=e.name+' '+e.emoji;
  document.getElementById('targetCard').style.borderColor=e.color;
  document.getElementById('pFill').style.width='0%';
  document.getElementById('pPercent').textContent='0%';
  document.getElementById('pHint').textContent=`${e.name} 표정을 지어 봐요!`;
  if(loops.play.stream) speak(`${e.name} 표정을 따라 해 봐요!`);
}
function renderStars(){
  const row=document.getElementById('starRow');
  row.innerHTML=Array.from({length:5},(_,i)=>
    `<span class="${i<playStars?'got':''}">${i<playStars?'⭐':'☆'}</span>`).join('');
}
renderStars();

async function startPlay(){
  const status=document.getElementById('playStatus');
  try{
    await ensureLandmarker(status);
    status.innerHTML=`<div class="spin"></div><div>카메라를 켜고 있어요…</div>`;
    loops.play.stream=await startCamera(document.getElementById('playVideo'));
    status.classList.add('hide');
    setupPlayRound();
    playLoop();
  }catch(err){
    status.classList.remove('hide');
    status.innerHTML=`<div>카메라를 켤 수 없어요 😢<br><span style="font-size:1rem">${camErrMsg(err)}</span></div>
      <button class="start-cam-btn">다시 해 보기</button>`;
    status.querySelector('button').addEventListener('click',startPlay);
  }
}
function playLoop(){
  const video=document.getElementById('playVideo');
  let lastT=performance.now();
  const run=()=>{
    if(current!=='play'){return;}
    const now=performance.now(), dt=(now-lastT)/1000; lastT=now;
    if(video.readyState>=2 && landmarker && !playLock){
      const res=landmarker.detectForVideo(video,now);
      if(res.faceBlendshapes && res.faceBlendshapes.length){
        const s=emotionScores(bsMap(res.faceBlendshapes[0].categories));
        const score=s[playTarget]||0;
        const th=DIFF_THRESH[settings.diff];
        if(score>th){
          playProgress=Math.min(1,playProgress+dt/settings.hold);
          document.getElementById('pHint').textContent='잘하고 있어요! 그대로 유지해요 👍';
        }else{
          playProgress=Math.max(0,playProgress-dt*0.5);
          document.getElementById('pHint').textContent=`${EMOTIONS[playTarget].name} 표정을 지어 봐요!`;
        }
        document.getElementById('pFill').style.width=Math.round(playProgress*100)+'%';
        document.getElementById('pPercent').textContent=Math.round(playProgress*100)+'%';
        if(playProgress>=1) roundClear();
      }else{
        document.getElementById('pHint').textContent='얼굴을 화면에 보여 주세요';
      }
    }
    loops.play.raf=requestAnimationFrame(run);
  };
  run();
}
function roundClear(){
  playLock=true;
  playStars=Math.min(5,playStars+1);
  renderStars();
  successSound();
  confetti();
  const overlay=document.getElementById('successOverlay');
  const praises=['참 잘했어요!','최고예요!','멋진 표정이에요!','정말 잘했어요!','표정 박사님이네요!'];
  const p=praises[Math.floor(Math.random()*praises.length)];
  document.getElementById('successText').textContent=p+' ⭐';
  document.getElementById('successSub').textContent=
    playStars>=5? '별 다섯 개를 모두 모았어요! 🎉' : `별 ${playStars}개 모았어요!`;
  overlay.classList.add('show');
  speak(playStars>=5? p+' 별 다섯 개를 모두 모았어요! 정말 대단해요!' : p);
  setTimeout(()=>{
    overlay.classList.remove('show');
    if(playStars>=5){playStars=0;renderStars();}
    setupPlayRound();
  }, 2600);
}
function confetti(){
  const em=['🎉','⭐','💛','🌟','🎊','💖'];
  for(let i=0;i<24;i++){
    const s=document.createElement('span');
    s.className='confetti';
    s.textContent=em[Math.floor(Math.random()*em.length)];
    s.style.left=Math.random()*100+'vw';
    s.style.animationDuration=(1.6+Math.random()*1.6)+'s';
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),3400);
  }
}
document.getElementById('playStart').addEventListener('click',startPlay);
document.getElementById('targetSpeak').addEventListener('click',()=>{
  speak(`${EMOTIONS[playTarget].name} 표정을 따라 해 봐요!`);
});

function camErrMsg(err){
  if(err&&(err.name==='NotAllowedError'||err.name==='SecurityError'))
    return '브라우저에서 카메라 사용을 허용해 주세요.';
  if(err&&err.name==='NotFoundError') return '카메라를 찾지 못했어요.';
  return '인터넷 연결과 카메라 상태를 확인해 주세요.';
}

/* ══════════════════════════════════════════
   선생님 설정
   ══════════════════════════════════════════ */
const modal=document.getElementById('settingsModal');
document.getElementById('settingsBtn').addEventListener('click',()=>{clickSound();modal.classList.add('show');});
document.getElementById('closeSettings').addEventListener('click',()=>{
  clickSound();modal.classList.remove('show');saveSettings();
});
modal.addEventListener('click',e=>{if(e.target===modal){modal.classList.remove('show');saveSettings();}});

function segBind(id,onPick){
  const seg=document.getElementById(id);
  seg.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
    seg.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); onPick(b.dataset.v); clickSound();
  }));
}
segBind('segDiff',v=>settings.diff=v);
segBind('segHold',v=>settings.hold=+v);
segBind('segTts', v=>settings.tts=(v==='on'));
segBind('segDebug',v=>{
  settings.debug=(v==='on');
  if(!settings.debug) document.getElementById('debugBox').hidden=true;
});

(function buildSensSliders(){
  const wrap=document.getElementById('sensSliders');
  wrap.innerHTML=PLAYABLE.map(k=>`
    <div class="sens-row">
      <span class="s-label">${EMOTIONS[k].emoji} ${EMOTIONS[k].name}</span>
      <input type="range" min="0.5" max="3" step="0.1" value="1" data-k="${k}" aria-label="${EMOTIONS[k].name} 민감도">
      <span class="s-val" id="sv_${k}">1.0</span>
    </div>`).join('');
  wrap.querySelectorAll('input').forEach(inp=>inp.addEventListener('input',()=>{
    settings.emoSens[inp.dataset.k]=+inp.value;
    document.getElementById('sv_'+inp.dataset.k).textContent=(+inp.value).toFixed(1);
  }));
})();
function syncSensUI(){
  document.querySelectorAll('#sensSliders input').forEach(inp=>{
    inp.value=settings.emoSens[inp.dataset.k]||1;
    document.getElementById('sv_'+inp.dataset.k).textContent=(+inp.value).toFixed(1);
  });
}

(function buildEmoCheck(){
  const wrap=document.getElementById('emoCheck');
  wrap.innerHTML=PLAYABLE.map(k=>
    `<button data-k="${k}" class="on">${EMOTIONS[k].emoji} ${EMOTIONS[k].name}</button>`).join('');
  wrap.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
    const k=b.dataset.k;
    if(settings.enabled.has(k)){
      if(settings.enabled.size<=1) return; // 최소 1개
      settings.enabled.delete(k); b.classList.remove('on');
    }else{settings.enabled.add(k); b.classList.add('on');}
    clickSound();
  }));
})();

function saveSettings(){
  try{localStorage.setItem('maeumi_emotion_settings',JSON.stringify({
    diff:settings.diff,hold:settings.hold,tts:settings.tts,
    enabled:[...settings.enabled],emoSens:settings.emoSens,debug:settings.debug
  }));}catch(e){}
}
(function loadSettings(){
  try{
    const raw=localStorage.getItem('maeumi_emotion_settings');
    if(!raw)return;
    const d=JSON.parse(raw);
    if(d.diff)settings.diff=d.diff;
    if(d.hold)settings.hold=d.hold;
    if(typeof d.tts==='boolean')settings.tts=d.tts;
    if(typeof d.debug==='boolean')settings.debug=d.debug;
    if(d.emoSens)Object.assign(settings.emoSens,d.emoSens);
    if(Array.isArray(d.enabled)&&d.enabled.length)settings.enabled=new Set(d.enabled);
    document.querySelectorAll('#segDiff button').forEach(b=>b.classList.toggle('on',b.dataset.v===settings.diff));
    document.querySelectorAll('#segHold button').forEach(b=>b.classList.toggle('on',+b.dataset.v===settings.hold));
    document.querySelectorAll('#segTts button').forEach(b=>b.classList.toggle('on',(b.dataset.v==='on')===settings.tts));
    document.querySelectorAll('#segDebug button').forEach(b=>b.classList.toggle('on',(b.dataset.v==='on')===settings.debug));
    document.querySelectorAll('#emoCheck button').forEach(b=>b.classList.toggle('on',settings.enabled.has(b.dataset.k)));
    syncSensUI();
  }catch(e){}
})();
</script>
