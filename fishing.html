<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1f7ac0">
<title>즐거운 낚시터</title>
<script src="guard.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@700&display=swap');

  :root{
    --ink:#26364a;
    --go:#ff8a3d; --go-dark:#e06a1e;
    --tap:#ff4f7b; --tap-dark:#d62f59;
    --ok:#3fbf6f; --ok-dark:#2f9c58;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{height:100%;margin:0;overflow:hidden;}
  body{
    font-family:'Jua','Gaegu',system-ui,sans-serif;color:var(--ink);
    background:#0d3550;display:flex;flex-direction:column;touch-action:manipulation;
  }
  [hidden]{display:none!important;}

  /* ---------- 위쪽 알림줄 ---------- */
  #top{
    flex:none;display:flex;align-items:center;gap:10px;padding:9px 12px;
    background:#fff;box-shadow:0 3px 12px rgba(0,0,0,.2);z-index:5;
  }
  #say{
    flex:1;font-size:clamp(19px,3.4vw,30px);text-align:center;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .chip{
    flex:none;display:flex;align-items:center;gap:5px;font-size:clamp(18px,3.2vw,26px);
    background:#eaf6ff;border-radius:999px;padding:5px 14px;
  }
  #starChip{background:#fff6dc;}
  .iconbtn{
    flex:none;width:48px;height:48px;border:0;border-radius:15px;background:#eef2f7;
    font-size:22px;cursor:pointer;color:var(--ink);
  }
  .iconbtn:active{transform:translateY(2px);}

  /* ---------- 무대 ---------- */
  #stage{position:relative;flex:1;min-height:0;overflow:hidden;}
  #scene{width:100%;height:100%;display:block;}
  #stage.shake{animation:shake .16s;}
  @keyframes shake{
    0%{transform:translate(0,0)}25%{transform:translate(-4px,2px)}
    50%{transform:translate(4px,-2px)}75%{transform:translate(-2px,-3px)}100%{transform:translate(0,0)}
  }
  .weed{transform-box:fill-box;transform-origin:bottom center;animation:sway 4.5s ease-in-out infinite;}
  .weed:nth-of-type(2){animation-duration:5.6s;animation-delay:-1.4s;}
  .weed:nth-of-type(3){animation-duration:6.2s;animation-delay:-2.6s;}
  @keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(6deg)}}
  @keyframes tankSway{0%,100%{transform:translate(-5px,0) rotate(-4deg)}50%{transform:translate(5px,-3px) rotate(4deg)}}

  /* ---------- 잡은 친구를 담아 두는 통발 ---------- */
  #tank{
    position:absolute;right:10px;top:10px;z-index:3;
    width:min(288px,44%);height:116px;
    /* 대나무를 엮은 느낌 : 빗금 두 겹 + 나뭇결 색 */
    background:
      repeating-linear-gradient(48deg, rgba(110,72,24,.20) 0 5px, transparent 5px 11px),
      repeating-linear-gradient(-48deg, rgba(110,72,24,.16) 0 5px, transparent 5px 11px),
      linear-gradient(#eccb96,#c9994f);
    border:4px solid #a97c3c;
    border-radius:20px 46px 46px 20px / 20px 58px 58px 20px;
    box-shadow:0 7px 18px rgba(0,0,0,.32), inset 0 -7px 0 rgba(90,58,20,.18),
               inset 0 4px 0 rgba(255,240,210,.35);
  }
  /* 통발 아가리 */
  #tank::after{
    content:'';position:absolute;right:-2px;top:50%;transform:translateY(-50%);
    width:26px;height:78%;border-radius:50%;
    background:radial-gradient(ellipse at 30% 50%, rgba(60,35,10,.55), rgba(60,35,10,.18));
    box-shadow:inset 2px 0 6px rgba(0,0,0,.35);
  }
  /* 테를 두른 띠 */
  #tank::before{
    content:'';position:absolute;left:0;right:0;top:calc(50% - 4px);height:8px;
    background:rgba(140,96,40,.35);
  }
  #tank .lbl{
    position:absolute;left:50%;top:-13px;transform:translateX(-50%);
    white-space:nowrap;font-size:15px;color:#5a3c14;background:#ffe9c4;
    border:3px solid #a97c3c;border-radius:999px;padding:1px 12px;z-index:3;
  }
  #tankSvg{position:relative;width:100%;height:100%;display:block;z-index:2;}

  /* ---------- 아래쪽 큰 버튼 ---------- */
  #bottom{flex:none;padding:10px 12px 12px;background:#0d3550;}
  .big{
    width:100%;border:0;border-radius:24px;cursor:pointer;color:#fff;font-family:inherit;
    font-size:clamp(24px,5vw,42px);padding:20px 14px;background:var(--go);
    box-shadow:0 8px 0 var(--go-dark);
  }
  .big:active{transform:translateY(5px);box-shadow:0 3px 0 var(--go-dark);}
  .big[disabled]{background:#98a6b5;box-shadow:0 8px 0 #7d8996;}

  /* ---------- 연타 화면 ---------- */
  #tapLayer{
    position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;
    align-items:center;justify-content:flex-end;gap:14px;padding:14px;
    background:rgba(10,40,70,.26);cursor:pointer;
  }
  #gaugeBox{
    position:relative;width:min(760px,96%);height:44px;background:rgba(255,255,255,.88);
    border-radius:999px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  #gauge{
    height:100%;width:0%;border-radius:999px;
    background:linear-gradient(90deg,#ffd54a,#ff8a3d,#ff4f7b);transition:width .12s ease-out;
  }
  #gaugeFace{
    position:absolute;top:50%;left:0;transform:translate(-50%,-50%);font-size:30px;
    transition:left .12s ease-out;pointer-events:none;
  }
  #tapBtn{
    width:min(620px,96%);border:0;border-radius:32px;color:#fff;font-family:inherit;
    font-size:clamp(32px,7.5vw,68px);padding:26px 14px;cursor:pointer;
    background:var(--tap);box-shadow:0 10px 0 var(--tap-dark);
  }
  #tapLayer.hit #tapBtn{transform:translateY(6px) scale(.985);box-shadow:0 4px 0 var(--tap-dark);}

  /* ---------- 잡았다 화면 ---------- */
  #cheer{
    position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:6px;pointer-events:none;
  }
  #cheerIcon{font-size:clamp(90px,22vw,190px);animation:jump .6s cubic-bezier(.2,1.7,.4,1);line-height:1;}
  #cheerName{
    font-size:clamp(34px,8vw,74px);color:#fff;
    text-shadow:0 5px 0 var(--go),0 9px 22px rgba(0,0,0,.4);
    animation:jump .6s cubic-bezier(.2,1.7,.4,1) .06s backwards;
  }
  @keyframes jump{from{transform:scale(.3) translateY(40px);opacity:0}to{transform:none;opacity:1}}

  /* ---------- 설정 ---------- */
  #setup{
    position:absolute;inset:0;z-index:9;background:rgba(13,53,80,.94);
    display:flex;align-items:center;justify-content:center;padding:14px;overflow:auto;
  }
  .panel{background:#fff;border-radius:24px;padding:20px;width:min(560px,100%);
         display:flex;flex-direction:column;gap:14px;}
  .panel h2{margin:0;text-align:center;font-size:25px;}
  .field{display:flex;flex-direction:column;gap:7px;}
  .field > span{font-size:19px;color:#5a6b7d;}
  .opts{display:flex;gap:7px;flex-wrap:wrap;}
  .opt{flex:1;min-width:82px;border:3px solid #dfe7ef;background:#f7fafd;border-radius:15px;
       padding:13px 5px;font-family:inherit;font-size:19px;color:var(--ink);cursor:pointer;}
  .opt.on{border-color:var(--go);background:#fff3e8;}
  .panel .big{font-size:26px;padding:16px;background:var(--ok);box-shadow:0 8px 0 var(--ok-dark);}
  .panel .reset{background:#eef2f7;color:#5a6b7d;box-shadow:0 6px 0 #cfd8e2;font-size:20px;padding:12px;}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>

<div id="top">
  <div class="chip" id="fishChip">🪣 <span id="count">0</span></div>
  <div id="say">낚싯대를 내려 보세요</div>
  <div class="chip" id="starChip">⭐ <span id="stars">0</span></div>
  <button class="iconbtn" id="bgmBtn" title="배경음악 켜기·끄기">🎵</button>
  <button class="iconbtn" id="openSetup" title="설정">⚙️</button>
</div>

<audio id="bgm" src="aquarium.mp3" loop preload="auto"></audio>

<div id="stage">
  <svg id="scene" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#bfe9ff"/><stop offset="1" stop-color="#e9f7ff"/>
      </linearGradient>
      <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#4bb3e8"/><stop offset="1" stop-color="#1668a8"/>
      </linearGradient>
      <radialGradient id="sunG"><stop offset="0" stop-color="#fff3b0"/><stop offset="1" stop-color="#ffd54a"/></radialGradient>
    </defs>

    <!-- 하늘 -->
    <rect width="1000" height="260" fill="url(#sky)"/>
    <circle cx="862" cy="66" r="46" fill="url(#sunG)"/>
    <g fill="#fff" opacity=".92">
      <ellipse cx="180" cy="70" rx="54" ry="30"/><ellipse cx="230" cy="80" rx="42" ry="24"/>
      <ellipse cx="620" cy="46" rx="46" ry="26"/><ellipse cx="666" cy="56" rx="34" ry="20"/>
    </g>
    <g id="birds" fill="none" stroke="#8aa7bd" stroke-width="4" stroke-linecap="round">
      <path d="M700 96q10-10 20 0q10-10 20 0"/><path d="M756 122q8-8 16 0q8-8 16 0"/>
    </g>

    <!-- 바다 -->
    <rect y="260" width="1000" height="440" fill="url(#sea)"/>
    <path id="wave" d="M0 262 q62 -16 125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 V300 H0Z" fill="#8fd6f7" opacity=".55"/>
    <g opacity=".45" fill="#bfeaff">
      <ellipse cx="200" cy="332" rx="70" ry="9"/><ellipse cx="700" cy="302" rx="90" ry="10"/>
    </g>

    <!-- 바닥 -->
    <path d="M0 640 q120 -34 250 -10 t250 -6 t250 8 t250 -12 V700 H0Z" fill="#e6cf9b"/>
    <g fill="#3f9a63">
      <path class="weed" d="M120 640q-14-56 8-96q10 44 22 96z"/>
      <path class="weed" d="M156 640q-6-42 16-70q4 34 8 70z"/>
      <path class="weed" d="M842 640q-16-60 6-100q12 46 24 100z"/>
    </g>
    <g fill="#9fb0bd"><ellipse cx="430" cy="648" rx="46" ry="18"/><ellipse cx="650" cy="656" rx="34" ry="13"/></g>
    <g id="bubbles"></g>

    <!-- 부두와 낚싯대 -->
    <g>
      <rect x="-10" y="196" width="300" height="26" rx="6" fill="#b3813f"/>
      <rect x="-10" y="222" width="300" height="10" fill="#8f6530"/>
      <rect x="40" y="232" width="20" height="120" fill="#8f6530"/>
      <rect x="210" y="232" width="20" height="120" fill="#8f6530"/>
      <path d="M250 196 Q400 120 560 118" stroke="#5c4327" stroke-width="11" fill="none" stroke-linecap="round"/>
      <circle cx="300" cy="176" r="13" fill="#e0e6ec" stroke="#98a6b5" stroke-width="4"/>
    </g>

    <!-- 낚싯줄과 바늘 -->
    <line id="line" x1="560" y1="118" x2="560" y2="150" stroke="#f2f7fa" stroke-width="3"/>
    <g id="hook">
      <path d="M0 -16 v14 q0 16 -13 16 q-13 0 -13 -13" stroke="#dfe7ee" stroke-width="5" fill="none" stroke-linecap="round"/>
      <circle cx="0" cy="-18" r="5" fill="#dfe7ee"/>
    </g>

    <g id="fishes"></g>
    <g id="fx"></g>
  </svg>

  <!-- 잡은 물고기 수조 -->
  <div id="tank">
    <span class="lbl">🧺 내가 잡은 친구들</span>
    <svg id="tankSvg" viewBox="0 0 288 116" preserveAspectRatio="xMidYMid meet"><g id="tankFish"></g></svg>
  </div>

  <!-- 연타 -->
  <div id="tapLayer" hidden>
    <div id="gaugeBox"><div id="gauge"></div><div id="gaugeFace">🐟</div></div>
    <button id="tapBtn">👆 눌러요!</button>
  </div>

  <!-- 잡았다 -->
  <div id="cheer" hidden>
    <div id="cheerIcon">🐟</div>
    <div id="cheerName">잡았다!</div>
  </div>

  <!-- 설정 -->
  <div id="setup" hidden>
    <div class="panel">
      <h2>⚙️ 설정</h2>
      <div class="field">
        <span>몇 번 눌러야 잡히나요?</span>
        <div class="opts" id="optTaps">
          <button class="opt" data-v="2">2번</button>
          <button class="opt" data-v="3">3번</button>
          <button class="opt" data-v="5">5번</button>
          <button class="opt" data-v="8">8번</button>
        </div>
      </div>
      <div class="field">
        <span>물고기 빠르기</span>
        <div class="opts" id="optSpeed">
          <button class="opt" data-v="0">멈춤</button>
          <button class="opt" data-v="0.35">아주 느림</button>
          <button class="opt" data-v="0.7">느림</button>
          <button class="opt" data-v="1.2">보통</button>
        </div>
      </div>
      <div class="field">
        <span>특별한 친구 (문어·게·거북이·보석)</span>
        <div class="opts" id="optSpecial">
          <button class="opt" data-v="1">나오기</button>
          <button class="opt" data-v="0">물고기만</button>
        </div>
      </div>
      <div class="field">
        <span>소리와 떨림</span>
        <div class="opts" id="optSound">
          <button class="opt" data-v="1">켜기</button>
          <button class="opt" data-v="0">끄기</button>
        </div>
      </div>
      <div class="field">
        <span>배경음악</span>
        <div class="opts" id="optBgm">
          <button class="opt" data-v="1">켜기</button>
          <button class="opt" data-v="0">끄기</button>
        </div>
      </div>
      <button class="big" id="closeSetup">시작하기</button>
      <button class="big reset" id="resetAll">수조 비우기</button>
    </div>
  </div>
</div>

<div id="bottom">
  <button class="big" id="mainBtn">🎣 낚싯대 내리기</button>
</div>

<script>
/* =========================================================
   즐거운 낚시터
   - 중도발달장애 학생을 위한 낚시 게임입니다.
   - 실패가 없습니다. 물고기는 반드시 잡히고, 늦게 눌러도 괜찮습니다.
   - 연타는 화면 아무 곳이나 눌러도 되고, 스페이스바·엔터도 됩니다.
     (스위치 보조기기가 대개 이 키를 보냅니다)
   ========================================================= */

const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';

const stage=$('stage'), line=$('line'), hook=$('hook'), fishesG=$('fishes'), fxG=$('fx'),
      bubblesG=$('bubbles'), say=$('say'), countEl=$('count'), starsEl=$('stars'),
      mainBtn=$('mainBtn'), tapLayer=$('tapLayer'), gauge=$('gauge'), gaugeFace=$('gaugeFace'),
      tapBtn=$('tapBtn'), cheer=$('cheer'), cheerIcon=$('cheerIcon'), cheerName=$('cheerName'),
      setup=$('setup'), tankFish=$('tankFish');

const ROD_X = 560, ROD_Y = 118, REST_Y = 150;

/* ---------- 나오는 친구들 ---------- */
const SPECIES = [
  { key:'o', kind:'draw',  c:'#ff8a3d', name:'주황 물고기', size:1,   mul:1,   w:10 },
  { key:'y', kind:'draw',  c:'#ffd54a', name:'노랑 물고기', size:1,   mul:1,   w:10 },
  { key:'p', kind:'draw',  c:'#ff6f91', name:'분홍 물고기', size:1,   mul:1,   w:10 },
  { key:'g', kind:'draw',  c:'#7ee0c0', name:'초록 물고기', size:1,   mul:1,   w:10 },
  { key:'v', kind:'draw',  c:'#b79cff', name:'보라 물고기', size:1,   mul:1,   w:10 },
  { key:'b', kind:'draw',  c:'#5ac8fa', name:'파랑 물고기', size:1,   mul:1,   w:10 },
  { key:'K', kind:'draw',  c:'#ff4f7b', name:'왕 물고기',   size:1.7, mul:2,   w:6, special:true, star:1 },
  { key:'O', kind:'emoji', e:'🐙',      name:'문어',       size:1.3, mul:1.5, w:5, special:true },
  { key:'P', kind:'emoji', e:'🐡',      name:'복어',       size:1.1, mul:1,   w:5, special:true },
  { key:'C', kind:'emoji', e:'🦀',      name:'게',         size:1.1, mul:1,   w:4, special:true },
  { key:'T', kind:'emoji', e:'🐢',      name:'거북이',     size:1.4, mul:1.5, w:3, special:true, star:1 },
  { key:'J', kind:'emoji', e:'💎',      name:'보석',       size:1.1, mul:1,   w:3, special:true, star:2 }
];
const byKey = k => SPECIES.find(s => s.key === k) || SPECIES[0];

function pickSpecies(){
  const pool = SPECIES.filter(s => cfg.special ? true : !s.special);
  const total = pool.reduce((a,s) => a + s.w, 0);
  let r = Math.random() * total;
  for(const s of pool){ if((r -= s.w) <= 0) return s; }
  return pool[0];
}

/* ---------- 설정 ---------- */
const DEF = { taps:5, speed:0.7, sound:1, special:1, bgm:1 };
let cfg = Object.assign({}, DEF);
try{ cfg = Object.assign(cfg, JSON.parse(localStorage.getItem('fishing-cfg') || '{}')); }catch(e){}
function saveCfg(){ try{ localStorage.setItem('fishing-cfg', JSON.stringify(cfg)); }catch(e){} }

const OPTMAP = [['optTaps','taps'],['optSpeed','speed'],['optSound','sound'],
                ['optSpecial','special'],['optBgm','bgm']];
function paintOpts(){
  OPTMAP.forEach(([box,key]) => {
    [...$(box).children].forEach(b => b.classList.toggle('on', +b.dataset.v === +cfg[key]));
  });
}
OPTMAP.forEach(([box,key]) => {
  $(box).addEventListener('click', e => {
    const b = e.target.closest('.opt'); if(!b) return;
    cfg[key] = +b.dataset.v; saveCfg(); paintOpts();
    if(key === 'bgm') applyBgm();
  });
});
$('openSetup').addEventListener('click', () => { setup.hidden = false; paintOpts(); });
$('closeSetup').addEventListener('click', () => { setup.hidden = true; });
$('resetAll').addEventListener('click', () => {
  caught.length = 0; saveCaught(); drawTank();
  countEl.textContent = 0; starsEl.textContent = 0;
  setup.hidden = true; tell('다시 시작해요!');
});

/* ---------- 소리 (파일 없이 만들어 냅니다) ---------- */
let ac = null;
function beep(freq, dur, type, vol){
  if(!cfg.sound) return;
  try{
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if(ac.state === 'suspended') ac.resume();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0, ac.currentTime);
    g.gain.linearRampToValueAtTime(vol || .18, ac.currentTime + .012);
    g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + (dur || .12));
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime + (dur || .12) + .02);
  }catch(e){}
}
function buzz(p){ if(cfg.sound){ try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} } }
function chime(notes){ (notes || [523,659,784,1047]).forEach((f,i) => setTimeout(() => beep(f,.26,'triangle',.2), i*110)); }

/* ---------- 물고기 ---------- */
const fish = [];
function fishMarkup(sp){
  if(sp.kind === 'emoji'){
    return '<text y="' + (20*sp.size) + '" font-size="' + (64*sp.size) +
           '" text-anchor="middle">' + sp.e + '</text>';
  }
  const c = sp.c, s = sp.size;
  return '<g transform="scale(' + s + ')">' +
    '<ellipse rx="46" ry="28" fill="' + c + '"/>' +
    '<path d="M40 0 l34 -24 v48z" fill="' + c + '" opacity=".85"/>' +
    '<path d="M-6 -26 q16 -18 30 -2z" fill="' + c + '" opacity=".7"/>' +
    '<circle cx="-22" cy="-7" r="8" fill="#fff"/>' +
    '<circle cx="-24" cy="-7" r="4" fill="#26364a"/>' +
    '<path d="M-34 6 q10 8 20 2" stroke="#26364a" stroke-width="3" fill="none" stroke-linecap="round"/>' +
    (sp.key === 'K' ? '<path d="M-8 -30 l14 -16 l14 16z" fill="#ffd54a"/>' : '') +
  '</g>';
}
/* 잡은 친구를 크게 보여 줄 때 쓰는 그림
   - 이모지 친구는 이모지 그대로
   - 그린 물고기는 그 색 그대로 (파란 🐟 로 뭉뚱그리지 않습니다) */
function iconHTML(sp, w, h){
  if(sp.kind === 'emoji') return sp.e;
  return '<svg viewBox="-66 -52 160 104" width="' + w + '" height="' + h +
         '" style="display:inline-block;vertical-align:middle">' +
         fishMarkup(Object.assign({}, sp, { size:1 })) + '</svg>';
}

function makeFish(y, base, sp){
  sp = sp || pickSpecies();
  const g = document.createElementNS(NS, 'g');
  g.innerHTML = fishMarkup(sp);
  fishesG.appendChild(g);
  fish.push({
    el:g, sp, y, speedBase:base, t: Math.random()*6,
    x: 120 + Math.random()*760,
    dir: Math.random() < .5 ? -1 : 1,
    get spd(){ return this.speedBase * cfg.speed; }
  });
}
[[350,.9],[430,1.15],[505,.75],[575,1.0],[625,.85]].forEach(d => makeFish(d[0], d[1]));

function drawFish(f){
  const bob = Math.sin(f.t) * 6;
  f.el.setAttribute('transform',
    'translate(' + f.x.toFixed(1) + ',' + (f.y + bob).toFixed(1) + ') scale(' + f.dir + ',1)');
}

/* ---------- 잡은 친구 수조 ---------- */
let caught = [];
try{ caught = JSON.parse(localStorage.getItem('fishing-caught') || '[]'); }catch(e){}
function saveCaught(){ try{ localStorage.setItem('fishing-caught', JSON.stringify(caught.slice(-60))); }catch(e){} }

function drawTank(){
  tankFish.innerHTML = '';
  const show = caught.slice(-8);          // 최근에 잡은 여덟만 통발에 보입니다
  show.forEach((k, i) => {
    const sp = byKey(k);
    const x = 40 + (i % 4) * 60, y = 38 + Math.floor(i / 4) * 42;
    const outer = document.createElementNS(NS, 'g');       // 자리
    outer.setAttribute('transform', 'translate(' + x + ',' + y + ')');
    const inner = document.createElementNS(NS, 'g');       // 흔들림
    inner.innerHTML = sp.kind === 'emoji'
      ? '<text y="9" font-size="27" text-anchor="middle">' + sp.e + '</text>'
      : '<g transform="scale(0.32)"><ellipse rx="46" ry="28" fill="' + sp.c + '"/>' +
        '<path d="M40 0 l34 -24 v48z" fill="' + sp.c + '"/>' +
        '<circle cx="-22" cy="-7" r="8" fill="#fff"/><circle cx="-24" cy="-7" r="4" fill="#26364a"/></g>';
    inner.style.animation = 'tankSway ' + (2.4 + (i % 5) * .35) + 's ease-in-out infinite';
    inner.style.animationDelay = (-i * .3) + 's';
    outer.appendChild(inner);
    tankFish.appendChild(outer);
  });
  if(caught.length > 8){
    const t = document.createElementNS(NS, 'text');
    t.setAttribute('x', 274); t.setAttribute('y', 104);
    t.setAttribute('text-anchor', 'end'); t.setAttribute('font-size', 19);
    t.setAttribute('fill', '#5a3c14'); t.setAttribute('font-family', 'Jua, sans-serif');
    t.textContent = '+' + (caught.length - 8);
    tankFish.appendChild(t);
  }
}
countEl.textContent = caught.length;
starsEl.textContent = caught.reduce((a,k) => a + (byKey(k).star || 0), 0);
drawTank();

/* ---------- 상태 ---------- */
let state = 'idle';
let hookY = REST_Y, target = null, taps = 0, need = 5, last = performance.now();

function setHook(y){
  hookY = y;
  line.setAttribute('y2', y);
  hook.setAttribute('transform', 'translate(' + ROD_X + ',' + y + ')');
}
setHook(REST_Y);
function tell(t){ say.textContent = t; }

/* ---------- 되풀이 ---------- */
function loop(now){
  const dt = Math.min(50, now - last); last = now;
  for(const f of fish){
    f.t += dt / 420;
    if(f !== target && state !== 'bite' && state !== 'up'){
      f.x += f.dir * f.spd * dt * 0.06;
      if(f.x < 90){ f.x = 90; f.dir = 1; }
      if(f.x > 910){ f.x = 910; f.dir = -1; }
    }else if(f !== target){
      f.x += f.dir * f.spd * dt * 0.02;      // 다른 물고기는 천천히
      if(f.x < 90 || f.x > 910) f.dir *= -1;
    }
    if(f === target && (state === 'bite' || state === 'up')){
      f.x += (ROD_X - f.x) * 0.12;
      f.y += (hookY + 14 - f.y) * 0.18;
    }
    drawFish(f);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ---------- 물방울 ---------- */
setInterval(() => {
  if(document.hidden || bubblesG.childElementCount > 14) return;
  const c = document.createElementNS(NS, 'circle');
  const x = 60 + Math.random() * 880, r = 4 + Math.random() * 8;
  c.setAttribute('cx', x); c.setAttribute('cy', 660); c.setAttribute('r', r);
  c.setAttribute('fill', '#dff4ff'); c.setAttribute('opacity', '.6');
  bubblesG.appendChild(c);
  const t0 = performance.now(), dur = 3600 + Math.random() * 2200;
  (function rise(now){
    const p = (now - t0) / dur;
    if(p >= 1){ c.remove(); return; }
    c.setAttribute('cy', 660 - p * 380);
    c.setAttribute('cx', x + Math.sin(p * 9) * 12);
    c.setAttribute('opacity', (.6 * (1 - p)).toFixed(2));
    requestAnimationFrame(rise);
  })(performance.now());
}, 700);

/* ---------- ① 낚싯대 내리기 ---------- */
function lower(){
  if(state !== 'idle') return;
  state = 'down';
  mainBtn.disabled = true;
  tell('내려갑니다…');
  beep(320, .18, 'sine', .14);

  target = fish.reduce((a,b) => Math.abs(b.x - ROD_X) < Math.abs(a.x - ROD_X) ? b : a);
  need = Math.max(2, Math.round(cfg.taps * target.sp.mul));

  const from = hookY, to = target.y - 16, t0 = performance.now(), dur = 1300;
  (function step(now){
    const p = Math.min(1, (now - t0) / dur);
    setHook(from + (to - from) * (p < .5 ? 2*p*p : 1 - Math.pow(-2*p + 2, 2)/2));
    if(p < 1) requestAnimationFrame(step); else bite();
  })(performance.now());
}

/* ---------- ② 입질 → 연타 ---------- */
function bite(){
  state = 'bite'; taps = 0;
  gauge.style.width = '0%';
  gaugeFace.style.left = '0%';
  gaugeFace.innerHTML = iconHTML(target.sp, '42px', '27px');
  tapBtn.textContent = '👆 눌러요!';
  tapLayer.hidden = false;
  tell(target.sp.special ? (target.sp.name + '다! 눌러요!') : '물고기다! 눌러요!');
  beep(220, .12, 'square', .16); setTimeout(() => beep(180, .16, 'square', .16), 130);
  buzz([40,60,40]);
  splash(ROD_X, target.y - 10, 6);
}

function onTap(){
  if(state !== 'bite') return;
  taps++;
  const p = Math.min(1, taps / need);
  gauge.style.width = (p * 100) + '%';
  gaugeFace.style.left = (p * 100) + '%';
  beep(300 + p * 500, .09, 'triangle', .16);
  buzz(25);
  tapLayer.classList.add('hit');
  setTimeout(() => tapLayer.classList.remove('hit'), 90);
  stage.classList.remove('shake'); void stage.offsetWidth; stage.classList.add('shake');
  setHook(REST_Y + (target.y - 16 - REST_Y) * (1 - p));
  splash(ROD_X, hookY, 4);
  if(taps >= need) done();
}

tapLayer.addEventListener('pointerdown', e => { e.preventDefault(); onTap(); });
tapBtn.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); onTap(); });
document.addEventListener('keydown', e => {
  if(e.repeat) return;
  if(e.code === 'Space' || e.code === 'Enter' || e.code === 'NumpadEnter'){
    e.preventDefault();
    if(state === 'bite') onTap();
    else if(state === 'idle' && setup.hidden) lower();
  }
});

/* ---------- ③ 잡았다 ---------- */
function done(){
  state = 'up';
  tapLayer.hidden = true;
  const sp = target.sp;

  cheerIcon.innerHTML = iconHTML(sp, '1em', '0.65em');
  cheerName.textContent = sp.name + '!';
  cheer.hidden = false;
  tell(sp.name + ' 잡았다!');
  chime(sp.special ? [523,659,784,1047,1319] : [523,659,784]);
  buzz([60,40,120]);
  sparkle(ROD_X, REST_Y, sp.special ? 26 : 14);

  caught.push(sp.key); saveCaught(); drawTank();
  countEl.textContent = caught.length;
  starsEl.textContent = +starsEl.textContent + (sp.star || 0);

  const milestone = caught.length % 5 === 0;
  if(milestone) setTimeout(() => { party(); tell('대단해요! ' + caught.length + '마리!'); }, 700);

  setTimeout(() => {
    cheer.hidden = true;
    target.el.remove();
    const i = fish.indexOf(target); if(i > -1) fish.splice(i, 1);
    makeFish(340 + Math.random() * 280, .8 + Math.random() * .4);
    target = null;
    setHook(REST_Y);
    state = 'idle';
    mainBtn.disabled = false;
    if(!milestone) tell('또 해 볼까요?');
  }, milestone ? 2600 : 1900);
}

/* ---------- 효과 ---------- */
function fly(el, x, y, dx, dy, dur, spin){
  const t0 = performance.now();
  (function step(now){
    const p = (now - t0) / dur;
    if(p >= 1){ el.remove(); return; }
    el.setAttribute('transform',
      'translate(' + (x + dx*p) + ',' + (y + dy*p + 220*p*p) + ')' + (spin ? ' rotate(' + (p*420) + ')' : ''));
    el.setAttribute('opacity', (1 - p).toFixed(2));
    requestAnimationFrame(step);
  })(performance.now());
}
function sparkle(x, y, n){
  for(let i = 0; i < n; i++){
    const g = document.createElementNS(NS, 'g');
    const c = document.createElementNS(NS, 'circle');
    c.setAttribute('r', 4 + Math.random() * 8);
    c.setAttribute('fill', ['#ffd54a','#fff','#ff8a3d','#7ee0c0','#ff6f91'][i % 5]);
    g.appendChild(c); fxG.appendChild(g);
    const a = Math.random() * Math.PI * 2, d = 50 + Math.random() * 110;
    fly(g, x, y, Math.cos(a) * d, Math.sin(a) * d - 40, 900);
  }
}
function splash(x, y, n){
  for(let i = 0; i < n; i++){
    const g = document.createElementNS(NS, 'g');
    const c = document.createElementNS(NS, 'ellipse');
    c.setAttribute('rx', 5 + Math.random() * 6); c.setAttribute('ry', 4 + Math.random() * 5);
    c.setAttribute('fill', '#dff4ff'); c.setAttribute('opacity', '.9');
    g.appendChild(c); fxG.appendChild(g);
    fly(g, x, y, (Math.random() - .5) * 150, -60 - Math.random() * 70, 620);
  }
}
function party(){
  chime([784,988,1175,1568]);
  buzz([80,50,80,50,150]);
  for(let i = 0; i < 40; i++){
    const g = document.createElementNS(NS, 'g');
    const r = document.createElementNS(NS, 'rect');
    r.setAttribute('width', 14); r.setAttribute('height', 9); r.setAttribute('rx', 2);
    r.setAttribute('x', -7); r.setAttribute('y', -4);
    r.setAttribute('fill', ['#ffd54a','#ff8a3d','#ff4f7b','#7ee0c0','#5ac8fa','#b79cff'][i % 6]);
    g.appendChild(r); fxG.appendChild(g);
    fly(g, 100 + Math.random() * 800, 120, (Math.random() - .5) * 220, 60 + Math.random() * 120, 1800, true);
  }
}

/* ---------- 물결 ---------- */
const wave = $('wave');
setInterval(() => {
  if(document.hidden) return;
  wave.setAttribute('transform', 'translate(' + (Math.sin(Date.now()/1400) * 22).toFixed(1) + ',0)');
}, 60);

/* ---------- 배경음악 ----------
   브라우저는 사용자가 화면을 한 번 누르기 전에는 소리를 내 주지 않습니다.
   그래서 첫 누름·첫 키 입력 때 재생을 시작합니다. */
const bgm = $('bgm'), bgmBtn = $('bgmBtn');
bgm.volume = .32;                       // 효과음이 묻히지 않도록 작게
let bgmReady = false;

function applyBgm(){
  bgmBtn.textContent = cfg.bgm ? '🎵' : '🔇';
  bgmBtn.style.opacity = cfg.bgm ? '1' : '.5';
  if(cfg.bgm && bgmReady) bgm.play().catch(() => {});
  else bgm.pause();
}
['pointerdown','keydown'].forEach(ev => document.addEventListener(ev, () => {
  bgmReady = true;                       // 한 번에 안 되면 다음 누름에 다시 시도합니다
  if(cfg.bgm && bgm.paused) bgm.play().catch(() => {});
}));
bgmBtn.addEventListener('click', () => {
  cfg.bgm = cfg.bgm ? 0 : 1;
  saveCfg(); paintOpts(); bgmReady = true; applyBgm();
});
document.addEventListener('visibilitychange', () => {
  if(document.hidden) bgm.pause();
  else if(cfg.bgm && bgmReady) bgm.play().catch(() => {});
});
applyBgm();

mainBtn.addEventListener('click', lower);
paintOpts();
</script>
</body>
</html>
