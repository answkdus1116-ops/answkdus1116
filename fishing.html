<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1f7ac0">
<title>즐거운 낚시터</title>
<script src="guard.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@700&display=swap');

  :root{
    --ink:#26364a;
    --go:#ff8a3d; --go-dark:#e06a1e;
    --tap:#ff4f7b; --tap-dark:#d62f59;
    --ok:#3fbf6f; --ok-dark:#2f9c58;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{height:100%;margin:0;overflow:hidden;}
  body{
    font-family:'Jua','Gaegu',system-ui,sans-serif;color:var(--ink);
    background:#0d3550;display:flex;flex-direction:column;touch-action:manipulation;
  }
  [hidden]{display:none!important;}

  /* ---------- 위쪽 알림줄 ---------- */
  #top{
    flex:none;display:flex;align-items:center;gap:8px;padding:8px 10px;
    background:#fff;box-shadow:0 3px 12px rgba(0,0,0,.2);z-index:5;
  }
  #say{
    flex:1;font-size:clamp(18px,3.2vw,29px);text-align:center;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .chip{
    flex:none;display:flex;align-items:center;gap:5px;font-size:clamp(17px,3vw,25px);
    background:#eaf6ff;border-radius:999px;padding:5px 13px;
  }
  #starChip{background:#fff6dc;}
  .chip.pop{animation:chipPop .45s;}
  @keyframes chipPop{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1)}}
  .iconbtn{
    flex:none;width:46px;height:46px;border:0;border-radius:14px;background:#eef2f7;
    font-size:21px;cursor:pointer;color:var(--ink);
  }
  .iconbtn:active{transform:translateY(2px);}

  /* ---------- 무대 ---------- */
  #stage{position:relative;flex:1;min-height:0;overflow:hidden;}
  #scene{width:100%;height:100%;display:block;}
  #stage.shake{animation:shake .16s;}
  @keyframes shake{
    0%{transform:translate(0,0)}25%{transform:translate(-4px,2px)}
    50%{transform:translate(4px,-2px)}75%{transform:translate(-2px,-3px)}100%{transform:translate(0,0)}
  }
  .weed{transform-box:fill-box;transform-origin:bottom center;animation:sway 4.5s ease-in-out infinite;}
  .weed:nth-of-type(2){animation-duration:5.6s;animation-delay:-1.4s;}
  .weed:nth-of-type(3){animation-duration:6.2s;animation-delay:-2.6s;}
  @keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(6deg)}}
  @keyframes tankSway{0%,100%{transform:translate(-5px,0) rotate(-4deg)}50%{transform:translate(5px,-3px) rotate(4deg)}}
  /* 밤하늘 별이 천천히 깜박입니다 (빠른 깜박임은 쓰지 않습니다) */
  .tw{animation:twinkle 3.4s ease-in-out infinite;}
  .tw:nth-of-type(3n){animation-duration:4.6s;animation-delay:-1.6s;}
  .tw:nth-of-type(3n+1){animation-duration:5.4s;animation-delay:-3.2s;}
  @keyframes twinkle{0%,100%{opacity:.45}50%{opacity:1}}

  /* ---------- 오늘의 목표 ---------- */
  #mission{
    position:absolute;left:10px;top:10px;z-index:3;
    background:#fff;border:4px solid #ff8a3d;border-radius:20px;
    padding:6px 14px 8px;box-shadow:0 6px 16px rgba(0,0,0,.28);
    display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .25s;
  }
  #mission.pop{transform:scale(1.08) rotate(-1.5deg);}
  #mission.done{border-color:#3fbf6f;background:#effbf3;}
  .mLbl{font-size:15px;color:#e06a1e;}
  #mission.done .mLbl{color:#2f9c58;}
  .mBody{display:flex;align-items:center;gap:8px;}
  .mIcon{font-size:34px;line-height:1;display:flex;align-items:center;}
  .mText{font-size:clamp(19px,3.2vw,26px);}
  .mText b{color:#e06a1e;font-size:1.25em;}

  /* 고른 물고기 표시 */
  #pick{transition:opacity .2s;}
  #pick .bob{animation:pickBob 1s ease-in-out infinite;}
  @keyframes pickBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  #fishes > g{cursor:pointer;}

  /* ---------- 통발 ---------- */
  #tank{
    position:absolute;right:10px;top:10px;z-index:3;
    width:min(288px,44%);height:116px;
    background:
      repeating-linear-gradient(48deg, rgba(110,72,24,.20) 0 5px, transparent 5px 11px),
      repeating-linear-gradient(-48deg, rgba(110,72,24,.16) 0 5px, transparent 5px 11px),
      linear-gradient(#eccb96,#c9994f);
    border:4px solid #a97c3c;
    border-radius:20px 46px 46px 20px / 20px 58px 58px 20px;
    box-shadow:0 7px 18px rgba(0,0,0,.32), inset 0 -7px 0 rgba(90,58,20,.18),
               inset 0 4px 0 rgba(255,240,210,.35);
    transition:transform .25s;
  }
  #tank.pop{transform:scale(1.06) rotate(-1.5deg);}
  #tank::after{
    content:'';position:absolute;right:-2px;top:50%;transform:translateY(-50%);
    width:26px;height:78%;border-radius:50%;
    background:radial-gradient(ellipse at 30% 50%, rgba(60,35,10,.55), rgba(60,35,10,.18));
    box-shadow:inset 2px 0 6px rgba(0,0,0,.35);
  }
  #tank::before{
    content:'';position:absolute;left:0;right:0;top:calc(50% - 4px);height:8px;
    background:rgba(140,96,40,.35);
  }
  #tank .lbl{
    position:absolute;left:50%;top:-13px;transform:translateX(-50%);
    white-space:nowrap;font-size:15px;color:#5a3c14;background:#ffe9c4;
    border:3px solid #a97c3c;border-radius:999px;padding:1px 12px;z-index:3;
  }
  #tankSvg{position:relative;width:100%;height:100%;display:block;z-index:2;}

  /* ---------- 아래쪽 큰 버튼 ---------- */
  #bottom{flex:none;padding:10px 12px 12px;background:#0d3550;}
  .big{
    width:100%;border:0;border-radius:24px;cursor:pointer;color:#fff;font-family:inherit;
    font-size:clamp(24px,5vw,42px);padding:20px 14px;background:var(--go);
    box-shadow:0 8px 0 var(--go-dark);
  }
  .big:active{transform:translateY(5px);box-shadow:0 3px 0 var(--go-dark);}
  .big[disabled]{background:#98a6b5;box-shadow:0 8px 0 #7d8996;}

  /* ---------- 연타 ---------- */
  #tapLayer{
    position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;
    align-items:center;justify-content:flex-end;gap:14px;padding:14px;
    background:rgba(10,40,70,.26);cursor:pointer;
  }
  #gaugeBox{
    position:relative;width:min(760px,96%);height:44px;background:rgba(255,255,255,.88);
    border-radius:999px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  #gauge{
    height:100%;width:0%;border-radius:999px;
    background:linear-gradient(90deg,#ffd54a,#ff8a3d,#ff4f7b);transition:width .12s ease-out;
  }
  #gaugeFace{
    position:absolute;top:50%;left:0;transform:translate(-50%,-50%);
    transition:left .12s ease-out;pointer-events:none;font-size:30px;line-height:1;
  }
  #tapBtn{
    width:min(620px,96%);border:0;border-radius:32px;color:#fff;font-family:inherit;
    font-size:clamp(32px,7.5vw,68px);padding:26px 14px;cursor:pointer;
    background:var(--tap);box-shadow:0 10px 0 var(--tap-dark);
  }
  #tapLayer.hit #tapBtn{transform:translateY(6px) scale(.985);box-shadow:0 4px 0 var(--tap-dark);}

  /* ---------- 잡았다 ---------- */
  #cheer{
    position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:4px;pointer-events:none;
  }
  #cheerIcon{font-size:clamp(80px,20vw,170px);line-height:1;animation:jump .6s cubic-bezier(.2,1.7,.4,1);}
  #cheerName{
    font-size:clamp(32px,7.5vw,70px);color:#fff;
    text-shadow:0 5px 0 var(--go),0 9px 22px rgba(0,0,0,.4);
    animation:jump .6s cubic-bezier(.2,1.7,.4,1) .06s backwards;
  }
  @keyframes jump{from{transform:scale(.3) translateY(40px);opacity:0}to{transform:none;opacity:1}}

  /* ---------- 도감 · 설정 ---------- */
  .sheet{
    position:absolute;inset:0;z-index:9;background:rgba(13,53,80,.94);
    display:flex;align-items:center;justify-content:center;padding:14px;overflow:auto;
  }
  .panel{background:#fff;border-radius:24px;padding:20px;width:min(620px,100%);
         max-height:94%;overflow:auto;display:flex;flex-direction:column;gap:14px;}
  .panel h2{margin:0;text-align:center;font-size:25px;}
  .field{display:flex;flex-direction:column;gap:7px;}
  .field > span{font-size:19px;color:#5a6b7d;}
  .opts{display:flex;gap:7px;flex-wrap:wrap;}
  .opt{flex:1;min-width:78px;border:3px solid #dfe7ef;background:#f7fafd;border-radius:15px;
       padding:13px 5px;font-family:inherit;font-size:19px;color:var(--ink);cursor:pointer;}
  .opt.on{border-color:var(--go);background:#fff3e8;}
  .panel .big{font-size:26px;padding:16px;background:var(--ok);box-shadow:0 8px 0 var(--ok-dark);}
  .panel .reset{background:#eef2f7;color:#5a6b7d;box-shadow:0 6px 0 #cfd8e2;font-size:20px;padding:12px;}
  /* 목록이 길어도 닫기 버튼은 늘 보이게 */
  #book .panel .big{position:sticky;bottom:0;}

  /* 도감 */
  #bookGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;}
  .bcard{
    background:#f5f9fd;border:3px solid #e3ebf3;border-radius:16px;padding:8px 4px;
    text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;
  }
  .bcard.got{background:#fff6e9;border-color:#ffd7ae;}
  .bcard .pic{height:44px;display:flex;align-items:center;justify-content:center;font-size:34px;line-height:1;}
  .bcard.miss .pic{filter:brightness(0);opacity:.22;}
  .bcard .nm{font-size:15px;color:#5a6b7d;}
  .bcard.got .nm{color:var(--ink);}
  .bcard .tag{font-size:12px;color:#8a97a5;}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>

<div id="top">
  <div class="chip" id="fishChip">🪣 <span id="count">0</span></div>
  <div id="say">낚싯대를 내려 보세요</div>
  <div class="chip" id="starChip">⭐ <span id="stars">0</span></div>
  <button class="iconbtn" id="openBook" title="도감">📖</button>
  <button class="iconbtn" id="bgmBtn" title="배경음악 켜기·끄기">🎵</button>
  <button class="iconbtn" id="openSetup" title="설정">⚙️</button>
</div>

<audio id="bgm" src="aquarium.mp3" loop preload="auto"></audio>

<div id="stage">
  <!-- meet 으로 두어 어떤 화면에서도 하늘부터 바닥까지 다 보이게 합니다.
       남는 자리는 아래 배경 사각형들을 넓게 그려서 채웁니다. -->
  <svg id="scene" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop id="sky0" offset="0" stop-color="#bfe9ff"/><stop id="sky1" offset="1" stop-color="#e9f7ff"/>
      </linearGradient>
      <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
        <stop id="sea0" offset="0" stop-color="#4bb3e8"/><stop id="sea1" offset="1" stop-color="#1668a8"/>
      </linearGradient>
      <radialGradient id="orbG"><stop id="orb0" offset="0" stop-color="#fff3b0"/><stop id="orb1" offset="1" stop-color="#ffd54a"/></radialGradient>
      <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur stdDeviation="7" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>

    <!-- 하늘 -->
    <rect id="skyRect" x="-1200" y="-800" width="3400" height="1060" fill="url(#sky)"/>
    <!-- 오른쪽 위는 통발이 가리므로 하늘 장식은 왼쪽에 둡니다 -->
    <g id="stars" opacity="0">
      <circle class="tw" cx="60" cy="150" r="6"/><circle class="tw" cx="130" cy="196" r="4.5"/>
      <circle class="tw" cx="212" cy="128" r="6.5"/><circle class="tw" cx="286" cy="202" r="4"/>
      <circle class="tw" cx="330" cy="46" r="6"/><circle class="tw" cx="404" cy="176" r="5"/>
      <circle class="tw" cx="470" cy="58" r="6.5"/><circle class="tw" cx="500" cy="198" r="4.5"/>
      <circle class="tw" cx="90" cy="42" r="5.5"/><circle class="tw" cx="244" cy="32" r="4.5"/>
      <circle class="tw" cx="540" cy="126" r="6"/><circle class="tw" cx="376" cy="110" r="4.5"/>
      <circle class="tw" cx="620" cy="214" r="5"/><circle class="tw" cx="762" cy="198" r="4.5"/>
      <circle class="tw" cx="884" cy="216" r="5.5"/>
    </g>
    <circle id="orb" cx="150" cy="70" r="44" fill="url(#orbG)"/>
    <circle id="orbHole" cx="168" cy="56" r="34" fill="#12224a" opacity="0"/>
    <g id="clouds" fill="#fff" opacity=".92">
      <ellipse cx="392" cy="66" rx="52" ry="28"/><ellipse cx="440" cy="76" rx="40" ry="22"/>
      <ellipse cx="250" cy="156" rx="44" ry="24"/><ellipse cx="292" cy="164" rx="32" ry="18"/>
    </g>
    <g id="birds" fill="none" stroke="#8aa7bd" stroke-width="4" stroke-linecap="round">
      <path d="M330 112q10-10 20 0q10-10 20 0"/><path d="M404 138q8-8 16 0q8-8 16 0"/>
    </g>

    <!-- 바다 -->
    <rect x="-1200" y="260" width="3400" height="1400" fill="url(#sea)"/>
    <path id="wave" d="M0 262 q62 -16 125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 t125 0 V300 H0Z" fill="#8fd6f7" opacity=".55"/>
    <g id="shine" opacity=".45" fill="#bfeaff">
      <ellipse cx="200" cy="332" rx="70" ry="9"/><ellipse cx="700" cy="302" rx="90" ry="10"/>
    </g>

    <!-- 얼음판 (얼음낚시일 때만) -->
    <g id="ice" opacity="0">
      <rect x="-1200" y="250" width="3400" height="54" fill="#eaf7ff"/>
      <rect x="-1200" y="296" width="3400" height="14" fill="#c8e6f7"/>
      <ellipse cx="560" cy="278" rx="86" ry="24" fill="#1b5f8c"/>
      <ellipse cx="560" cy="272" rx="86" ry="24" fill="#0f4a72"/>
      <g fill="#ffffff" opacity=".85">
        <path d="M120 250 l30 -18 l26 18z"/><path d="M300 250 l22 -14 l20 14z"/>
        <path d="M760 250 l34 -20 l28 20z"/><path d="M900 250 l24 -14 l22 14z"/>
      </g>
    </g>

    <!-- 바닥 -->
    <rect id="groundBase" x="-1200" y="668" width="3400" height="1200" fill="#e6cf9b"/>
    <path id="ground" d="M-1200 640 q120 -34 250 -10 t250 -6 t250 8 t250 -12 t250 -10 t250 -6 t250 8 t250 -12 t250 -10 t250 -6 t250 8 t250 -12 V700 H-1200Z" fill="#e6cf9b"/>
    <g id="weeds" fill="#3f9a63">
      <path class="weed" d="M120 640q-14-56 8-96q10 44 22 96z"/>
      <path class="weed" d="M156 640q-6-42 16-70q4 34 8 70z"/>
      <path class="weed" d="M842 640q-16-60 6-100q12 46 24 100z"/>
    </g>
    <g id="rocks" fill="#9fb0bd"><ellipse cx="430" cy="648" rx="46" ry="18"/><ellipse cx="650" cy="656" rx="34" ry="13"/></g>
    <g id="bubbles"></g>
    <g id="snow"></g>

    <!-- 부두와 낚싯대 -->
    <g id="pier">
      <rect x="-10" y="196" width="300" height="26" rx="6" fill="#b3813f"/>
      <rect x="-10" y="222" width="300" height="10" fill="#8f6530"/>
      <rect x="40" y="232" width="20" height="120" fill="#8f6530"/>
      <rect x="210" y="232" width="20" height="120" fill="#8f6530"/>
      <path d="M250 196 Q400 120 560 118" stroke="#5c4327" stroke-width="11" fill="none" stroke-linecap="round"/>
      <circle cx="300" cy="176" r="13" fill="#e0e6ec" stroke="#98a6b5" stroke-width="4"/>
    </g>

    <!-- 낚싯줄 · 찌 · 바늘 -->
    <line id="line" x1="560" y1="118" x2="560" y2="150" stroke="#f2f7fa" stroke-width="3"/>
    <g id="hook">
      <path d="M0 -16 v14 q0 16 -13 16 q-13 0 -13 -13" stroke="#dfe7ee" stroke-width="5" fill="none" stroke-linecap="round"/>
      <circle cx="0" cy="-18" r="5" fill="#dfe7ee"/>
    </g>
    <g id="float" opacity="0">
      <ellipse cx="560" cy="262" rx="13" ry="17" fill="#ff4f7b"/>
      <path d="M547 262 a13 17 0 0 0 26 0z" fill="#fdfdfd"/>
      <rect x="557" y="236" width="6" height="14" rx="3" fill="#dfe7ee"/>
    </g>

    <g id="fishes"></g>
    <!-- 고른 물고기 표시 -->
    <g id="pick" opacity="0">
      <g id="pickArrow">
        <path class="bob" d="M0 0 l22 -30 h-44z" fill="#ffd54a" stroke="#e0a41e" stroke-width="4" stroke-linejoin="round"/>
      </g>
      <ellipse id="pickRing" rx="62" ry="42" fill="none" stroke="#ffd54a" stroke-width="6" stroke-dasharray="14 10" opacity=".9"/>
    </g>
    <g id="fx"></g>
  </svg>

  <!-- 오늘의 목표 -->
  <div id="mission" hidden>
    <div class="mLbl">🎯 목표</div>
    <div class="mBody"><span class="mIcon" id="mIcon">🐙</span><span class="mText" id="mText">문어 0/2</span></div>
  </div>

  <div id="tank">
    <span class="lbl">🧺 내가 잡은 친구들</span>
    <svg id="tankSvg" viewBox="0 0 288 116" preserveAspectRatio="xMidYMid meet"><g id="tankFish"></g></svg>
  </div>

  <div id="tapLayer" hidden>
    <div id="gaugeBox"><div id="gauge"></div><div id="gaugeFace">🐟</div></div>
    <button id="tapBtn">👆 눌러요!</button>
  </div>

  <div id="cheer" hidden>
    <div id="cheerIcon">🐟</div>
    <div id="cheerName">잡았다!</div>
  </div>

  <!-- 도감 -->
  <div id="book" class="sheet" hidden>
    <div class="panel">
      <h2>📖 물고기 도감 <span id="bookCount" style="font-size:19px;color:#8a97a5"></span></h2>
      <div id="bookGrid"></div>
      <button class="big" id="closeBook">닫기</button>
    </div>
  </div>

  <!-- 설정 -->
  <div id="setup" class="sheet" hidden>
    <div class="panel">
      <h2>⚙️ 설정</h2>
      <div class="field">
        <span>낚시터</span>
        <div class="opts" id="optMode">
          <button class="opt" data-v="sea">🌊 바다</button>
          <button class="opt" data-v="ice">❄️ 얼음낚시</button>
        </div>
      </div>
      <div class="field">
        <span>몇 번 눌러야 잡히나요?</span>
        <div class="opts" id="optTaps">
          <button class="opt" data-v="2">2번</button>
          <button class="opt" data-v="3">3번</button>
          <button class="opt" data-v="5">5번</button>
          <button class="opt" data-v="8">8번</button>
        </div>
      </div>
      <div class="field">
        <span>물고기 고르기</span>
        <div class="opts" id="optPick">
          <button class="opt" data-v="touch">손으로 고르기</button>
          <button class="opt" data-v="scan">차례로 (스위치)</button>
          <button class="opt" data-v="auto">가까운 것</button>
        </div>
      </div>
      <div class="field">
        <span>오늘의 목표 주기</span>
        <div class="opts" id="optQuest">
          <button class="opt" data-v="1">주기</button>
          <button class="opt" data-v="0">안 주기</button>
        </div>
      </div>
      <div class="field">
        <span>하늘이 바뀌는 빠르기 (아침·낮·노을·밤)</span>
        <div class="opts" id="optCycle">
          <button class="opt" data-v="90">빠르게</button>
          <button class="opt" data-v="180">보통</button>
          <button class="opt" data-v="420">느리게</button>
          <button class="opt" data-v="0">늘 낮</button>
        </div>
      </div>
      <div class="field">
        <span>찌를 기다리는 시간</span>
        <div class="opts" id="optWait">
          <button class="opt" data-v="0">없음</button>
          <button class="opt" data-v="1300">조금</button>

<script>
/* =========================================================
   즐거운 낚시터
   - 중도발달장애 학생을 위한 낚시 게임입니다.
   - 실패가 없습니다. 물고기는 반드시 잡히고, 늦게 눌러도 괜찮습니다.
   - 연타는 화면 아무 곳이나 눌러도 되고, 스페이스바·엔터도 됩니다.
     (스위치 보조기기가 대개 이 키를 보냅니다)
   - 다섯 마리마다 하늘이 아침→낮→노을→밤으로 바뀌고,
     밤에는 밤에만 나오는 친구가 나옵니다.
   ========================================================= */

const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';

const stage=$('stage'), line=$('line'), hook=$('hook'), float_=$('float'),
      fishesG=$('fishes'), fxG=$('fx'), bubblesG=$('bubbles'), snowG=$('snow'),
      say=$('say'), countEl=$('count'), starsEl=$('stars'), fishChip=$('fishChip'),
      mainBtn=$('mainBtn'), tapLayer=$('tapLayer'), gauge=$('gauge'), gaugeFace=$('gaugeFace'),
      tapBtn=$('tapBtn'), cheer=$('cheer'), cheerIcon=$('cheerIcon'), cheerName=$('cheerName'),
      setup=$('setup'), book=$('book'), tank=$('tank'), tankFish=$('tankFish');

const ROD_X = 560, REST_Y = 150;

/* =========================================================
   나오는 친구들
   mode : 'ice' 면 얼음낚시에서만, 없으면 어디서나
   night: 밤에만
   mul  : 연타 횟수 배수   star: 주는 별   w: 나올 확률
   ========================================================= */
const SPECIES = [
  { key:'o', kind:'draw', shape:'fish', c:'#ff8a3d', name:'주황 물고기', size:1, mul:1, w:10 },
  { key:'y', kind:'draw', shape:'fish', c:'#ffd54a', name:'노랑 물고기', size:1, mul:1, w:10 },

  { key:'P', kind:'emoji', e:'🐡', name:'복어',   size:1.1, mul:1,   w:5, special:true, snd:[440,554,440,659] },
  { key:'C', kind:'emoji', e:'🦀', name:'게',     size:1.1, mul:1,   w:4, special:true, snd:[523,494,523,587] },
  { key:'T', kind:'emoji', e:'🐢', name:'거북이', size:1.4, mul:1.5, w:3, special:true, star:1, snd:[196,262,330,392] },
  { key:'J', kind:'emoji', e:'💎', name:'보석',   size:1.1, mul:1,   w:3, special:true, star:2, snd:[1047,1319,1568,2093] },

  { key:'F', kind:'draw', shape:'firefly', c:'#ffe98a', name:'반딧불 물고기', size:1, mul:1, w:8,

  { key:'B', kind:'draw', shape:'fish', c:'#dfe9f2', name:'빙어', size:.8, mul:1, w:12, mode:'ice' },
  { key:'N', kind:'emoji', e:'🐧', name:'펭귄', size:1.4, mul:1.5, w:5, mode:'ice',
    special:true, star:1, snd:[330,392,330,523] }
];
const byKey = k => SPECIES.find(s => s.key === k) || SPECIES[0];

function pickSpecies(){
  const night = isNight();
  const pool = SPECIES.filter(s =>
    (s.mode ? s.mode === cfg.mode : true) &&
    (s.night ? night : true) &&
    (cfg.special ? true : !s.special));
  const total = pool.reduce((a,s) => a + s.w, 0);
  let r = Math.random() * total;
  for(const s of pool){ if((r -= s.w) <= 0) return s; }
  return pool[0];
}

/* ---------- 그림 ---------- */
function shapeMarkup(sp){
  if(sp.kind === 'emoji')
    return '<text y="' + (20*sp.size) + '" font-size="' + (64*sp.size) + '" text-anchor="middle">' + sp.e + '</text>';

  const c = sp.c;
  if(sp.shape === 'jelly'){
    return '<g transform="scale(' + sp.size + ')">' +
      '<path d="M-40 0 a40 44 0 0 1 80 0 z" fill="' + c + '" opacity=".85"/>' +
      '<path d="M-30 2 q-6 34 4 46 M-10 2 q-4 40 2 52 M10 2 q4 40 -2 52 M30 2 q6 34 -4 46"' +
        ' stroke="' + c + '" stroke-width="6" fill="none" stroke-linecap="round" opacity=".8"/>' +
      '<circle cx="-13" cy="-12" r="5" fill="#3a3550"/><circle cx="13" cy="-12" r="5" fill="#3a3550"/>' +
      '<path d="M-8 -2 q8 7 16 0" stroke="#3a3550" stroke-width="3" fill="none" stroke-linecap="round"/></g>';
  }
  if(sp.shape === 'star'){
    return '<g transform="scale(' + sp.size + ')">' +
      '<path d="M0 -44 L12 -13 L46 -13 L18 8 L28 40 L0 20 L-28 40 L-18 8 L-46 -13 L-12 -13 Z" fill="' + c + '"/>' +
      '<circle cx="-10" cy="-4" r="5" fill="#7a5a10"/><circle cx="10" cy="-4" r="5" fill="#7a5a10"/>' +
      '<path d="M-8 8 q8 8 16 0" stroke="#7a5a10" stroke-width="3" fill="none" stroke-linecap="round"/></g>';
  }
  // 기본 물고기 (반딧불 물고기는 빛을 답니다)
  const glow = sp.shape === 'firefly';
  return '<g transform="scale(' + sp.size + ')"' + (glow ? ' filter="url(#glow)"' : '') + '>' +
    '<ellipse rx="46" ry="28" fill="' + c + '"/>' +
    '<path d="M40 0 l34 -24 v48z" fill="' + c + '" opacity=".85"/>' +
    '<path d="M-6 -26 q16 -18 30 -2z" fill="' + c + '" opacity=".7"/>' +
    '<circle cx="-22" cy="-7" r="8" fill="#fff"/>' +
    '<circle cx="-24" cy="-7" r="4" fill="#26364a"/>' +
    '<path d="M-34 6 q10 8 20 2" stroke="#26364a" stroke-width="3" fill="none" stroke-linecap="round"/>' +
    (sp.key === 'K' ? '<path d="M-8 -30 l14 -16 l14 16z" fill="#ffd54a"/>' : '') +
    (glow ? '<path d="M-40 -18 q-20 -14 -30 -30" stroke="' + c + '" stroke-width="4" fill="none"/>' +
            '<circle cx="-72" cy="-50" r="9" fill="#fff6c0"/>' : '') +
  '</g>';
}
/* 크게 보여 줄 때 : 이모지는 이모지, 그린 친구는 제 색 그대로 */
function iconHTML(sp, w, h){
  if(sp.kind === 'emoji') return sp.e;
  return '<svg viewBox="-66 -56 160 112" width="' + w + '" height="' + h +
         '" style="display:inline-block;vertical-align:middle">' +
         shapeMarkup(Object.assign({}, sp, { size:1 })) + '</svg>';
}

/* ---------- 설정 ---------- */
/* 잡은 기록은 물고기를 만들 때(시간대 계산) 이미 필요하므로 먼저 읽습니다 */
let caught = [], seen = [];
try{ caught = JSON.parse(localStorage.getItem('fishing-caught') || '[]'); }catch(e){}
try{ seen = JSON.parse(localStorage.getItem('fishing-seen') || '[]'); }catch(e){}

const DEF = { taps:5, speed:0.7, sound:1, special:1, bgm:1, wait:1300, mode:'sea',
              cycle:180, pick:'touch', quest:1 };
let cfg = Object.assign({}, DEF);
try{ cfg = Object.assign(cfg, JSON.parse(localStorage.getItem('fishing-cfg') || '{}')); }catch(e){}
function saveCfg(){ try{ localStorage.setItem('fishing-cfg', JSON.stringify(cfg)); }catch(e){} }

const OPTMAP = [['optTaps','taps'],['optSpeed','speed'],['optSound','sound'],
                ['optSpecial','special'],['optBgm','bgm'],['optWait','wait'],
                ['optMode','mode'],['optCycle','cycle'],['optPick','pick'],['optQuest','quest']];
function paintOpts(){
  OPTMAP.forEach(([box,key]) => {
    [...$(box).children].forEach(b =>
      b.classList.toggle('on', String(b.dataset.v) === String(cfg[key])));
  });
}
OPTMAP.forEach(([box,key]) => {
  $(box).addEventListener('click', e => {
    const b = e.target.closest('.opt'); if(!b) return;
    cfg[key] = (key === 'mode' || key === 'pick') ? b.dataset.v : +b.dataset.v;
    saveCfg(); paintOpts();
    if(key === 'bgm') applyBgm();
    if(key === 'mode'){ applyLook(); respawnAll(); newMission(); }
    if(key === 'pick'){ clearPick(); scanIdx = -1; }
    if(key === 'quest'){ if(cfg.quest) newMission(); else { mission = null; $('mission').hidden = true; } }
  });
});
$('openSetup').addEventListener('click', () => { setup.hidden = false; paintOpts(); });
$('closeSetup').addEventListener('click', () => { setup.hidden = true; });
$('resetAll').addEventListener('click', () => {
  caught.length = 0; saveCaught();
  bonusStars = 0; saveBonus();
  drawTank(); refreshCounts(); newMission();
  setup.hidden = true; applyLook(); tell('다시 시작해요!');
});

/* ---------- 소리 ---------- */
let ac = null;
function beep(freq, dur, type, vol){
  if(!cfg.sound) return;
  try{
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if(ac.state === 'suspended') ac.resume();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0, ac.currentTime);
    g.gain.linearRampToValueAtTime(vol || .18, ac.currentTime + .012);
    g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + (dur || .12));
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime + (dur || .12) + .02);
  }catch(e){}
}
function buzz(p){ if(cfg.sound){ try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} } }
function chime(notes, type){
  (notes || [523,659,784]).forEach((f,i) =>
    setTimeout(() => beep(f, .28, type || 'triangle', .2), i*110));
}

/* ---------- 시간대 ----------
   잡은 수와 상관없이 시간이 흐르면서 하늘이 조금씩 바뀝니다.
   (다섯 마리씩 잡을 때까지 기다리게 하지 않으려고 이렇게 했습니다)
   dayT 0 이 한밤중이고, 새벽 → 아침 → 낮 → 노을 → 땅거미 를 지나 다시 밤입니다.
   색이 확 튀지 않도록 사이사이에 새벽·땅거미를 넣었습니다. */
let dayT = 0.34;                                   // 아침에서 시작합니다

const CYCLE = {
  sea:[
    { t:0.00, sky:['#0b1533','#28406c'], sea:['#122c4e','#071628'], orb:['#ffffff','#dfe7f5'] }, // 밤
    { t:0.16, sky:['#42406e','#c98a86'], sea:['#2b4a72','#0e2a48'], orb:['#ffe9d0','#ffab7a'] }, // 새벽
    { t:0.32, sky:['#ffd9a8','#fff1de'], sea:['#5fc0e8','#1f74b0'], orb:['#fff3b0','#ffb45a'] }, // 아침
    { t:0.52, sky:['#bfe9ff','#e9f7ff'], sea:['#4bb3e8','#1668a8'], orb:['#fff3b0','#ffd54a'] }, // 낮
    { t:0.72, sky:['#ff9f6b','#ffd7a8'], sea:['#4a86c0','#123f6e'], orb:['#fff0c0','#ff7e4a'] }, // 노을
    { t:0.87, sky:['#4b3f78','#d98a72'], sea:['#26456c','#0c223c'], orb:['#ffd9c0','#ff8a5a'] }, // 땅거미
    { t:1.00, sky:['#0b1533','#28406c'], sea:['#122c4e','#071628'], orb:['#ffffff','#dfe7f5'] }
  ],
  ice:[
    { t:0.00, sky:['#0a1633','#2c4470'], sea:['#12314f','#07182c'], orb:['#ffffff','#e4ecfa'] },
    { t:0.16, sky:['#4a4a78','#e0a0a0'], sea:['#2c5878','#0f2c48'], orb:['#fff0dc','#ffb894'] },
    { t:0.32, sky:['#ffe6cf','#fbfdff'], sea:['#7fd8f0','#26739e'], orb:['#fff3b0','#ffc98a'] },
    { t:0.52, sky:['#cfe9ff','#ffffff'], sea:['#8fe0f5','#2d86b8'], orb:['#ffffff','#eaf4ff'] },
    { t:0.72, sky:['#ffc9d8','#ffe8f0'], sea:['#7ab6d8','#1c5f8c'], orb:['#fff0c0','#ff9a7a'] },
    { t:0.87, sky:['#544a80','#e0a08c'], sea:['#284a70','#0c2340'], orb:['#ffe0cc','#ff9a72'] },
    { t:1.00, sky:['#0a1633','#2c4470'], sea:['#12314f','#07182c'], orb:['#ffffff','#e4ecfa'] }
  ]
};
const GROUND = { sea:'#e6cf9b', ice:'#dfe9f2' };

/* 지금이 언제인지 (안내 문구용) */
function phase(){
  if(dayT < 0.22) return 3;          // 밤
  if(dayT < 0.42) return 0;          // 아침
  if(dayT < 0.62) return 1;          // 낮
  if(dayT < 0.80) return 2;          // 노을
  return 3;                          // 밤
}
const PHASE_NAME = ['아침', '낮', '노을', '밤'];
const PHASE_ICON = ['🌅', '☀️', '🌇', '🌙'];

function nightAmt(){                 // 0 = 환한 낮, 1 = 깊은 밤
  let d = Math.min(dayT, 1 - dayT);  // 한밤중(0)에서 얼마나 떨어졌는지
  return Math.max(0, Math.min(1, 1 - d / 0.20));
}
function isNight(){ return nightAmt() > 0.5; }

/* 두 색을 섞습니다 (#rrggbb) */
function mix(a, b, t){
  const n = h => [parseInt(h.substr(1,2),16), parseInt(h.substr(3,2),16), parseInt(h.substr(5,2),16)];
  const A = n(a), B = n(b);
  return '#' + [0,1,2].map(i =>
    Math.round(A[i] + (B[i] - A[i]) * t).toString(16).padStart(2,'0')).join('');
}

function applyLook(){
  const K = CYCLE[cfg.mode];
  let i = 0;
  while(i < K.length - 2 && dayT >= K[i+1].t) i++;
  const a = K[i], b = K[i+1];
  const f = Math.max(0, Math.min(1, (dayT - a.t) / (b.t - a.t)));

  const sky0 = mix(a.sky[0], b.sky[0], f);
  $('sky0').setAttribute('stop-color', sky0);
  $('sky1').setAttribute('stop-color', mix(a.sky[1], b.sky[1], f));
  $('sea0').setAttribute('stop-color', mix(a.sea[0], b.sea[0], f));
  $('sea1').setAttribute('stop-color', mix(a.sea[1], b.sea[1], f));
  $('orb0').setAttribute('stop-color', mix(a.orb[0], b.orb[0], f));
  $('orb1').setAttribute('stop-color', mix(a.orb[1], b.orb[1], f));
  $('ground').setAttribute('fill', GROUND[cfg.mode]);
  $('groundBase').setAttribute('fill', GROUND[cfg.mode]);

  /* 해는 0.20 에 왼쪽에서 떠서 0.86 에 오른쪽으로 지고,
     달은 그 사이(밤 동안)에 같은 길을 지나갑니다.
     지평선 가까이에서는 옅어져서 갑자기 나타나지 않습니다.
     오른쪽 위는 통발이 가리므로 왼쪽 하늘만 지나갑니다. */
  const day = dayT >= 0.20 && dayT <= 0.86;
  const u = day ? (dayT - 0.20) / 0.66
                : (((dayT - 0.86 + 1) % 1) / 0.34);
  const ox = 100 + 400 * u, oy = 172 - 112 * Math.sin(Math.PI * u);
  const edge = Math.min(1, Math.min(u, 1 - u) / 0.06);   // 뜨고 질 때 서서히
  $('orb').setAttribute('cx', ox.toFixed(1));  $('orb').setAttribute('cy', oy.toFixed(1));
  $('orb').setAttribute('opacity', edge.toFixed(2));
  $('orbHole').setAttribute('cx', (ox + 18).toFixed(1));
  $('orbHole').setAttribute('cy', (oy - 14).toFixed(1));

  const n = nightAmt();
  $('stars').setAttribute('opacity', (n * .95).toFixed(2));
  $('stars').setAttribute('fill', '#fff8d0');
  $('orbHole').setAttribute('opacity', (n * edge).toFixed(2));
  $('orbHole').setAttribute('fill', sky0);
  $('clouds').setAttribute('opacity', (.92 - .74 * n).toFixed(2));
  $('birds').setAttribute('opacity', (1 - n).toFixed(2));
  $('shine').setAttribute('opacity', (.45 - .3 * n).toFixed(2));

  const ice = cfg.mode === 'ice';
  $('ice').setAttribute('opacity', ice ? 1 : 0);
  $('weeds').setAttribute('opacity', ice ? 0 : 1);
  $('rocks').setAttribute('opacity', ice ? .5 : 1);
  $('wave').setAttribute('opacity', ice ? 0 : .55);
  document.body.style.background = ice ? '#123a52' : '#0d3550';
}

/* 시간 흐르기 : cfg.cycle 초에 하루 한 바퀴 (0 이면 늘 낮) */
let lastTick = performance.now(), lastPhase = -1;
setInterval(() => {
  const now = performance.now(), dt = now - lastTick; lastTick = now;
  if(document.hidden) return;
  if(cfg.cycle > 0) dayT = (dayT + dt / (cfg.cycle * 1000)) % 1;
  else dayT = 0.52;                                   // 고정하면 늘 환한 낮
  applyLook();

  const p = phase();
  if(p !== lastPhase){
    if(lastPhase >= 0 && state === 'idle' && cfg.cycle > 0)
      tell(PHASE_ICON[p] + ' ' + PHASE_NAME[p] + '이 되었어요');
    lastPhase = p;
  }
}, 260);

/* ---------- 물고기 ---------- */
const fish = [];
function makeFish(y, base, sp){
  sp = sp || pickSpecies();
  const g = document.createElementNS(NS, 'g');
  g.innerHTML = shapeMarkup(sp);
  fishesG.appendChild(g);
  const f = {
    el:g, sp, y, speedBase:base, t: Math.random()*6,
    x: 120 + Math.random()*760,
    dir: Math.random() < .5 ? -1 : 1,
    get spd(){ return this.speedBase * cfg.speed; }
  };
  /* 물고기를 손으로 눌러 고를 수 있습니다 */
  g.addEventListener('pointerdown', e => {
    if(state !== 'idle' || cfg.pick !== 'touch') return;
    e.preventDefault(); e.stopPropagation();
    choose(f);
  });
  fish.push(f);
  return f;
}
const SLOTS = [[350,.9],[430,1.15],[505,.75],[575,1.0],[625,.85]];
function respawnAll(){
  fish.forEach(f => f.el.remove());
  fish.length = 0;
  SLOTS.forEach(d => makeFish(d[0], d[1]));
}
respawnAll();

function drawFish(f){
  const bob = Math.sin(f.t) * 6;
  f.el.setAttribute('transform',
    'translate(' + f.x.toFixed(1) + ',' + (f.y + bob).toFixed(1) + ') scale(' + f.dir + ',1)');
}

/* ---------- 통발과 도감 ---------- */
function saveCaught(){ try{ localStorage.setItem('fishing-caught', JSON.stringify(caught.slice(-60))); }catch(e){} }
function saveSeen(){ try{ localStorage.setItem('fishing-seen', JSON.stringify(seen)); }catch(e){} }

function drawTank(){
  tankFish.innerHTML = '';
  caught.slice(-8).forEach((k, i) => {
    const sp = byKey(k);
    const x = 40 + (i % 4) * 60, y = 38 + Math.floor(i / 4) * 42;
    const outer = document.createElementNS(NS, 'g');
    outer.setAttribute('transform', 'translate(' + x + ',' + y + ')');
    const inner = document.createElementNS(NS, 'g');
    inner.innerHTML = sp.kind === 'emoji'
      ? '<text y="9" font-size="27" text-anchor="middle">' + sp.e + '</text>'
      : '<g transform="scale(0.3)">' + shapeMarkup(Object.assign({}, sp, { size:1 })) + '</g>';
    inner.style.animation = 'tankSway ' + (2.4 + (i % 5) * .35) + 's ease-in-out infinite';
    inner.style.animationDelay = (-i * .3) + 's';
    outer.appendChild(inner);
    tankFish.appendChild(outer);
  });
  if(caught.length > 8){
    const t = document.createElementNS(NS, 'text');
    t.setAttribute('x', 274); t.setAttribute('y', 106);
    t.setAttribute('text-anchor', 'end'); t.setAttribute('font-size', 19);
    t.setAttribute('fill', '#5a3c14'); t.setAttribute('font-family', 'Jua, sans-serif');
    t.textContent = '+' + (caught.length - 8);
    tankFish.appendChild(t);
  }
}
let bonusStars = 0;
try{ bonusStars = +(localStorage.getItem('fishing-bonus') || 0) || 0; }catch(e){}
function saveBonus(){ try{ localStorage.setItem('fishing-bonus', bonusStars); }catch(e){} }

function refreshCounts(){
  countEl.textContent = caught.length;
  starsEl.textContent = caught.reduce((a,k) => a + (byKey(k).star || 0), 0) + bonusStars;
}

function drawBook(){
  const grid = $('bookGrid');
  grid.innerHTML = '';
  SPECIES.forEach(sp => {
    const got = seen.indexOf(sp.key) > -1;
    const d = document.createElement('div');
    d.className = 'bcard ' + (got ? 'got' : 'miss');
    const tag = sp.mode === 'ice' ? '❄️ 얼음낚시' : (sp.night ? '🌙 밤에만' : '');
    d.innerHTML = '<div class="pic">' + (got ? iconHTML(sp, '58px', '40px') : '?') + '</div>' +
                  '<div class="nm">' + (got ? sp.name : '???') + '</div>' +
                  (tag ? '<div class="tag">' + tag + '</div>' : '');
    if(!got) d.querySelector('.pic').style.filter = 'none';   // 물음표는 그대로 보이게
    grid.appendChild(d);
  });
  $('bookCount').textContent = seen.length + ' / ' + SPECIES.length;
}
$('openBook').addEventListener('click', () => { drawBook(); book.hidden = false; });
$('closeBook').addEventListener('click', () => { book.hidden = true; });

refreshCounts(); drawTank(); applyLook();

/* ---------- 상태 ---------- */
let state = 'idle';                  // idle · down · wait · bite · up
let hookY = REST_Y, target = null, taps = 0, need = 5, last = performance.now();

function setHook(y){
  hookY = y;
  line.setAttribute('y2', y);
  hook.setAttribute('transform', 'translate(' + ROD_X + ',' + y + ')');
}
setHook(REST_Y);
function tell(t){ say.textContent = t; }

/* ---------- 되풀이 ---------- */
function loop(now){
  const dt = Math.min(50, now - last); last = now;
  for(const f of fish){
    f.t += dt / 420;
    if(f === target && (state === 'bite' || state === 'up')){
      f.x += (ROD_X - f.x) * 0.12;
      f.y += (hookY + 14 - f.y) * 0.18;
    }else if(f === target && state === 'wait'){
      f.x += (ROD_X - f.x) * 0.02;                 // 슬금슬금 다가옵니다
    }else{
      const slow = (state === 'bite' || state === 'up') ? 0.02 : 0.06;
      f.x += f.dir * f.spd * dt * slow;
      if(f.x < 90){ f.x = 90; f.dir = 1; }
      if(f.x > 910){ f.x = 910; f.dir = -1; }
    }
    drawFish(f);
  }
  /* 고른 물고기(또는 차례로 비추는 물고기) 위에 표시를 띄웁니다 */
  const hi = state === 'idle'
    ? (selected || (cfg.pick === 'scan' ? fish[scanIdx] : null))
    : null;
  if(hi){
    const s = hi.sp.size || 1;
    pickEl.setAttribute('opacity', 1);
    pickEl.setAttribute('transform',
      'translate(' + hi.x.toFixed(1) + ',' + (hi.y + Math.sin(hi.t) * 6).toFixed(1) + ')');
    pickRing.setAttribute('rx', (60 * s).toFixed(0));
    pickRing.setAttribute('ry', (40 * s).toFixed(0));
    pickArrow.setAttribute('transform', 'translate(0,' + (-40 * s - 14).toFixed(0) + ')');
  }else{
    pickEl.setAttribute('opacity', 0);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ---------- 물방울 · 눈 ---------- */
setInterval(() => {
  if(document.hidden) return;
  if(cfg.mode === 'ice'){
    if(snowG.childElementCount > 26) return;
    const c = document.createElementNS(NS, 'circle');
    const x = Math.random() * 1000, r = 3 + Math.random() * 5;
    c.setAttribute('cx', x); c.setAttribute('cy', -10); c.setAttribute('r', r);
    c.setAttribute('fill', '#ffffff'); c.setAttribute('opacity', '.9');
    snowG.appendChild(c);
    const t0 = performance.now(), dur = 5200 + Math.random() * 3000;
    (function fall(now){
      const p = (now - t0) / dur;
      if(p >= 1){ c.remove(); return; }
      c.setAttribute('cy', -10 + p * 268);
      c.setAttribute('cx', x + Math.sin(p * 7) * 26);
      requestAnimationFrame(fall);
    })(performance.now());
  }else{
    if(bubblesG.childElementCount > 14) return;
    const c = document.createElementNS(NS, 'circle');
    const x = 60 + Math.random() * 880, r = 4 + Math.random() * 8;
    c.setAttribute('cx', x); c.setAttribute('cy', 660); c.setAttribute('r', r);
    c.setAttribute('fill', '#dff4ff'); c.setAttribute('opacity', '.6');
    bubblesG.appendChild(c);
    const t0 = performance.now(), dur = 3600 + Math.random() * 2200;
    (function rise(now){
      const p = (now - t0) / dur;
      if(p >= 1){ c.remove(); return; }
      c.setAttribute('cy', 660 - p * 380);
      c.setAttribute('cx', x + Math.sin(p * 9) * 12);
      c.setAttribute('opacity', (.6 * (1 - p)).toFixed(2));
      requestAnimationFrame(rise);
    })(performance.now());
  }
}, 520);

/* ---------- 물고기 고르기 ---------- */
const pickEl = $('pick'), pickRing = $('pickRing'), pickArrow = $('pickArrow');
let selected = null, scanIdx = -1;

function choose(f){
  selected = f;
  beep(760, .09, 'sine', .14); buzz(20);
  updateMainLabel();
  tell(f.sp.name + '를 골랐어요!');
}
function clearPick(){
  selected = null;
  pickEl.setAttribute('opacity', 0);
  updateMainLabel();
}
function updateMainLabel(){
  const t = selected || (state === 'idle' && cfg.pick === 'scan' ? fish[scanIdx] : null);
  mainBtn.textContent = t ? ('🎣 ' + t.sp.name + ' 낚기') : '🎣 낚싯대 내리기';
}
/* 스위치 하나로도 고를 수 있도록 물고기를 차례로 비춰 줍니다 */
setInterval(() => {
  if(document.hidden || cfg.pick !== 'scan' || state !== 'idle' || !fish.length) return;
  scanIdx = (scanIdx + 1) % fish.length;
  updateMainLabel();
  beep(420, .05, 'sine', .07);
}, 1500);

/* 빈 물속을 누르면 고른 것을 취소합니다 */
$('scene').addEventListener('pointerdown', e => {
  if(state === 'idle' && selected && e.target.closest('#fishes') === null) clearPick();
});

/* ---------- ① 낚싯대 내리기 ---------- */
function lower(){
  if(state !== 'idle') return;
  state = 'down';
  mainBtn.disabled = true;
  tell('내려갑니다…');
  beep(320, .18, 'sine', .14);

  target = selected
        || (cfg.pick === 'scan' ? fish[scanIdx] : null)
        || fish.reduce((a,b) => Math.abs(b.x - ROD_X) < Math.abs(a.x - ROD_X) ? b : a);
  selected = null;
  pickEl.setAttribute('opacity', 0);
  mainBtn.textContent = '🎣 낚싯대 내리기';
  need = Math.max(2, Math.round(cfg.taps * target.sp.mul));

  const from = hookY, to = target.y - 16, t0 = performance.now(), dur = 1300;
  (function step(now){
    const p = Math.min(1, (now - t0) / dur);
    setHook(from + (to - from) * (p < .5 ? 2*p*p : 1 - Math.pow(-2*p + 2, 2)/2));
    if(p < 1) requestAnimationFrame(step);
    else if(cfg.wait > 0) waitBite(); else bite();
  })(performance.now());
}

/* ---------- ② 찌가 까딱까딱 ---------- */
function waitBite(){
  state = 'wait';
  tell('찌를 봐요…');
  float_.setAttribute('opacity', 1);
  const t0 = performance.now(), dur = cfg.wait, baseY = hookY;
  let nudged = 0;
  (function bobber(now){
    if(state !== 'wait'){ return; }
    const e = now - t0, p = e / dur;
    const dip = Math.max(0, Math.sin(e / 180)) * 10 * (0.4 + p);
    float_.setAttribute('transform', 'translate(0,' + dip.toFixed(1) + ')');
    setHook(baseY + dip * 0.5);
    if(e > nudged * (dur / 3) && nudged < 3){ nudged++; beep(520, .07, 'sine', .1); buzz(18); }
    if(p < 1) requestAnimationFrame(bobber);
    else { float_.setAttribute('opacity', 0); float_.removeAttribute('transform'); setHook(baseY); bite(); }
  })(performance.now());
}

/* ---------- ③ 입질 → 연타 ---------- */
function bite(){
  state = 'bite'; taps = 0;
  gauge.style.width = '0%';
  gaugeFace.style.left = '0%';
  gaugeFace.innerHTML = iconHTML(target.sp, '42px', '29px');
  tapBtn.textContent = '👆 눌러요!';
  tapLayer.hidden = false;
  tell(target.sp.special ? (target.sp.name + '다! 눌러요!') : '물고기다! 눌러요!');
  beep(220, .12, 'square', .16); setTimeout(() => beep(180, .16, 'square', .16), 130);
  buzz([40,60,40]);
  splash(ROD_X, target.y - 10, 6);
}

function onTap(){
  if(state !== 'bite') return;
  taps++;
  const p = Math.min(1, taps / need);
  gauge.style.width = (p * 100) + '%';
  gaugeFace.style.left = (p * 100) + '%';
  beep(300 + p * 500, .09, 'triangle', .16);
  buzz(25);
  tapLayer.classList.add('hit');
  setTimeout(() => tapLayer.classList.remove('hit'), 90);
  stage.classList.remove('shake'); void stage.offsetWidth; stage.classList.add('shake');
  setHook(REST_Y + (target.y - 16 - REST_Y) * (1 - p));
  splash(ROD_X, hookY, 4);
  if(taps >= need) done();
}

tapLayer.addEventListener('pointerdown', e => { e.preventDefault(); onTap(); });
tapBtn.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); onTap(); });
document.addEventListener('keydown', e => {
  if(e.repeat) return;
  if(e.code === 'Space' || e.code === 'Enter' || e.code === 'NumpadEnter'){
    e.preventDefault();
    if(state === 'bite') onTap();
    else if(state === 'idle' && setup.hidden && book.hidden) lower();
  }
});

/* ---------- ④ 잡았다 → 물 밖으로 튀어오르기 ---------- */
function done(){
  state = 'up';
  tapLayer.hidden = true;
  const sp = target.sp, fishEl = target.el, fromX = target.x, fromY = target.y;

  cheerIcon.innerHTML = iconHTML(sp, '1em', '0.7em');
  cheerName.textContent = sp.name + '!';
  cheer.hidden = false;
  tell(sp.name + ' 잡았다!');
  chime(sp.snd, sp.key === 'J' ? 'sine' : 'triangle');
  buzz([60,40,120]);
  sparkle(ROD_X, REST_Y, sp.special ? 26 : 14);
  splash(ROD_X, 268, 12);

  /* 물 밖으로 솟구쳤다가 통발로 */
  jumpOut(fishEl, fromX, fromY);

  const first = seen.indexOf(sp.key) < 0;
  if(first){ seen.push(sp.key); saveSeen(); }
  caught.push(sp.key); saveCaught();
  refreshCounts(); drawTank();
  tank.classList.add('pop'); setTimeout(() => tank.classList.remove('pop'), 260);
  fishChip.classList.remove('pop'); void fishChip.offsetWidth; fishChip.classList.add('pop');

  const questWin = missionCatch(sp);
  const milestone = !questWin && caught.length % 5 === 0;
  if(milestone){
    setTimeout(() => { party(); tell('대단해요! ' + caught.length + '마리!'); }, 800);
  }
  if(first && !questWin)
    setTimeout(() => tell('처음 만난 친구예요! 도감에 담았어요 📖'), milestone ? 2000 : 900);

  setTimeout(() => {
    cheer.hidden = true;
    const i = fish.indexOf(target); if(i > -1) fish.splice(i, 1);
    makeFish(340 + Math.random() * 280, .8 + Math.random() * .4);
    target = null;
    ensureMissionFish();               // 목표 친구를 다시 채워 둡니다
    setHook(REST_Y);
    state = 'idle';
    mainBtn.disabled = false;
    updateMainLabel();
    if(!milestone && !first && !questWin) tell('또 해 볼까요?');
  }, questWin ? 3400 : (milestone ? 2800 : 2000));
}

/* 물고기가 포물선을 그리며 솟았다가 통발 쪽으로 날아갑니다 */
function jumpOut(el, x0, y0){
  const topY = 60, endX = 900, endY = 40, t0 = performance.now(), dur = 1100;
  (function step(now){
    const p = Math.min(1, (now - t0) / dur);
    const x = x0 + (endX - x0) * p;
    const y = (1-p)*(1-p)*y0 + 2*(1-p)*p*topY + p*p*endY;   // 2차 베지에
    const sc = 1 - p * 0.55, rot = p * 380;
    el.setAttribute('transform',
      'translate(' + x.toFixed(1) + ',' + y.toFixed(1) + ') rotate(' + rot.toFixed(0) + ') scale(' + sc.toFixed(2) + ')');
    el.setAttribute('opacity', p > .75 ? ((1 - p) / .25).toFixed(2) : 1);
    if(p < 1) requestAnimationFrame(step); else el.remove();
  })(performance.now());
}

/* ---------- 효과 ---------- */
function fly(el, x, y, dx, dy, dur, spin){
  const t0 = performance.now();
  (function step(now){
    const p = (now - t0) / dur;
    if(p >= 1){ el.remove(); return; }
    el.setAttribute('transform',
      'translate(' + (x + dx*p) + ',' + (y + dy*p + 220*p*p) + ')' + (spin ? ' rotate(' + (p*420) + ')' : ''));
    el.setAttribute('opacity', (1 - p).toFixed(2));
    requestAnimationFrame(step);
  })(performance.now());
}
function sparkle(x, y, n){
  for(let i = 0; i < n; i++){
    const g = document.createElementNS(NS, 'g');
    const c = document.createElementNS(NS, 'circle');
    c.setAttribute('r', 4 + Math.random() * 8);
    c.setAttribute('fill', ['#ffd54a','#fff','#ff8a3d','#7ee0c0','#ff6f91'][i % 5]);
    g.appendChild(c); fxG.appendChild(g);
    const a = Math.random() * Math.PI * 2, d = 50 + Math.random() * 110;
    fly(g, x, y, Math.cos(a) * d, Math.sin(a) * d - 40, 900);
  }
}
function splash(x, y, n){
  for(let i = 0; i < n; i++){
    const g = document.createElementNS(NS, 'g');
    const c = document.createElementNS(NS, 'ellipse');
    c.setAttribute('rx', 5 + Math.random() * 6); c.setAttribute('ry', 4 + Math.random() * 5);
    c.setAttribute('fill', cfg.mode === 'ice' ? '#eaf7ff' : '#dff4ff');
    c.setAttribute('opacity', '.9');
    g.appendChild(c); fxG.appendChild(g);
    fly(g, x, y, (Math.random() - .5) * 150, -60 - Math.random() * 70, 620);
  }
}
function party(){
  chime([784,988,1175,1568]);
  buzz([80,50,80,50,150]);
  for(let i = 0; i < 40; i++){
    const g = document.createElementNS(NS, 'g');
    const r = document.createElementNS(NS, 'rect');
    r.setAttribute('width', 14); r.setAttribute('height', 9); r.setAttribute('rx', 2);
    r.setAttribute('x', -7); r.setAttribute('y', -4);
    r.setAttribute('fill', ['#ffd54a','#ff8a3d','#ff4f7b','#7ee0c0','#5ac8fa','#b79cff'][i % 6]);
    g.appendChild(r); fxG.appendChild(g);
    fly(g, 100 + Math.random() * 800, 120, (Math.random() - .5) * 220, 60 + Math.random() * 120, 1800, true);
  }
}

/* ---------- 오늘의 목표 ----------
   도감을 다 채우려면 오래 걸리니, 한두 마리로 끝나는 짧은 목표를 계속 줍니다.
   목표로 정한 친구는 반드시 물속에 있게 해서, 못 찾아 헤매는 일이 없습니다. */
let mission = null;
const missionEl = $('mission');

function questPool(){
  return SPECIES.filter(s =>
    (s.mode ? s.mode === cfg.mode : true) &&
    (s.night ? isNight() : true) &&
    (cfg.special ? true : !s.special));
}
function newMission(){
  if(!cfg.quest){ mission = null; missionEl.hidden = true; return; }
  const pool = questPool();
  if(Math.random() < 0.28 || !pool.length){
    mission = { any:true, need: 3 + Math.floor(Math.random() * 3), got:0 };
  }else{
    const sp = pool[Math.floor(Math.random() * pool.length)];
    mission = { key: sp.key, got:0,
                need: sp.special ? (1 + Math.floor(Math.random() * 2))
                                 : (2 + Math.floor(Math.random() * 2)) };
    ensureMissionFish();
  }
  showMission();
}
function showMission(){
  if(!mission){ missionEl.hidden = true; return; }
  missionEl.hidden = false;
  missionEl.classList.remove('done');
  if(mission.any){
    $('mIcon').textContent = '🐟';
    $('mText').innerHTML = '아무거나 <b>' + mission.got + '</b> / ' + mission.need;
  }else{
    const sp = byKey(mission.key);
    $('mIcon').innerHTML = iconHTML(sp, '40px', '28px');
    $('mText').innerHTML = sp.name + ' <b>' + mission.got + '</b> / ' + mission.need;
  }
}
/* 목표 친구가 물속에 없으면 한 마리를 그 친구로 바꿔 줍니다 */
function ensureMissionFish(){
  if(!mission || mission.any) return;
  if(fish.some(f => f.sp.key === mission.key)) return;
  const pool = fish.filter(f => f !== target);
  if(!pool.length) return;
  const victim = pool[Math.floor(Math.random() * pool.length)];
  const y = victim.y, base = victim.speedBase;
  if(selected === victim) clearPick();
  victim.el.remove();
  fish.splice(fish.indexOf(victim), 1);
  makeFish(y, base, byKey(mission.key));
}
/* 한 마리 잡았을 때 목표를 살핍니다 */
function missionCatch(sp){
  if(!mission) return false;
  if(!(mission.any || mission.key === sp.key)) return false;
  mission.got++;
  showMission();
  missionEl.classList.remove('pop'); void missionEl.offsetWidth; missionEl.classList.add('pop');
  setTimeout(() => missionEl.classList.remove('pop'), 300);
  if(mission.got >= mission.need){
    missionEl.classList.add('done');
    bonusStars += 2; saveBonus(); refreshCounts();
    setTimeout(() => { party(); chime([523,659,784,1047,1319]); tell('🎯 목표 성공! 잘했어요!'); }, 900);
    setTimeout(() => { newMission(); tell('새로운 목표예요!'); }, 3000);
    return true;
  }
  return false;
}

/* ---------- 물결 ---------- */
const wave = $('wave');
setInterval(() => {
  if(document.hidden || cfg.mode === 'ice') return;
  wave.setAttribute('transform', 'translate(' + (Math.sin(Date.now()/1400) * 22).toFixed(1) + ',0)');
}, 60);

/* ---------- 배경음악 ---------- */
const bgm = $('bgm'), bgmBtn = $('bgmBtn');
bgm.volume = .32;
let bgmReady = false;
function applyBgm(){
  bgmBtn.textContent = cfg.bgm ? '🎵' : '🔇';
  bgmBtn.style.opacity = cfg.bgm ? '1' : '.5';
  if(cfg.bgm && bgmReady) bgm.play().catch(() => {});
  else bgm.pause();
}
['pointerdown','keydown'].forEach(ev => document.addEventListener(ev, () => {
  bgmReady = true;
  if(cfg.bgm && bgm.paused) bgm.play().catch(() => {});
}));
bgmBtn.addEventListener('click', () => {
  cfg.bgm = cfg.bgm ? 0 : 1;
  saveCfg(); paintOpts(); bgmReady = true; applyBgm();
});
document.addEventListener('visibilitychange', () => {
  if(document.hidden) bgm.pause();
  else if(cfg.bgm && bgmReady) bgm.play().catch(() => {});
});
applyBgm();

mainBtn.addEventListener('click', lower);
paintOpts();
newMission();
updateMainLabel();
</script>
