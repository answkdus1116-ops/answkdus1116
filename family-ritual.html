<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#c8496a">
<title>우리 가족의 특별한 날</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Jua&display=swap');

  :root{
    --ink:#2b2438;
    --muted:#7c7490;
    --line:#e7e2ef;
    --accent:#c8496a;
    --accent-dark:#a83a57;
    --bg:#f6f1ea;
    --radius:20px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  [hidden]{display:none!important;}   /* .row 등에 display 가 있어서 꼭 필요합니다 */
  html,body{margin:0;padding:0;}
  body{
    font-family:'Gaegu',system-ui,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1100px 560px at 110% -10%, #ffe3ea 0%, transparent 55%),
      radial-gradient(900px 500px at -10% 105%, #e6f0e2 0%, transparent 55%),
      var(--bg);
    min-height:100dvh;
    padding:16px 14px 40px;
  }

  header{text-align:center;margin:6px 0 18px;}
  header h1{
    font-family:'Jua',sans-serif;font-size:clamp(22px,5vw,30px);
    color:var(--accent);margin:0 0 6px;letter-spacing:.5px;
  }
  header p{margin:0;color:var(--muted);font-size:clamp(15px,3.4vw,17px);font-weight:700;}

  .wrap{width:min(1080px,100%);margin:0 auto;}

  /* ---------------- 촬영 패널 ---------------- */
  .shoot{
    background:#fff;border-radius:26px;padding:18px;
    box-shadow:0 20px 44px rgba(60,40,70,.13);
    display:flex;flex-direction:column;align-items:center;gap:14px;
  }
  .camwrap{
    position:relative;width:min(340px,84vw);aspect-ratio:1/1;
    border-radius:50%;overflow:hidden;background:#1d1b26;
    box-shadow:0 0 0 6px #fff, 0 0 0 10px var(--accent-dark);
  }
  #video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block;}
  .guide{
    position:absolute;inset:12%;border-radius:50%;
    border:3px dashed rgba(255,255,255,.75);pointer-events:none;
  }
  .camwrap.ready .guide{border-color:#7ee0a8;border-style:solid;}
  .camstate{
    position:absolute;left:0;right:0;bottom:14px;text-align:center;
    font-family:'Jua';font-size:15px;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.6);
  }
  .shoot h2{font-family:'Jua';font-size:19px;margin:0;color:var(--ink);}
  /* 오려낸 얼굴 미리보기 : 그림 얼굴색 위에 올려 실제 모습대로 보여 줍니다 */
  .pvwrap{
    width:min(300px,74vw);aspect-ratio:1/1;border-radius:50%;background:#fae0c8;
    box-shadow:0 0 0 6px #fff, 0 0 0 10px var(--accent-dark);overflow:hidden;
  }
  #pvImg{width:100%;height:100%;object-fit:cover;display:block;}
  .tune{display:flex;flex-direction:column;align-items:center;gap:10px;}
  .tune label{font-family:'Jua';font-size:16px;display:flex;align-items:center;gap:10px;color:var(--muted);}
  input[type=range]{width:min(240px,64vw);accent-color:var(--accent);}
  .privacy{
    font-size:14px;color:var(--muted);text-align:center;margin:0;line-height:1.6;
    background:#f6f4fb;border-radius:14px;padding:8px 14px;
  }

  button{
    font-family:'Jua',sans-serif;font-size:16px;padding:12px 22px;border:0;
    border-radius:15px;background:var(--accent);color:#fff;cursor:pointer;
    box-shadow:0 4px 0 var(--accent-dark);transition:transform .06s;
  }
  button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-dark);}
  button:disabled{opacity:.5;cursor:default;box-shadow:0 4px 0 #cbc3d6;background:#b9b1c6;}
  button.ghost{background:#fff;color:var(--accent);box-shadow:0 0 0 2px #f2c8d3 inset;}
  button.ghost:active{transform:translateY(2px);}
  button.sm{font-size:15px;padding:9px 16px;border-radius:13px;}

  /* ---------------- 장면 카드 ---------------- */
  /* 한 장면씩 크게 보여 주고 넘깁니다 */
  .scenes{display:none;}
  .scenes.on{display:block;max-width:760px;margin:0 auto;}
  .card{
    background:#fff;border-radius:var(--radius);overflow:hidden;
    box-shadow:0 14px 30px rgba(60,40,70,.12);
    display:none;flex-direction:column;
  }
  .card.active{display:flex;animation:cardIn .28s ease-out;}
  @keyframes cardIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

  .nav{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    max-width:760px;margin:18px auto 12px;
  }
  .navbtn{
    width:52px;height:52px;padding:0;border-radius:50%;font-size:20px;flex:none;
  }
  .navmid{display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;min-width:0;}
  .navname{font-family:'Jua';font-size:19px;color:var(--accent);}
  .dots{display:flex;gap:8px;}
  .dot{
    width:11px;height:11px;border-radius:50%;background:#e0d5dd;border:0;padding:0;
    box-shadow:none;cursor:pointer;transition:transform .2s,background .2s;
  }
  .dot.on{background:var(--accent);transform:scale(1.35);}
  .stage{background:#f2eee9;line-height:0;}
  .scene{width:100%;height:auto;display:block;}
  .cap{
    font-family:'Jua';font-size:16px;text-align:center;margin:0;
    padding:12px 14px;color:#4a4358;background:var(--capbg,#eef2ff);
  }
  .row{display:flex;gap:8px;justify-content:center;padding:12px;flex-wrap:wrap;}

  .toolbar{
    display:none;position:sticky;bottom:0;margin-top:22px;padding:14px;
    background:rgba(255,255,255,.92);backdrop-filter:blur(8px);
    border-radius:20px;box-shadow:0 -6px 24px rgba(60,40,70,.12);
    justify-content:center;gap:10px;flex-wrap:wrap;
  }
  .toolbar.on{display:flex;}

  /* ---------------- 얼굴 자리 안내 ---------------- */
  .slot-hint{transition:opacity .3s;}
  .has-face .slot-hint{opacity:0;}

  /* 사진 배경을 넣으면 그려 둔 벡터 배경은 감춥니다 */
  .has-bg .bgVec{display:none;}

  /* ---------------- 동작 애니메이션 ---------------- */
  /* 세배 · 차례 : 상체를 숙인다 */
  .kneel-torso{transition:transform .85s cubic-bezier(.4,0,.3,1);}
  .kneel-head{transition:transform .85s cubic-bezier(.4,0,.3,1);}
  #s1 .kneel-torso{transform-origin:400px 480px;}
  #s1 .kneel-head{transform-origin:400px 300px;}
  #s4 .kneel-torso{transform-origin:400px 480px;}
  #s4 .kneel-head{transform-origin:400px 300px;}
  #s1.playing .kneel-torso,
  #s4.playing .kneel-torso{transform:translate(0,60px) scaleY(.70);}
  #s1.playing .kneel-head,
  #s4.playing .kneel-head{transform:translate(0,28px) scaleY(.55);}

  /* 결혼식 : 하객석에서 축하 박수를 친다 */
  #s2 .clap-l{transform-origin:206px 378px;}
  #s2 .clap-r{transform-origin:294px 378px;}
  #s2.playing .clap-l{animation:clapL .32s ease-in-out 6 alternate;}
  #s2.playing .clap-r{animation:clapR .32s ease-in-out 6 alternate;}
  @keyframes clapL{from{transform:rotate(0deg);}to{transform:rotate(13deg);}}
  @keyframes clapR{from{transform:rotate(0deg);}to{transform:rotate(-13deg);}}
  .petal{opacity:0;}
  #s2.playing .petal{animation:petalFall 2.3s ease-in forwards;}
  @keyframes petalFall{
    0%{opacity:0;transform:translate(0,0) rotate(0deg);}
    12%{opacity:1;}
    100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(420deg);}
  }

  /* 장례식 : 고개를 숙여 묵념한다 */
  .mourn-body{transition:transform 1s ease-in-out;}
  #s3 .mourn-body{transform-origin:400px 452px;}
  #s3.playing .mourn-body{transform:rotate(9deg) translate(0,10px);}
  #s3 .chrys{transition:transform 1s ease-in-out .3s, opacity .6s ease-in-out 1.1s;}
  #s3.playing .chrys{transform:translate(-118px,-56px) scale(.9);opacity:0;}

  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important;}}
</style>
  <script src="guard.js"></script>
</head>
<body>

<header>
  <h1>🏮 우리 가족의 특별한 날</h1>
  <p>가족마다 오래전부터 함께해 오던 특별한 일들이 있습니다</p>
</header>

<div class="wrap">

  <!-- ============ 1단계 : 얼굴 촬영 ============ -->
  <section class="shoot" id="shoot">
    <h2 id="shootTitle">① 동그라미 안에 얼굴을 맞춰 주세요</h2>

    <div class="camwrap" id="camwrap">
      <video id="video" playsinline autoplay muted></video>
      <div class="guide"></div>
      <div class="camstate" id="camstate">카메라를 준비하고 있어요…</div>
    </div>

    <div class="pvwrap" id="pvwrap" hidden>
      <img id="pvImg" alt="오려낸 얼굴 미리보기">
    </div>

    <div class="row" id="rowShoot">
      <button id="btnStart">📷 카메라 켜기</button>
      <button id="btnShot" disabled>✨ 찰칵! 찍기</button>
    </div>

    <div class="tune" id="tune" hidden>
      <label>얼굴 크기 <input type="range" id="zoom" min="70" max="150" value="100"></label>
      <div class="row">
        <button id="btnOk">✅ 이대로 할래요</button>
        <button class="ghost" id="btnAgain">↩︎ 다시 찍기</button>
      </div>
    </div>

    <p class="privacy">🔒 사진은 이 기기 안에서만 처리되며, 인터넷 어디로도 전송되지 않습니다.</p>
  </section>

  <!-- ============ 2단계 : 네 가지 장면 ============ -->
  <div class="nav" id="nav" hidden>
    <button class="navbtn" id="prevBtn" title="이전 장면">◀</button>
    <div class="navmid">
      <span class="navname" id="navName">설날 세배</span>
      <div class="dots" id="dots"></div>
    </div>
    <button class="navbtn" id="nextBtn" title="다음 장면">▶</button>
  </div>

  <div class="scenes" id="scenes">

    <!-- ───────── 장면 1 : 설날 세배 ───────── -->
    <article class="card">
      <div class="stage">
        <svg class="scene" id="s1" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="g1wall" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#fbf3e2"/><stop offset="1" stop-color="#f3e6cd"/>
            </linearGradient>
            <linearGradient id="g1floor" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#dcb98d"/><stop offset="1" stop-color="#c99e6d"/>
            </linearGradient>
            <clipPath id="clip1"><circle cx="400" cy="300" r="46"/></clipPath>
          </defs>

          <image class="bgImg" x="0" y="0" width="800" height="600" preserveAspectRatio="xMidYMid slice"/>
          <g class="bgVec">
          <rect width="800" height="600" fill="url(#g1wall)"/>
          <rect y="392" width="800" height="208" fill="url(#g1floor)"/>
          <path d="M0 392H800" stroke="#b98a58" stroke-width="4"/>

          <!-- 창호지 문 -->
          <g stroke="#c9a227" stroke-width="5" fill="#fdf8ea">
            <rect x="96" y="86" width="216" height="270" rx="4"/>
            <rect x="488" y="86" width="216" height="270" rx="4"/>
          </g>
          <g stroke="#d8b45a" stroke-width="3" opacity=".85">
            <path d="M168 86V356M240 86V356M96 176H312M96 266H312"/>
            <path d="M560 86V356M632 86V356M488 176H704M488 266H704"/>
          </g>

          <!-- 복주머니 -->
          <g transform="translate(400,74)">
            <path d="M-26 8q26-30 52 0q10 34-26 44q-36-10-26-44z" fill="#e05263"/>
            <path d="M-26 8h52" stroke="#f5c451" stroke-width="6" stroke-linecap="round"/>
            <path d="M0-22v24" stroke="#8b5e34" stroke-width="4"/>
          </g>

          <!-- 할아버지 -->
          <g transform="translate(212,300) scale(.86)">
            <ellipse cy="128" rx="96" ry="26" fill="#000" opacity=".08"/>
            <path d="M-78 128q10-96 78-96q68 0 78 96z" fill="#7c93c9"/>
            <path d="M-40 60q40 22 80 0" stroke="#5b71a8" stroke-width="6" fill="none"/>
            <rect x="-14" y="14" width="28" height="26" fill="#e8b98f"/>
            <circle cy="-14" r="42" fill="#f2c9a0"/>
            <path d="M-42-22q42-46 84 0q4-50-42-50q-46 0-42 50z" fill="#5b6472"/>
            <path d="M-16-12q6-6 12 0M4-12q6-6 12 0" stroke="#3f4653" stroke-width="4" fill="none" stroke-linecap="round"/>
            <path d="M-12 8q12 10 24 0" stroke="#c98a63" stroke-width="4" fill="none" stroke-linecap="round"/>
            <path d="M-18 22q18 26 36 0" fill="#e9edf5"/>
          </g>
          <!-- 할머니 -->
          <g transform="translate(588,300) scale(.86)">
            <ellipse cy="128" rx="96" ry="26" fill="#000" opacity=".08"/>
            <path d="M-78 128q10-96 78-96q68 0 78 96z" fill="#f0a8bd"/>
            <path d="M-40 60q40 22 80 0" stroke="#d98aa4" stroke-width="6" fill="none"/>
            <rect x="-14" y="14" width="28" height="26" fill="#e8b98f"/>
            <circle cy="-14" r="42" fill="#f7d2b0"/>
            <path d="M-42-18q0-54 42-54q42 0 42 54q-42-30-84 0z" fill="#6b6f7a"/>
            <circle cy="-58" r="13" fill="#5f636e"/>
            <path d="M-16-12q6-6 12 0M4-12q6-6 12 0" stroke="#3f4653" stroke-width="4" fill="none" stroke-linecap="round"/>
            <path d="M-11 8q11 12 22 0" stroke="#c98a63" stroke-width="4" fill="none" stroke-linecap="round"/>
          </g>

          <!-- 방석 -->
          <ellipse cx="400" cy="516" rx="150" ry="34" fill="#000" opacity=".1"/>
          <rect x="268" y="480" width="264" height="56" rx="16" fill="#c8496a"/>
          <rect x="268" y="480" width="264" height="18" rx="9" fill="#dd6486"/>
          <path d="M300 480v56M500 480v56" stroke="#a83a57" stroke-width="4"/>
          </g><!-- /bgVec -->

          <!-- 아이 (무릎 꿇은 자세) -->
          <g class="figure">
          <path d="M320 500q80-34 160 0q6 26-80 26q-86 0-80-26z" fill="#2f5d8f"/>
          <g class="kneel-torso">
            <path d="M330 490q6-122 70-122q64 0 70 122z" fill="#3d7ebd"/>
            <path d="M400 372l-30 40l30 22l30-22z" fill="#fdfdfd"/>
            <path d="M400 372l-30 40M400 372l30 40" stroke="#dfe6ee" stroke-width="3"/>
            <path d="M336 400q-34 24-26 70q30 16 54-8z" fill="#3d7ebd"/>
            <path d="M464 400q34 24 26 70q-30 16-54-8z" fill="#3d7ebd"/>
            <path d="M312 434q-8 16-4 30l26 8q4-20 0-32z" fill="#f5c451"/>
            <path d="M488 434q8 16 4 30l-26 8q-4-20 0-32z" fill="#f5c451"/>
            <path d="M306 452q-6 12-2 22l26 8q3-14 0-24z" fill="#5cb894"/>
            <path d="M494 452q6 12 2 22l-26 8q-3-14 0-24z" fill="#5cb894"/>
            <path d="M400 416q-18 30-8 62" stroke="#e05263" stroke-width="9" fill="none" stroke-linecap="round"/>
            <rect x="384" y="330" width="32" height="44" rx="10" fill="#eab98f"/>
            <g class="kneel-head">
              <path d="M400 236q68 0 68 74q0 30-14 46H346q-14-16-14-46q0-74 68-74z" fill="#3a3a44"/>
              <circle cx="400" cy="300" r="46" fill="#fae0c8"/>
              <image class="faceImg" clip-path="url(#clip1)" x="354" y="254" width="92" height="92" preserveAspectRatio="xMidYMid slice"/>
              <g class="slot-hint">
                <circle cx="400" cy="300" r="46" fill="none" stroke="#c8496a" stroke-width="3" stroke-dasharray="7 6"/>
                <text x="400" y="307" text-anchor="middle" font-family="Jua,sans-serif" font-size="17" fill="#c8496a">얼굴</text>
              </g>
              <path d="M354 286q10-44 46-44q36 0 46 44q-24-22-46-22q-22 0-46 22z" fill="#3a3a44"/>
              <path d="M352 264q48-54 96 0q-12-62-48-62q-36 0-48 62z" fill="#4a5db0"/>
              <path d="M352 264q48-54 96 0" fill="none" stroke="#8fa0e0" stroke-width="6"/>
              <circle cx="400" cy="206" r="9" fill="#f5c451"/>
            </g>
          </g>

          </g><!-- /figure -->

          <!-- 세뱃돈 봉투 -->
          <g class="bgVec" transform="translate(660,470) rotate(-10)">
            <rect width="76" height="50" rx="6" fill="#fdf6e6" stroke="#e0cba0" stroke-width="3"/>
            <path d="M0 0l38 28l38-28" fill="none" stroke="#e0cba0" stroke-width="3"/>
            <text x="38" y="42" text-anchor="middle" font-family="serif" font-size="15" fill="#c8496a">福</text>
          </g>
        </svg>
      </div>
      <p class="cap" style="--capbg:#e3f0fb">설날에 온 가족이 모여 세배를 합니다.</p>
      <div class="row">
        <button class="sm play" data-scene="s1" data-dur="1500">🙇 세배하기</button>
        <button class="sm ghost save" data-scene="s1" data-name="세배">💾 저장</button>
        <button class="sm ghost bg" data-scene="s1">🖼️ 배경</button>
      </div>
    </article>

    <!-- ───────── 장면 2 : 결혼식 축하 ───────── -->
    <article class="card">
      <div class="stage">
        <svg class="scene" id="s2" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="g2wall" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#fff8f2"/><stop offset="1" stop-color="#f7e9e4"/>
            </linearGradient>
            <clipPath id="clip2"><circle cx="250" cy="300" r="46"/></clipPath>
          </defs>

          <image class="bgImg" x="0" y="0" width="800" height="600" preserveAspectRatio="xMidYMid slice"/>
          <g class="bgVec">
            <rect width="800" height="600" fill="url(#g2wall)"/>
            <rect y="404" width="800" height="196" fill="#eadfd8"/>
            <path d="M0 404H800" stroke="#dbcdc4" stroke-width="3"/>

            <!-- 샹들리에 -->
            <g stroke="#f0c56a" stroke-width="4" fill="#ffeec2">
              <path d="M140 0v30"/><ellipse cx="140" cy="40" rx="32" ry="11"/>
              <path d="M118 43l-6 18M140 50v16M162 43l6 18"/>
              <circle cx="112" cy="68" r="7"/><circle cx="140" cy="73" r="7"/><circle cx="168" cy="68" r="7"/>
              <path d="M660 0v22"/><ellipse cx="660" cy="32" rx="28" ry="10"/>
              <path d="M640 35l-5 16M660 41v14M680 35l5 16"/>
              <circle cx="635" cy="58" r="6"/><circle cx="660" cy="62" r="6"/><circle cx="685" cy="58" r="6"/>
            </g>

            <!-- 축하 현수막 -->
            <g>
              <path d="M236 104h328v58H236z" fill="#f8c8d6"/>
              <path d="M236 104l-22 12 22 12zM564 104l22 12-22 12z" fill="#e0a5b8"/>
              <path d="M236 162l18 16 18-16zM528 162l18 16 18-16z" fill="#f4a6bb"/>
              <text x="400" y="142" text-anchor="middle" font-family="Jua,sans-serif" font-size="34" fill="#a83a57">축 결혼</text>
            </g>

            <!-- 단상 -->
            <rect x="392" y="368" width="300" height="16" rx="5" fill="#f3e6e0"/>
            <rect x="372" y="384" width="340" height="20" rx="5" fill="#e6d4cd"/>

            <!-- 꽃 아치 -->
            <path d="M428 372V276q0-84 114-84t114 84v96" fill="none" stroke="#8fbf85" stroke-width="14" stroke-linecap="round"/>
            <g>
              <circle cx="428" cy="300" r="14" fill="#f4a6bb"/><circle cx="440" cy="256" r="11" fill="#fff0f4"/>
              <circle cx="468" cy="222" r="14" fill="#f8c8d6"/><circle cx="508" cy="200" r="11" fill="#fff0f4"/>
              <circle cx="552" cy="194" r="14" fill="#f4a6bb"/><circle cx="596" cy="202" r="11" fill="#fff0f4"/>
              <circle cx="632" cy="228" r="14" fill="#f8c8d6"/><circle cx="652" cy="266" r="11" fill="#fff0f4"/>
              <circle cx="656" cy="310" r="14" fill="#f4a6bb"/><circle cx="428" cy="344" r="11" fill="#fff0f4"/>
              <circle cx="656" cy="350" r="12" fill="#f8c8d6"/>
            </g>

    <button id="btnSaveAll">🖼️ 네 장면 모아 저장</button>
    <button class="ghost" id="btnBgReset">🧹 배경 되돌리기</button>
  </div>

  <input type="file" id="bgFile" accept="image/*" hidden>

</div>

<canvas id="work" hidden></canvas>

<script>
/* =========================================================
   우리 가족의 특별한 날
   - 카메라로 찍은 얼굴을 네 가지 의례 장면에 합성합니다.
   - FaceMesh 로 두 눈을 찾아 기울기·크기를 맞춰 오리고,
     SelfieSegmentation 으로 뒤 배경을 지웁니다(누끼).
   - 모든 처리는 브라우저 안에서만 이루어집니다.
   ========================================================= */

const video    = document.getElementById('video');
const camwrap  = document.getElementById('camwrap');
const camstate = document.getElementById('camstate');
const btnStart = document.getElementById('btnStart');
const btnShot  = document.getElementById('btnShot');
const scenesEl = document.getElementById('scenes');
const toolbar  = document.getElementById('toolbar');
const shoot     = document.getElementById('shoot');
const shootTitle= document.getElementById('shootTitle');
const rowShoot  = document.getElementById('rowShoot');
const pvwrap    = document.getElementById('pvwrap');
const pvImg     = document.getElementById('pvImg');
const tune      = document.getElementById('tune');
const zoom      = document.getElementById('zoom');

let stream    = null;   // 카메라 스트림
let faceMesh  = null;   // 얼굴 랜드마크
let seg       = null;   // 사람/배경 분리
let landmarks = null;   // 최근 프레임의 얼굴 점들
let rafId     = null;
let frameNo   = 0;

const segCanvas = document.createElement('canvas');   // 최근 배경분리 마스크
let segReady = false;

/* 찍은 순간을 그대로 얼려 둡니다(슬라이더로 다시 오릴 수 있게) */
const shot = {
  w:0, h:0, lm:null, hasMask:false,
  frame: document.createElement('canvas'),
  mask : document.createElement('canvas')
};

/* ---------- 카메라 켜기 ---------- */
btnStart.addEventListener('click', async () => {
  btnStart.disabled = true;
  camstate.textContent = '카메라를 여는 중…';
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:'user', width:{ideal:1280}, height:{ideal:960} }, audio:false
    });
    video.srcObject = stream;
    await video.play();
    camstate.textContent = '얼굴을 찾는 중…';
    btnShot.disabled = false;
    initMediaPipe();
  }catch(err){
    camstate.textContent = '카메라를 열 수 없어요';
    btnStart.disabled = false;
    alert('카메라를 사용할 수 없습니다.\n브라우저의 카메라 권한을 확인해 주세요.\n\n(' + err.name + ')');
  }
});

/* ---------- 얼굴 인식 · 배경 분리 준비 ---------- */
function initMediaPipe(){
  const cdn = n => f => `https://cdn.jsdelivr.net/npm/@mediapipe/${n}/${f}`;

  if(typeof FaceMesh === 'function' && !faceMesh){
    try{
      faceMesh = new FaceMesh({ locateFile: cdn('face_mesh') });
      faceMesh.setOptions({ maxNumFaces:1, refineLandmarks:false,
                            minDetectionConfidence:.5, minTrackingConfidence:.5 });
      faceMesh.onResults(res => {
        landmarks = (res.multiFaceLandmarks && res.multiFaceLandmarks[0]) || null;
        camwrap.classList.toggle('ready', !!landmarks);
        camstate.textContent = landmarks ? '좋아요! 찍어 볼까요?' : '동그라미에 얼굴을 맞춰 주세요';
      });
    }catch(e){ faceMesh = null; }
  }
  if(typeof SelfieSegmentation === 'function' && !seg){
    try{
      seg = new SelfieSegmentation({ locateFile: cdn('selfie_segmentation') });
      seg.setOptions({ modelSelection:1 });
      seg.onResults(res => {
        const m = res.segmentationMask;
        if(!m) return;
        segCanvas.width = m.width; segCanvas.height = m.height;
        const c = segCanvas.getContext('2d');
        c.clearRect(0, 0, m.width, m.height);
        c.drawImage(m, 0, 0);
        segReady = true;
      });
    }catch(e){ seg = null; }
  }
  if(!faceMesh) camstate.textContent = '동그라미에 얼굴을 맞춰 주세요';
  startLoop();
}

/* 한쪽이 늦어져도 화면이 멈추지 않도록 기다리지 않고 넘깁니다 */
let fmBusy = false, segBusy = false;
function startLoop(){
  if(rafId) return;
  const tick = () => {
    if(video.readyState >= 2){
      frameNo++;
      if(faceMesh && !fmBusy){
        fmBusy = true;
        try{ faceMesh.send({image: video}).catch(()=>{}).finally(()=>{ fmBusy = false; }); }
        catch(e){ fmBusy = false; }
      }
      // 배경 분리는 조금 무거워서 세 프레임에 한 번만 돌립니다
      if(seg && !segBusy && frameNo % 3 === 0){
        segBusy = true;
        try{ seg.send({image: video}).catch(()=>{}).finally(()=>{ segBusy = false; }); }
        catch(e){ segBusy = false; }
      }
    }
    rafId = requestAnimationFrame(tick);
  };
  tick();
}
function stopLoop(){ if(rafId){ cancelAnimationFrame(rafId); rafId = null; } }

/* ---------- 찍은 순간 얼리기 ---------- */
function freeze(){
  const vw = video.videoWidth, vh = video.videoHeight;
  shot.w = vw; shot.h = vh;
  shot.frame.width = vw; shot.frame.height = vh;
  shot.frame.getContext('2d').drawImage(video, 0, 0, vw, vh);

  shot.hasMask = segReady;
  if(segReady){
    shot.mask.width = vw; shot.mask.height = vh;
    const mc = shot.mask.getContext('2d');
    mc.clearRect(0, 0, vw, vh);
    try{ mc.filter = 'blur(2px)'; }catch(e){}   // 오려낸 가장자리를 부드럽게
    mc.drawImage(segCanvas, 0, 0, vw, vh);
    mc.filter = 'none';
  }
  shot.lm = landmarks ? landmarks.map(p => ({x:p.x, y:p.y})) : null;
}

/* ---------- 얼굴 오려내기 ----------
   ① 두 눈(33·263)으로 가운데·크기·기울기를 맞춰 정사각형으로 오리고
   ② 배경분리 마스크로 뒤쪽을 지운 뒤
   ③ 가장자리를 부드러운 원으로 다듬습니다. */
const FACE_SIZE = 420;
function makeFace(zoomPct){
  const S = FACE_SIZE, vw = shot.w, vh = shot.h;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const ctx = c.getContext('2d');
  if(!vw || !vh) return c.toDataURL('image/png');

  const lm = shot.lm;
  let cx, cy, size, ang = 0;
  if(lm && lm[33] && lm[263]){
    const lx = lm[33].x*vw,  ly = lm[33].y*vh;
    const rx = lm[263].x*vw, ry = lm[263].y*vh;
    const d  = Math.hypot(rx-lx, ry-ly);
    ang  = Math.atan2(ry-ly, rx-lx);
    size = d * 4.1;                              // 머리가 들어갈 만큼 넉넉히
    cx = (lx+rx)/2 - Math.sin(ang)*d*0.45;       // 눈보다 조금 아래가 얼굴 한가운데
    cy = (ly+ry)/2 + Math.cos(ang)*d*0.45;
  }else{
    size = Math.min(vw, vh) * 0.78;              // 못 찾으면 안내 동그라미만큼 오립니다
    cx = vw/2; cy = vh/2;
  }
  size *= 100 / (zoomPct || 100);                // 슬라이더: 크게 = 좁게 오리기

  ctx.save();
  ctx.translate(S/2, S/2);
  ctx.scale(-1, 1);                              // 거울처럼 보이게 좌우 반전
  ctx.rotate(-ang);
  ctx.scale(S/size, S/size);
  ctx.translate(-cx, -cy);
  if(shot.hasMask){
    ctx.drawImage(shot.mask, 0, 0, vw, vh);      // 사람 부분에만 알파가 있습니다
    ctx.globalCompositeOperation = 'source-in';  // 겹치는 곳만 남기기
  }
  ctx.drawImage(shot.frame, 0, 0, vw, vh);
  ctx.restore();

  ctx.globalCompositeOperation = 'destination-in';
  const g = ctx.createRadialGradient(S/2, S/2, S*0.34, S/2, S/2, S*0.5);
  g.addColorStop(0, 'rgba(0,0,0,1)');
  g.addColorStop(0.88, 'rgba(0,0,0,1)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, S, S);
  ctx.globalCompositeOperation = 'source-over';
  return c.toDataURL('image/png');
}

/* ---------- 찰칵 → 확인 화면 ---------- */
btnShot.addEventListener('click', () => {
  freeze();
  stopLoop();
  zoom.value = 100;
  pvImg.src = makeFace(100);
  camwrap.hidden = true;  rowShoot.hidden = true;
  pvwrap.hidden  = false; tune.hidden     = false;
  shootTitle.textContent = '② 이렇게 넣을까요?';
});

zoom.addEventListener('input', () => { pvImg.src = makeFace(+zoom.value); });

document.getElementById('btnAgain').addEventListener('click', () => {
  camwrap.hidden = false; rowShoot.hidden = false;
  pvwrap.hidden  = true;  tune.hidden     = true;
  shootTitle.textContent = '① 동그라미 안에 얼굴을 맞춰 주세요';
  startLoop();
});

document.getElementById('btnOk').addEventListener('click', () => {
  const url = pvImg.src;
  document.querySelectorAll('.faceImg').forEach(img => {
    img.setAttribute('href', url);
    img.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', url);
  });
  document.querySelectorAll('.scene').forEach(s => s.classList.add('has-face'));
  scenesEl.classList.add('on');
  toolbar.classList.add('on');
  nav.hidden = false;
  show(0);
  stopCamera();
  shoot.style.display = 'none';
  nav.scrollIntoView({behavior:'smooth', block:'start'});
});

function stopCamera(){
  stopLoop();
  if(stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
}

/* ---------- 다시 찍기 ---------- */
document.getElementById('btnRetake').addEventListener('click', () => {
  scenesEl.classList.remove('on');
  toolbar.classList.remove('on');
  nav.hidden = true;
  shoot.style.display = '';
  camwrap.hidden = false; rowShoot.hidden = false;
  pvwrap.hidden  = true;  tune.hidden     = true;
  shootTitle.textContent = '① 동그라미 안에 얼굴을 맞춰 주세요';
  btnStart.disabled = false;
  btnShot.disabled = true;
  camwrap.classList.remove('ready');
  camstate.textContent = '카메라를 준비하고 있어요…';
  landmarks = null; segReady = false;
  shoot.scrollIntoView({behavior:'smooth', block:'center'});
});

/* ---------- 동작 재생 ---------- */
function play(id, dur){
  const el = document.getElementById(id);
  el.classList.remove('playing');
  void el.offsetWidth;              // 애니메이션 다시 시작시키기
  el.classList.add('playing');
  setTimeout(() => el.classList.remove('playing'), dur);
}
document.querySelectorAll('.play').forEach(b => {
  b.addEventListener('click', () => play(b.dataset.scene, +b.dataset.dur));
});
/* ---------- 한 장면씩 넘겨 보기 ---------- */
const NAMES = ['설날 세배', '결혼식', '장례식', '차례'];
const cards   = [...document.querySelectorAll('.card')];
const nav     = document.getElementById('nav');
const navName = document.getElementById('navName');
const dots    = document.getElementById('dots');
let cur = 0;

cards.forEach((_, i) => {
  const d = document.createElement('button');
  d.className = 'dot';
  d.title = (i+1) + '번째 장면';
  d.addEventListener('click', () => show(i));
  dots.appendChild(d);
});

function show(i){
  cur = (i + cards.length) % cards.length;
  cards.forEach((c, k) => c.classList.toggle('active', k === cur));
  navName.textContent = (cur+1) + '. ' + NAMES[cur];
  [...dots.children].forEach((d, k) => d.classList.toggle('on', k === cur));
}
document.getElementById('prevBtn').addEventListener('click', () => show(cur-1));
document.getElementById('nextBtn').addEventListener('click', () => show(cur+1));

/* 키보드 화살표 */
document.addEventListener('keydown', e => {
  if(nav.hidden) return;
  if(e.key === 'ArrowLeft')  show(cur-1);
  if(e.key === 'ArrowRight') show(cur+1);
});

/* 손가락으로 밀어 넘기기 */
let touchX = null;
scenesEl.addEventListener('touchstart', e => { touchX = e.changedTouches[0].clientX; }, {passive:true});
scenesEl.addEventListener('touchend', e => {
  if(touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if(Math.abs(dx) > 60) show(cur + (dx < 0 ? 1 : -1));
  touchX = null;
}, {passive:true});

/* ---------- 장면을 그림 파일로 ---------- */
const CAP = { s1:'설날에 온 가족이 모여 세배를 합니다.', s2:'결혼을 축하합니다.',
              s3:'장례식에서 함께 슬픔을 나눕니다.', s4:'차례를 지냅니다.' };

function sceneToImage(id){
  return new Promise((resolve, reject) => {
    const src = document.getElementById(id);
    const clone = src.cloneNode(true);
    clone.classList.remove('playing');
    clone.querySelectorAll('.slot-hint').forEach(g => g.remove());
    // 내보낸 SVG에는 이 문서의 CSS가 따라가지 않으므로 직접 지웁니다
    if(src.classList.contains('has-bg')){
      clone.querySelectorAll('.bgVec').forEach(g => g.remove());
    }
    clone.setAttribute('width', 800);
    clone.setAttribute('height', 600);
    const svg = new XMLSerializer().serializeToString(clone);
    const img = new Image();
    img.onload  = () => resolve(img);
    img.onerror = reject;
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  });
}

function drawCaption(ctx, text, x, y, w, h, size){
  ctx.fillStyle = '#fff';
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#4a4358';
  ctx.font = `${size}px Jua, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, x + w/2, y + h/2);
}

function download(canvas, filename){
  canvas.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }, 'image/png');
}

document.querySelectorAll('.save').forEach(b => {
  b.addEventListener('click', async () => {
    const id = b.dataset.scene;
    b.disabled = true;
    try{
      const img = await sceneToImage(id);
      const c = document.getElementById('work');
      c.width = 800; c.height = 672;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0,0,800,672);
      ctx.drawImage(img, 0, 0, 800, 600);
      drawCaption(ctx, CAP[id], 0, 600, 800, 72, 30);
      download(c, `가족의례_${b.dataset.name}.png`);
    }catch(e){
      alert('그림으로 만들지 못했습니다. 다시 시도해 주세요.');
    }finally{ b.disabled = false; }
  });
});

document.getElementById('btnSaveAll').addEventListener('click', async (e) => {
  const btn = e.currentTarget;
  btn.disabled = true;
  const old = btn.textContent; btn.textContent = '만드는 중…';
  try{
    const ids = ['s1','s2','s3','s4'];
    const imgs = await Promise.all(ids.map(sceneToImage));
    const c = document.getElementById('work');
    const W = 800, H = 600, CAPH = 66, PAD = 20, TITLE = 90;
    c.width  = PAD*3 + W*2;
    c.height = TITLE + PAD*3 + (H+CAPH)*2;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#f6f1ea'; ctx.fillRect(0,0,c.width,c.height);
    ctx.fillStyle = '#c8496a';
    ctx.font = '56px Jua, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('우리 가족의 특별한 날', c.width/2, TITLE/2 + 10);
    imgs.forEach((img, i) => {
      const x = PAD + (i%2) * (W + PAD);
      const y = TITLE + PAD + Math.floor(i/2) * (H + CAPH + PAD);
      ctx.fillStyle = '#fff';
      ctx.fillRect(x, y, W, H + CAPH);
      ctx.drawImage(img, x, y, W, H);
      drawCaption(ctx, CAP[ids[i]], x, y + H, W, CAPH, 30);
    });
    download(c, '가족의례_네장면.png');
  }catch(err){
    alert('그림으로 만들지 못했습니다. 다시 시도해 주세요.');
  }finally{ btn.disabled = false; btn.textContent = old; }
});

/* =========================================================
   배경 바꾸기
   - 인물(얼굴·몸)은 그대로 두고 뒤쪽 그림만 사진으로 바꿉니다.
   - 얼굴 위치는 손댈 필요가 없습니다.
   - bg/ 폴더에 파일이 있으면 자동으로, 없으면 직접 골라 넣습니다.
   ========================================================= */
const XLINK = 'http://www.w3.org/1999/xlink';
const BGKEY = 'ritual-bg-';
const SCENE_IDS = ['s1','s2','s3','s4'];

/* 사진 배경을 쓸 때 인물이 설 자리 (그림 배경일 때와 위치가 다릅니다)
   translate(x,y) scale(s) — 숫자만 바꾸면 인물 위치·크기가 조정됩니다 */
const FIG = {
  s1:{ plain:'',                  photo:'translate(68,179) scale(0.78)' },
  s2:{ plain:'',                  photo:'translate(15,95) scale(0.86)'  },
  s3:{ plain:'',                  photo:'translate(64,110) scale(0.84)' },
  s4:{ plain:'translate(146,0)',  photo:'translate(265,234) scale(0.70)'}
};
function placeFigure(id, usingPhoto){
  const fig = document.querySelector('#' + id + ' .figure');
  if(!fig) return;
  const t = usingPhoto ? FIG[id].photo : FIG[id].plain;
  if(t) fig.setAttribute('transform', t); else fig.removeAttribute('transform');
}

function setBg(id, url, persist){
  const scene = document.getElementById(id);
  const img = scene.querySelector('.bgImg');
  img.setAttribute('href', url);
  img.setAttributeNS(XLINK, 'xlink:href', url);
  scene.classList.add('has-bg');
  placeFigure(id, true);
  if(persist){
    try{ localStorage.setItem(BGKEY+id, url); }
    catch(e){ alert('배경을 기기에 저장할 공간이 부족합니다.\n이번 수업 동안만 적용됩니다.'); }
  }
}
function clearBg(id){
  const scene = document.getElementById(id);
  const img = scene.querySelector('.bgImg');
  img.removeAttribute('href');
  img.removeAttributeNS(XLINK, 'href');
  scene.classList.remove('has-bg');
  placeFigure(id, false);
  try{ localStorage.removeItem(BGKEY+id); }catch(e){}
}

/* 큰 사진은 줄여서 담습니다(저장 공간·속도) */
function fileToDataURL(file, maxW = 1280, maxH = 960){
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => {
      const im = new Image();
      im.onload = () => {
        const r = Math.min(1, maxW/im.width, maxH/im.height);
        const c = document.createElement('canvas');
        c.width  = Math.round(im.width  * r);
        c.height = Math.round(im.height * r);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', .85));
      };
      im.onerror = reject;
      im.src = fr.result;
    };
    fr.onerror = reject;
    fr.readAsDataURL(file);
  });
}

const bgFile = document.getElementById('bgFile');
let bgTarget = null;
document.querySelectorAll('.bg').forEach(b => {
  b.addEventListener('click', async () => {
    const id = b.dataset.scene;
    let mine = null;
    try{ mine = localStorage.getItem(BGKEY+id); }catch(e){}
    if(mine){
      if(confirm('이 기기에서 바꾼 배경을 지우고 원래 배경으로 되돌릴까요?\n(취소를 누르면 다른 사진으로 바꿉니다)')){
        clearBg(id);
        await loadSharedBg(id);      // 공용 배경이 있으면 그것으로
        return;
      }
    }
    bgTarget = id;
    bgFile.value = '';
    bgFile.click();
  });
});
bgFile.addEventListener('change', async () => {
  const f = bgFile.files && bgFile.files[0];
  if(!f || !bgTarget) return;
  try{ setBg(bgTarget, await fileToDataURL(f), true); }
  catch(e){ alert('사진을 불러오지 못했습니다.'); }
});

document.getElementById('btnBgReset').addEventListener('click', async () => {
  if(!confirm('이 기기에서 바꾼 배경을 모두 지우고 원래 배경으로 되돌릴까요?')) return;
  SCENE_IDS.forEach(clearBg);
  for(const id of SCENE_IDS) await loadSharedBg(id);
});

/* ---------- 모든 기기가 함께 쓰는 배경 (bg/backgrounds.json) ---------- */
let bgList = null, bgListDone = false;
async function getBgList(){
  if(bgListDone) return bgList;
  bgListDone = true;
  try{
    const res = await fetch('bg/backgrounds.json');
    if(res.ok) bgList = await res.json();
  }catch(e){ /* 목록이 없으면 그림 배경 */ }
  return bgList;
}
async function loadSharedBg(id){
  const list = await getBgList();
  if(!list || !list[id]) return false;
  try{
    const res = await fetch('bg/' + list[id]);
    if(!res.ok) return false;
    const blob = await res.blob();
    const url  = await new Promise((ok, no) => {
      const fr = new FileReader();
      fr.onload = () => ok(fr.result); fr.onerror = no;
      fr.readAsDataURL(blob);      // 저장(내보내기)까지 되도록 통째로 담아 둡니다
    });
    setBg(id, url, false);
    return true;
  }catch(e){ return false; }
}

/* 배경 불러오기 : ① 이 기기에서 바꾼 배경이 있으면 그것, ② 없으면 공용 배경 */
(async function loadBackgrounds(){
  for(const id of SCENE_IDS){
    let saved = null;
    try{ saved = localStorage.getItem(BGKEY+id); }catch(e){}
    if(saved){ setBg(id, saved, false); continue; }
    await loadSharedBg(id);
  }
})();

window.addEventListener('pagehide', stopCamera);
</script>
