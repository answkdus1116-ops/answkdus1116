<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#cfe8f7">
<title>분리수거 놀이</title>
<script src="guard.js"></script>
<link rel="stylesheet" href="playkit.css">
<script src="playkit.js"></script>
<style>
  body{background:#e9f5fc;}
  .pk-stage{padding:0;gap:0;}
  #stage{position:relative;flex:1;min-height:0;width:100%;overflow:hidden;display:flex;flex-direction:column;}

  /* ---------- 가운데 : 지금 버릴 쓰레기 ---------- */
  #cardArea{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px 16px 4px;}
  #progress{font-size:clamp(18px,3vw,24px);color:#2b5873;background:rgba(255,255,255,.9);border-radius:999px;padding:4px 16px;}
  .item{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;}
  .item.on .pc{outline:6px dashed #ffb03b;outline-offset:6px;}
  .item.dragging{cursor:grabbing;z-index:30;}
  .item.back{transition:transform .35s cubic-bezier(.3,1.3,.5,1);}
  .item.gone{opacity:0;transform:scale(.2);transition:transform .5s,opacity .5s;pointer-events:none;}
  .pc{width:min(42vh,70vw);aspect-ratio:4/3;border-radius:26px;border:8px solid #fff;overflow:hidden;background:#fff;box-shadow:0 10px 18px rgba(20,60,90,.25);}
  .pc img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;}
  .item-name{font-size:clamp(26px,5vw,40px);color:#1d4a66;background:#fff;border-radius:999px;padding:4px 22px;box-shadow:0 4px 10px rgba(20,60,90,.2);}

  /* ---------- 아래 : 분리수거함 3개 (예시 사진 붙어 있음) ---------- */
  #bins{display:grid;grid-template-columns:repeat(3,1fr);gap:3vw;padding:10px 3vw 16px;}
  .bin{position:relative;background:#fff;border-radius:26px;border:7px solid var(--c);box-shadow:0 8px 14px rgba(20,60,90,.2);padding:0 0 10px;display:flex;flex-direction:column;align-items:center;min-height:clamp(170px,30vh,260px);cursor:pointer;}
  .bin-head{width:100%;background:var(--c);color:#fff;font-size:clamp(22px,4vw,34px);font-weight:700;padding:6px 0;border-radius:18px 18px 0 0;text-align:center;}
  .bin-ex{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px 8px 0;width:100%;box-sizing:border-box;}
  .bin-ex figure{margin:0;}
  .bin-ex img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;display:block;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.15);}
  .bin-ex figcaption{font-size:clamp(12px,2vw,16px);color:#1d4a66;text-align:center;margin-top:2px;}
  .bin.over{transform:scale(1.06);box-shadow:0 0 0 6px #ffb03b,0 8px 14px rgba(20,60,90,.2);}
  .bin.hint{animation:hintPulse 1s ease-in-out infinite;}
  .bin.flash{animation:flashOk .6s ease;}
  @keyframes hintPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,176,59,.9),0 8px 14px rgba(20,60,90,.2)}50%{box-shadow:0 0 0 12px rgba(255,176,59,0),0 8px 14px rgba(20,60,90,.2)}}
  @keyframes flashOk{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1)}}
  .credit{position:absolute;left:0;right:0;bottom:2px;text-align:center;font-size:11px;color:#4b7085;pointer-events:none;}

  /* ---------- 처음 안내 · 끝 화면 ---------- */
  .overlay{position:absolute;inset:0;z-index:20;background:rgba(233,245,252,.94);display:flex;align-items:center;justify-content:center;padding:16px;}
  .card{background:#fff;border-radius:28px;padding:22px;width:min(640px,100%);box-shadow:0 14px 34px rgba(20,60,90,.22);display:flex;flex-direction:column;gap:14px;text-align:center;}
  .card h2{margin:0;font-size:clamp(26px,4.6vw,38px);color:#1d4a66;}
  .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .step{border:3px solid #cfe3ef;border-radius:20px;padding:12px 8px;background:#f5fbff;font-size:clamp(15px,2.6vw,21px);color:#1d4a66;}
  .step .n{font-size:clamp(34px,6vw,52px);display:block;}
  .badge{font-size:clamp(90px,18vw,150px);line-height:1;animation:jump .7s cubic-bezier(.2,1.7,.4,1);}
  @keyframes jump{from{transform:scale(.3)}to{transform:none}}
  .stars{font-size:clamp(30px,6vw,46px);letter-spacing:6px;}
  .row2{display:flex;gap:10px;}
  .row2 .pk-big,.row2 a.pk-big{font-size:clamp(17px,3.2vw,23px);padding:16px 6px;white-space:nowrap;text-decoration:none;text-align:center;}
  #pkSay{white-space:normal;line-height:1.25;}
  .pk-top .pk-say{font-size:clamp(17px,3vw,26px);}
  @media (max-width:520px){ .steps{grid-template-columns:1fr;} }
</style>
</head>
<body>

<div class="pk-top">
  <a class="pk-icon" href="index.html" title="목록으로">←</a>
  <div class="pk-say" id="pkSay">쓰레기를 보고 맞는 통에 넣어요</div>
  <button class="pk-icon" id="btnSet" title="설정">⚙️</button>
</div>

<div class="pk-stage">
  <div id="stage">

    <div id="cardArea">
      <div id="progress">0 / 0</div>
      <div class="item" id="item">
        <div class="pc"><img id="itemImg" alt=""></div>
        <div class="item-name" id="itemName"></div>
      </div>
    </div>

    <div id="bins">
      <div class="bin" data-cat="종이" style="--c:#2f7fc1">
        <div class="bin-head">📰 종이</div>
        <div class="bin-ex">
          <figure><img src="recycle/photo/newspaper.jpg" alt="신문지"><figcaption>신문지</figcaption></figure>
          <figure><img src="recycle/photo/cardboard.jpg" alt="골판지 상자"><figcaption>골판지 상자</figcaption></figure>
        </div>
      </div>
      <div class="bin" data-cat="플라스틱" style="--c:#e0a100">
        <div class="bin-head">🧴 플라스틱</div>
        <div class="bin-ex">
          <figure><img src="recycle/photo/pet.jpg" alt="페트병"><figcaption>페트병</figcaption></figure>
          <figure><img src="recycle/photo/shampoo.jpg" alt="샴푸 병"><figcaption>샴푸 병</figcaption></figure>
        </div>
      </div>
      <div class="bin" data-cat="캔" style="--c:#c23b3b">
        <div class="bin-head">🥫 캔</div>
        <div class="bin-ex">
          <figure><img src="recycle/photo/can.jpg" alt="콜라 캔"><figcaption>콜라 캔</figcaption></figure>
          <figure><img src="recycle/photo/can2.jpg" alt="음료 캔 묶음"><figcaption>음료 캔 묶음</figcaption></figure>
        </div>
      </div>
    </div>

    <!-- 처음 안내 -->
    <div class="overlay" id="intro">
      <div class="card">
        <h2>♻️ 분리수거 놀이</h2>
        <div class="steps">
          <div class="step"><span class="n">1</span>쓰레기 사진을 봐요</div>
          <div class="step"><span class="n">2</span>맞는 분리수거함으로 끌어다 놓아요</div>
          <div class="step"><span class="n">3</span>통 위의 사진을 보고 골라도 좋아요</div>
        </div>
        <button class="pk-big" id="btnStart">▶ 시작하기</button>
      </div>
    </div>

    <!-- 끝 -->
    <div class="overlay" id="done" hidden>
      <div class="card">
        <div class="badge">🏅</div>
        <h2>분리수거 완료!</h2>
        <div class="stars">⭐⭐⭐</div>
        <p style="margin:0;font-size:clamp(17px,3vw,22px);color:#1d4a66" id="doneText">모든 쓰레기를 알맞은 통에 넣었어요.</p>
        <div class="row2">
          <button class="pk-big ok" id="btnAgain">🔄 다시 하기</button>
          <a class="pk-big" href="index.html">🏠 목록으로</a>
        </div>
      </div>
    </div>

  </div>
</div>

<div class="pk-sheet" id="setSheet" hidden>
  <div class="pk-panel">
    <h2>⚙️ 설정</h2>
    <div class="pk-field">
      <span>소리 / 말</span>
      <div class="pk-opts" id="optSound">
        <button class="pk-opt" data-v="true">효과음 켜기</button>
        <button class="pk-opt" data-v="false">효과음 끄기</button>
      </div>
      <div class="pk-opts" id="optVoice">
        <button class="pk-opt" data-v="true">말해 주기</button>
        <button class="pk-opt" data-v="false">말 안 하기</button>
      </div>
    </div>
    <button class="pk-big ok" id="btnClose">시작하기</button>
    <button class="pk-big" id="btnRestart">🔄 처음부터 다시</button>
  </div>
</div>

<script src="recycle.js"></script>
</body>
</html>
