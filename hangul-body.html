<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>자연쌤의 몸으로 한글 만들기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#fff6e9; --bg2:#e9f5ff; --bg3:#f6ecff;
  --ink:#4a3f5c; --ink2:#7b6f8e;
  --pink:#ffb3c6; --pink-d:#ff7fa3;
  --mint:#a8e6cf; --mint-d:#5ecfa0;
  --sky:#a8d8ff; --sky-d:#5fb0ef;
  --lemon:#ffe6a7; --lemon-d:#ffc94d;
  --lilac:#d9c7ff;
  --card:rgba(255,255,255,.82);
  --shadow:0 10px 30px rgba(120,100,150,.18);
  --r:26px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  font-family:'Jua',system-ui,sans-serif; color:var(--ink);
  background:
    radial-gradient(1200px 700px at 10% 0%, var(--bg1) 0%, transparent 60%),
    radial-gradient(1000px 700px at 90% 10%, var(--bg3) 0%, transparent 55%),
    linear-gradient(160deg,#fdfbff 0%, var(--bg2) 100%);
  background-attachment:fixed;
  overflow:hidden; overscroll-behavior:none;
}
button{font-family:inherit;cursor:pointer;border:none}
.btn{
  background:#fff; color:var(--ink); border-radius:999px;
  padding:14px 26px; font-size:20px; box-shadow:var(--shadow);
  border:3px solid #fff; transition:transform .12s ease, filter .12s ease;
  min-height:56px;
}
.btn:active{transform:scale(.95)}
.btn:focus-visible{outline:4px solid var(--sky-d);outline-offset:3px}
.btn.primary{background:linear-gradient(180deg,var(--pink) 0%,var(--pink-d) 100%);color:#fff;font-size:26px;padding:18px 44px}
.btn.mint{background:linear-gradient(180deg,var(--mint) 0%,var(--mint-d) 100%);color:#fff}
.btn.sky{background:linear-gradient(180deg,var(--sky) 0%,var(--sky-d) 100%);color:#fff}
.btn.lemon{background:linear-gradient(180deg,var(--lemon) 0%,var(--lemon-d) 100%);color:#6b5320}

/* ── 화면 전환 ── */
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.screen.on{display:flex}

/* ── 시작 화면 ── */
#home h1{font-size:clamp(30px,7vw,58px);margin:6px 0 2px;text-align:center;letter-spacing:-1px}
#home .sub{font-family:'Gaegu';font-size:clamp(18px,3.6vw,26px);color:var(--ink2);margin-bottom:18px;text-align:center}
.mascot{width:min(38vw,170px);filter:drop-shadow(0 12px 18px rgba(255,127,163,.35));animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-12px) rotate(2deg)}}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:520px;margin:14px 0 22px}
.chip{background:#fff;border-radius:16px;padding:8px 14px;font-size:26px;box-shadow:0 4px 12px rgba(120,100,150,.13)}
.homebtns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

/* ── 놀이 화면 ── */
#play{padding:0;display:none}
#play.on{display:flex}
.stage{width:100%;height:100%;display:flex;gap:14px;padding:14px;flex-direction:row}
@media (max-aspect-ratio:1/1){.stage{flex-direction:column}}
.camwrap{
  position:relative;flex:1 1 auto;min-height:0;border-radius:var(--r);overflow:hidden;
  background:#2b2440;box-shadow:var(--shadow);border:5px solid #fff;
}
#cam,#ovl{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#ovl{pointer-events:none}
.camhint{
  position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
  background:rgba(43,36,64,.72);color:#fff;padding:10px 18px;border-radius:999px;
  font-size:17px;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis;
  transition:opacity .2s
}
.side{
  flex:0 0 340px;display:flex;flex-direction:column;gap:12px;min-height:0;
}
@media (max-aspect-ratio:1/1){.side{flex:0 0 auto}}
.card{background:var(--card);backdrop-filter:blur(10px);border-radius:var(--r);box-shadow:var(--shadow);border:3px solid rgba(255,255,255,.9);padding:14px}
.target{display:flex;align-items:center;gap:14px}
.glyph{
  font-size:clamp(64px,14vw,110px);line-height:.95;
  width:1.35em;height:1.35em;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#fff,#fff6fa);border-radius:24px;
  box-shadow:inset 0 0 0 4px var(--pink);color:var(--pink-d);flex:0 0 auto;
}
.glyph.ok{box-shadow:inset 0 0 0 4px var(--mint-d);color:var(--mint-d);animation:pop .45s}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.18)}100%{transform:scale(1)}}
.tinfo{min-width:0}
.tinfo .nm{font-size:26px}
.tinfo .gd{font-family:'Gaegu';font-weight:700;font-size:21px;color:var(--ink2);line-height:1.3;margin-top:4px}
#figbox{display:flex;align-items:center;justify-content:center;flex:1 1 auto;min-height:120px}
#figbox svg{width:100%;height:100%;max-height:260px}
.gauge{height:22px;border-radius:999px;background:#fff;overflow:hidden;box-shadow:inset 0 2px 6px rgba(120,100,150,.18)}
.gauge>i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--lemon-d),var(--mint-d));transition:width .1s linear}
.stars{display:flex;flex-wrap:wrap;gap:5px;font-size:22px;line-height:1}
.rowbtns{display:flex;gap:10px}
.rowbtns .btn{flex:1;font-size:18px;padding:12px 10px}

/* ── 성공 ── */
#burst{position:fixed;inset:0;pointer-events:none;display:none}
#burst.on{display:block}
.toast{
  position:fixed;left:50%;top:42%;transform:translate(-50%,-50%) scale(.6);
  background:#fff;border-radius:36px;padding:26px 44px;box-shadow:var(--shadow);
  font-size:clamp(32px,7vw,56px);color:var(--mint-d);opacity:0;transition:all .3s cubic-bezier(.2,1.6,.4,1);
  z-index:60;text-align:center;pointer-events:none
}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}

/* ── 설정 ── */
#set{background:rgba(74,63,92,.45);backdrop-filter:blur(4px);z-index:80;padding:0}
.panel{
  background:#fffdfa;width:min(560px,100%);max-height:100%;border-radius:var(--r) var(--r) 0 0;
  padding:20px;overflow:auto;box-shadow:var(--shadow)
}
@media (min-height:700px){.panel{border-radius:var(--r);max-height:92%}}
.panel h2{margin:0 0 4px;font-size:28px}
.panel .note{font-family:'Gaegu';font-weight:700;color:var(--ink2);font-size:18px;margin:0 0 14px}
.sec{margin:16px 0 6px;font-size:20px;color:var(--pink-d)}
.jgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px}
.jt{
  background:#f2eefa;border-radius:16px;padding:10px 4px;font-size:30px;text-align:center;
  border:3px solid transparent;color:var(--ink2);transition:.12s
}
.jt.on{background:linear-gradient(180deg,#fff,#ecfff6);border-color:var(--mint-d);color:var(--mint-d)}
.jt.dim{opacity:.35}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 4px;border-bottom:2px dotted #ece6f5}
.opt label{font-size:19px}
.opt .hint{font-family:'Gaegu';font-weight:700;font-size:16px;color:var(--ink2);display:block}
.sw{width:66px;height:36px;border-radius:999px;background:#ded7ea;position:relative;flex:0 0 auto;transition:.15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:30px;height:30px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:.15s}
.sw.on{background:var(--mint-d)}
.sw.on::after{left:33px}
.segs{display:flex;gap:6px}
.segs button{flex:1;background:#f2eefa;border-radius:14px;padding:11px 4px;font-size:17px;color:var(--ink2);border:3px solid transparent}
.segs button.on{background:#fff;border-color:var(--sky-d);color:var(--sky-d)}
.err{font-family:'Gaegu';font-weight:700;font-size:20px;color:#d1466b;text-align:center;max-width:520px;line-height:1.5}
.topbar{position:absolute;top:22px;right:26px;display:flex;gap:8px;z-index:10}
.topbar .btn{padding:10px 16px;font-size:17px;min-height:auto}
.loading{font-family:'Gaegu';font-weight:700;font-size:24px;color:var(--ink2)}
</style>
  <script src="guard.js"></script>
</head>
<body>

<!-- ═══════════ 시작 ═══════════ -->
<section id="home" class="screen on">
  <svg class="mascot" viewBox="0 0 120 112" aria-hidden="true">
    <path d="M60 105C22 78 6 58 6 37 6 19 19 7 34 7c11 0 20 6 26 15C66 13 75 7 86 7c15 0 28 12 28 30 0 21-16 41-54 68z" fill="#ffb3c6"/>
    <path d="M60 105C22 78 6 58 6 37 6 19 19 7 34 7c11 0 20 6 26 15C66 13 75 7 86 7c15 0 28 12 28 30 0 21-16 41-54 68z" fill="none" stroke="#ff7fa3" stroke-width="4"/>
    <ellipse cx="42" cy="45" rx="5" ry="7" fill="#4a3f5c"/><ellipse cx="76" cy="45" rx="5" ry="7" fill="#4a3f5c"/>
    <ellipse cx="31" cy="58" rx="7" ry="5" fill="#ff9ab5" opacity=".8"/><ellipse cx="87" cy="58" rx="7" ry="5" fill="#ff9ab5" opacity=".8"/>
    <path d="M50 60q9 10 18 0" stroke="#4a3f5c" stroke-width="4" fill="none" stroke-linecap="round"/>
  </svg>
  <h1>몸으로 한글 만들기</h1>
  <p class="sub">마음이랑 같이 몸으로 자모를 만들어 봐요</p>
  <div class="chips" id="homeChips"></div>
  <div class="homebtns">
    <button class="btn primary" id="goStart">시작하기</button>
    <button class="btn lemon" id="goSet">선생님 설정</button>
  </div>
</section>

<!-- ═══════════ 놀이 ═══════════ -->
<section id="play" class="screen">
  <div class="stage">
    <div class="camwrap">
      <video id="cam" autoplay playsinline muted></video>
      <canvas id="ovl"></canvas>
      <div class="camhint" id="camhint">카메라를 준비하고 있어요…</div>
    </div>
    <div class="side">
      <div class="card target">
        <div class="glyph" id="glyph">ㅣ</div>
        <div class="tinfo">
          <div class="nm" id="tname">이</div>
          <div class="gd" id="tguide">준비 중…</div>
        </div>
      </div>
      <div class="card" id="figcard"><div id="figbox"></div></div>
      <div class="card" style="display:flex;flex-direction:column;gap:10px">
        <div class="gauge"><i id="gfill"></i></div>
        <div class="stars" id="stars"></div>
      </div>
      <div class="rowbtns">
        <button class="btn sky" id="btnSay">다시 듣기</button>
        <button class="btn lemon" id="btnSkip">건너뛰기</button>
        <button class="btn" id="btnHome">그만</button>
      </div>
    </div>
  </div>
</section>

<!-- ═══════════ 오류 ═══════════ -->
<section id="fail" class="screen">
  <div class="mascot" style="font-size:70px">😿</div>
  <p class="err" id="failMsg"></p>
  <button class="btn primary" id="failBack" style="margin-top:18px">돌아가기</button>
</section>

<!-- ═══════════ 설정 ═══════════ -->
<section id="set" class="screen">
  <div class="panel">
    <h2>선생님 설정</h2>
    <p class="note">학생의 움직임에 맞게 조절하세요. 설정은 이 화면을 닫으면 바로 적용돼요.</p>

    <div class="sec">연습할 자모</div>
    <div class="jgrid" id="jgrid"></div>
    <div class="rowbtns" style="margin-top:10px">
      <button class="btn mint" id="selVowel">모음만</button>
      <button class="btn sky" id="selCons">자음만</button>
      <button class="btn lemon" id="selAll">전체</button>
    </div>

    <div class="sec">난이도</div>
    <div class="opt"><label>인정 범위<span class="hint">넉넉할수록 비슷한 자세도 통과돼요</span></label></div>
    <div class="segs" id="segTol">
      <button data-v="0.8">정확하게</button><button data-v="1">보통</button><button data-v="1.35">넉넉하게</button>
    </div>
    <div class="opt" style="border:none"><label>자세 유지 시간<span class="hint">이 시간만큼 버티면 통과</span></label></div>
    <div class="segs" id="segHold">
      <button data-v="600">0.6초</button><button data-v="1200">1.2초</button><button data-v="2000">2초</button><button data-v="3000">3초</button>
    </div>

    <div class="sec">움직임 조건</div>
    <div class="opt">
      <label>다리 동작 사용<span class="hint">끄면 ㅅ, ㅈ은 목록에서 빠져요</span></label>
      <div class="sw" data-k="useLegs"></div>
    </div>
    <div class="opt">
      <label>ㅏ와 ㅓ 좌우 구분<span class="hint">끄면 ㅏ만 나오고 어느 팔이든 인정</span></label>
      <div class="sw" data-k="strictLR"></div>
    </div>
    <div class="opt">
      <label>ㄱ, ㄴ은 아무 팔이나<span class="hint">한쪽 팔만 움직이는 학생용</span></label>
      <div class="sw" data-k="anyArm"></div>
    </div>

    <div class="sec">진행과 안내</div>
    <div class="opt"><label>순서<span class="hint">쉬운 순서 또는 섞기</span></label>
      <div class="segs" id="segOrder" style="flex:0 0 190px"><button data-v="seq">차례대로</button><button data-v="rnd">섞기</button></div>
    </div>
    <div class="opt"><label>음성 안내</label><div class="sw" data-k="tts"></div></div>
    <div class="opt"><label>효과음</label><div class="sw" data-k="sound"></div></div>
    <div class="opt"><label>성공하면 자동으로 다음</label><div class="sw" data-k="autoNext"></div></div>
    <div class="opt"><label>몸 선 보여주기</label><div class="sw" data-k="skeleton"></div></div>

    <button class="btn primary" id="setClose" style="width:100%;margin-top:20px">닫기</button>
  </div>
</section>

<div class="toast" id="toast">잘했어요!</div>
<canvas id="burst"></canvas>

<script type="module">
import { PoseLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

/* ══════════════════════════════════════════════════════
   1. 설정 (메모리 보관)
   ══════════════════════════════════════════════════════ */
const S = {
  tol: 1, holdMs: 1200,
  useLegs: true, strictLR: true, anyArm: true,
  order: 'seq', tts: true, sound: true, autoNext: true, skeleton: true,
  on: {}   // 자모별 선택 여부
};

/* ══════════════════════════════════════════════════════
   2. 자모 정의
   각 자세는 팔 각도(어깨 기준 바깥쪽 0°, 위 +90°, 아래 -90°),
   팔꿈치 각도, 다리 벌림으로 판정합니다.
   ══════════════════════════════════════════════════════ */
const D = Math.PI/180;

// 시범 그림용 관절 각도 (up=위팔, fore=아래팔)
const F = (lu,lf,ru,rf,legs) => ({L:{u:lu,f:lf}, R:{u:ru,f:rf}, legs:legs||'together'});

const JAMO = [
  // ── 모음 ──
  { ch:'ㅣ', name:'이', type:'v', legs:false, fig:F(-90,-90,-90,-90),
    guide:'차렷! 팔을 몸에 붙이고 곧게 서요',
    cond:(f,t)=>[
      ['왼팔 아래로', armAt(f.L,-95,32,t)],
      ['오른팔 아래로', armAt(f.R,-95,32,t)],
      ['팔 쭉 펴기', straight(f.elL,t) && straight(f.elR,t)]
    ]},

  { ch:'ㅡ', name:'으', type:'v', legs:false, fig:F(0,0,0,0),
    guide:'양팔을 옆으로 쭉! 一 자로 펴요',
    cond:(f,t)=>[
      ['왼팔 옆으로', armAt(f.L,0,22,t)],
      ['오른팔 옆으로', armAt(f.R,0,22,t)],
      ['팔 쭉 펴기', straight(f.elL,t) && straight(f.elR,t)]
    ]},

  { ch:'ㅏ', name:'아', type:'v', legs:false, fig:F(-90,-90,0,0),
    guide:'오른팔만 옆으로 쭉 뻗어요',
    cond:(f,t)=> S.strictLR
      ? [['오른팔 옆으로', armAt(f.R,0,25,t) && straight(f.elR,t)],
         ['왼팔은 아래로', armAt(f.L,-95,38,t)]]
      : [['한쪽 팔 옆으로', (armAt(f.R,0,25,t)&&straight(f.elR,t)) || (armAt(f.L,0,25,t)&&straight(f.elL,t))],
         ['다른 팔은 아래로', armAt(f.L,-95,38,t) || armAt(f.R,-95,38,t)]]},

  { ch:'ㅓ', name:'어', type:'v', legs:false, fig:F(0,0,-90,-90),
    guide:'왼팔만 옆으로 쭉 뻗어요',
    cond:(f,t)=>[
      ['왼팔 옆으로', armAt(f.L,0,25,t) && straight(f.elL,t)],
      ['오른팔은 아래로', armAt(f.R,-95,38,t)]
    ]},

  { ch:'ㅗ', name:'오', type:'v', legs:false, fig:F(78,78,78,78),
    guide:'양팔을 위로 번쩍! 만세',
    cond:(f,t)=>[
      ['왼팔 위로', armAt(f.L,78,28,t)],
      ['오른팔 위로', armAt(f.R,78,28,t)],
      ['팔 쭉 펴기', straight(f.elL,t) && straight(f.elR,t)],
      ['손은 벌려서', f.wristRatio > 0.85/t]
    ]},

  { ch:'ㅜ', name:'우', type:'v', legs:false, fig:F(-42,-42,-42,-42),
    guide:'양팔을 아래로 비스듬히 벌려요',
    cond:(f,t)=>[
      ['왼팔 아래로 벌리기', armAt(f.L,-40,21,t)],
      ['오른팔 아래로 벌리기', armAt(f.R,-40,21,t)],
      ['팔 쭉 펴기', straight(f.elL,t) && straight(f.elR,t)]
    ]},

  // ── 자음 ──
  { ch:'ㄱ', name:'기역', type:'c', legs:false, fig:F(-90,-90,0,-90),
    guide:'오른팔을 옆으로 들고 팔꿈치를 꺾어 손을 아래로',
    cond:(f,t)=>{
      const one = (a,el)=>[ angAt(a.u,3,26,t), angAt(a.f,-88,34,t), el>52 && el<128+18*t ];
      const R = one(f.R,f.elR), L = one(f.L,f.elL);
      const okR = R.every(Boolean), okL = S.anyArm && L.every(Boolean);
      return [
        ['팔꿈치를 ㄱ 모양으로', okR||okL],
        ['위팔은 옆으로', okR? true : (okL? true : angAt(f.R.u,3,26,t))],
        ['손끝은 아래로', okR? true : (okL? true : angAt(f.R.f,-88,34,t))]
      ];
    }},

  { ch:'ㄴ', name:'니은', type:'c', legs:false, fig:F(-90,-90,-90,0),
    guide:'오른 팔꿈치를 옆구리에 붙이고 손만 옆으로 쭉',
    cond:(f,t)=>{
      const one = (a,el)=>[ angAt(a.u,-84,30,t), angAt(a.f,3,29,t), el>52 && el<128+18*t ];
      const R = one(f.R,f.elR), L = one(f.L,f.elL);
      const okR = R.every(Boolean), okL = S.anyArm && L.every(Boolean);
      return [
        ['팔꿈치를 ㄴ 모양으로', okR||okL],
        ['위팔은 아래로', okR||okL || angAt(f.R.u,-84,30,t)],
        ['손끝은 옆으로', okR||okL || angAt(f.R.f,3,29,t)]
      ];
    }},

  { ch:'ㅅ', name:'시옷', type:'c', legs:true, fig:F(-80,-80,-80,-80,'apart'),
    guide:'다리를 시옷처럼 활짝 벌리고 서요',
    cond:(f,t)=>[
      ['다리 벌리기', f.ankleRatio !== null && f.ankleRatio > 1.75/t],
      ['팔은 아래로', armAt(f.L,-88,42,t) && armAt(f.R,-88,42,t)]
    ]},

  { ch:'ㅇ', name:'이응', type:'c', legs:false, fig:F(45,130,45,130),
    guide:'머리 위로 두 팔을 동그랗게 모아요',
    cond:(f,t)=>[
      ['팔꿈치 구부리기', bent(f.elL,t) && bent(f.elR,t)],
      ['손을 머리 위로', f.wristsUp],
      ['두 손 모으기', f.wristRatio < 0.8*t]
    ]},

  { ch:'ㅈ', name:'지읒', type:'c', legs:true, fig:F(0,0,0,0,'apart'),
    guide:'다리는 벌리고 양팔은 옆으로 쭉!',
    cond:(f,t)=>[
      ['다리 벌리기', f.ankleRatio !== null && f.ankleRatio > 1.75/t],
      ['양팔 옆으로', armAt(f.L,0,25,t) && armAt(f.R,0,25,t)],
      ['팔 쭉 펴기', straight(f.elL,t) && straight(f.elR,t)]
    ]}
];
JAMO.forEach(j => S.on[j.ch] = true);

/* ── 조건 헬퍼 ── */
function wrap(d){ while(d>180)d-=360; while(d<-180)d+=360; return d; }
function angAt(v,c,hw,t){ return v!==null && Math.abs(wrap(v-c)) <= hw*t; }
function armAt(a,c,hw,t){ return angAt(a.w,c,hw,t); }          // 어깨→손목
function straight(el,t){ return el!==null && el > 165-25*t; }   // 팔꿈치 편 상태
function bent(el,t){ return el!==null && el < 100+40*t; }       // 팔꿈치 굽힌 상태

/* ══════════════════════════════════════════════════════
   3. 자세 특징 계산
   ══════════════════════════════════════════════════════ */
const I = {nose:0, lsh:11, rsh:12, lel:13, rel:14, lwr:15, rwr:16, lhip:23, rhip:24, lkn:25, rkn:26, lank:27, rank:28};
const dist=(a,b)=>Math.hypot(a.x-b.x, a.y-b.y);

function segAng(a,b,out){ // a→b, out=+1이면 바깥쪽이 +x
  return Math.atan2(-(b.y-a.y), (b.x-a.x)*out)/D;
}
function jointAng(a,b,c){ // b에서의 각도
  const v1={x:a.x-b.x,y:a.y-b.y}, v2={x:c.x-b.x,y:c.y-b.y};
  const m=Math.hypot(v1.x,v1.y)*Math.hypot(v2.x,v2.y);
  if(!m) return null;
  return Math.acos(Math.max(-1,Math.min(1,(v1.x*v2.x+v1.y*v2.y)/m)))/D;
}

function features(lm, W, H){
  const P = i => ({x:lm[i].x*W, y:lm[i].y*H, v:(lm[i].visibility??1)});
  const lsh=P(I.lsh), rsh=P(I.rsh), lel=P(I.lel), rel=P(I.rel), lwr=P(I.lwr), rwr=P(I.rwr), nose=P(I.nose);
  const upperOk = Math.min(lsh.v,rsh.v,lwr.v,rwr.v) > 0.45;
  const shW = dist(lsh,rsh) || 1;
  const rOut = Math.sign(rsh.x - lsh.x) || -1, lOut = -rOut;

  const arm = (sh,el,wr,out)=>({
    u: segAng(sh,el,out),   // 위팔
    f: segAng(el,wr,out),   // 아래팔
    w: segAng(sh,wr,out)    // 어깨→손목 (전체 방향)
  });

  // 다리
  let ankleRatio = null;
  const lank=P(I.lank), rank=P(I.rank), lkn=P(I.lkn), rkn=P(I.rkn);
  if(S.useLegs){
    if(Math.min(lank.v,rank.v) > 0.45)      ankleRatio = dist(lank,rank)/shW;
    else if(Math.min(lkn.v,rkn.v) > 0.45)   ankleRatio = dist(lkn,rkn)/shW * 1.15;
  }

  return {
    ok: upperOk,
    L: arm(lsh,lel,lwr,lOut), R: arm(rsh,rel,rwr,rOut),
    elL: jointAng(lsh,lel,lwr), elR: jointAng(rsh,rel,rwr),
    wristRatio: dist(lwr,rwr)/shW,
    wristsUp: lwr.y < nose.y && rwr.y < nose.y,
    ankleRatio,
    legsVisible: ankleRatio !== null
  };
}

/* ══════════════════════════════════════════════════════
   4. 시범 스틱피겨 (거울 화면 기준 = 학생 오른쪽이 그림 오른쪽)
   ══════════════════════════════════════════════════════ */
function stickSVG(fig, done){
  const cx=100, headY=36, r=19, neck=58, shY=76, hipY=150, UA=36, FA=36;
  const shL={x:cx-27,y:shY}, shR={x:cx+27,y:shY};
  const pt=(o,ang,len,out)=>({x:o.x + Math.cos(ang*D)*len*out, y:o.y - Math.sin(ang*D)*len});
  const elL=pt(shL,fig.L.u,UA,-1), wrL=pt(elL,fig.L.f,FA,-1);
  const elR=pt(shR,fig.R.u,UA, 1), wrR=pt(elR,fig.R.f,FA, 1);
  const apart = fig.legs==='apart';
  const hipL={x:cx-16,y:hipY}, hipR={x:cx+16,y:hipY};
  const knL ={x:cx-(apart?42:20),y:hipY+40}, knR={x:cx+(apart?42:20),y:hipY+40};
  const anL ={x:cx-(apart?66:22),y:hipY+80}, anR={x:cx+(apart?66:22),y:hipY+80};
  const c = done? '#5ecfa0' : '#ff7fa3';
  const L=(a,b)=>`<line x1="${a.x.toFixed(1)}" y1="${a.y.toFixed(1)}" x2="${b.x.toFixed(1)}" y2="${b.y.toFixed(1)}"/>`;
  const dot=(p)=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="5.5" fill="${c}"/>`;
  return `<svg viewBox="0 0 200 250" xmlns="http://www.w3.org/2000/svg">
    <g stroke="${c}" stroke-width="11" stroke-linecap="round" fill="none">
      ${L({x:cx,y:neck},{x:cx,y:hipY})}
      ${L(shL,shR)} ${L(hipL,hipR)}
      ${L(shL,elL)}${L(elL,wrL)}${L(shR,elR)}${L(elR,wrR)}
      ${L(hipL,knL)}${L(knL,anL)}${L(hipR,knR)}${L(knR,anR)}
    </g>
    <circle cx="${cx}" cy="${headY}" r="${r}" fill="${c}"/>
    ${dot(wrL)}${dot(wrR)}
  </svg>`;
}

/* ══════════════════════════════════════════════════════
   5. 소리 / 음성
   ══════════════════════════════════════════════════════ */
let AC=null;
const ac = ()=> AC || (AC = new (window.AudioContext||window.webkitAudioContext)());
function beep(freqs, dur=0.14, gain=0.13){
  if(!S.sound) return;
  try{
    const c=ac(); let t=c.currentTime;
    freqs.forEach(f=>{
      const o=c.createOscillator(), g=c.createGain();
      o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(gain,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur+0.02); t+=dur*0.8;
    });
  }catch(e){}
}
const sndOk   = ()=>beep([660,880,1175],0.16,0.15);
const sndTick = ()=>beep([520],0.05,0.05);
const sndNext = ()=>beep([440,587],0.12,0.1);

let voice=null;
function pickVoice(){
  if(!('speechSynthesis' in window)) return;
  const vs=speechSynthesis.getVoices();
  voice = vs.find(v=>v.lang && v.lang.toLowerCase().startsWith('ko')) || null;
}
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text){
  if(!S.tts || !('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='ko-KR'; u.rate=0.92; u.pitch=1.15; if(voice) u.voice=voice;
    speechSynthesis.speak(u);
  }catch(e){}
}

   8. 게임 진행

let queue=[], qi=0, cur=null, holdStart=0, passed=false, running=false;

function buildQueue(keepProgress){
  let list = JAMO.filter(j=>S.on[j.ch] && (!j.legs || S.useLegs));
  if(!S.strictLR) list = list.filter(j=>j.ch!=='ㅓ');
  if(!list.length) list = [JAMO[0]];
  if(S.order==='rnd') list = list.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(v=>v[1]);
  queue=list; if(!keepProgress||qi>=queue.length) qi=0;
  setTarget();
}
function renderStars(){
  stars.innerHTML = queue.map((j,i)=>`<span>${i<qi?'⭐':'☆'}</span>`).join('') + `<span style="font-family:Gaegu;font-size:18px;color:var(--ink2);margin-left:6px">${qi}/${queue.length}</span>`;
}
function setTarget(){
  cur = queue[qi]; passed=false; holdStart=0;
  glyph.textContent=cur.ch; glyph.classList.remove('ok');
  tname.textContent=`${cur.ch}  ·  ${cur.name}`;
  tguide.textContent=cur.guide;
  figbox.innerHTML = stickSVG(cur.fig,false);
  gfill.style.width='0%';
  renderStars();
  say(`${cur.name}. ${cur.guide}`);
}
function nextTarget(){
  qi++;
  if(qi>=queue.length){ finishAll(); return; }
  sndNext(); setTarget();
}
function finishAll(){
  renderStars();
  showToast('모두 성공! 🎉'); confetti(); say('모두 성공했어요. 정말 잘했어요.');
  setTimeout(()=>{ qi=0; buildQueue(true); }, 2600);
}
$('#btnSkip').onclick = ()=>{ if(!cur) return; sndNext(); qi=Math.min(qi+1,queue.length-1); setTarget(); };
$('#btnSay').onclick  = ()=>{ if(cur) say(`${cur.name}. ${cur.guide}`); };
$('#btnHome').onclick = ()=>{ stopCam(); show('home'); };
addEventListener('keydown', e=>{
  if(!running) return;
  if(e.code==='Space'){ e.preventDefault(); $('#btnSkip').click(); }
  if(e.code==='Enter'){ e.preventDefault(); $('#btnSay').click(); }
});

function succeed(){
  if(passed) return; passed=true;
  glyph.classList.add('ok');
  figbox.innerHTML = stickSVG(cur.fig,true);
  gfill.style.width='100%';
  sndOk(); confetti(); showToast(pick(['잘했어요!','최고예요!','정확해요!','멋져요!']));
  say(pick(['잘했어요','최고예요','정확해요']));
  qi = Math.min(qi+1, queue.length); renderStars();
  if(S.autoNext) setTimeout(()=>{ if(qi>=queue.length) finishAll(); else { qi--; nextTarget(); } }, 1500);
}
const pick = a => a[Math.floor(Math.random()*a.length)];

/* ══════════════════════════════════════════════════════
   9. 카메라 + 포즈 인식
   ══════════════════════════════════════════════════════ */
let landmarker=null, stream=null, raf=0, lastTs=-1;

async function initLandmarker(){
  if(landmarker) return;
  const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  landmarker = await PoseLandmarker.createFromOptions(vision,{
    baseOptions:{
      modelAssetPath:"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
      delegate:"GPU"
    },
    runningMode:"VIDEO", numPoses:1,
    minPoseDetectionConfidence:0.5, minPosePresenceConfidence:0.5, minTrackingConfidence:0.5
  });
}
async function startCam(){
  stream = await navigator.mediaDevices.getUserMedia({
    video:{ facingMode:'user', width:{ideal:960}, height:{ideal:720} }, audio:false
  });
  video.srcObject = stream;
  await video.play();
}
function stopCam(){
  running=false; cancelAnimationFrame(raf);
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
  try{ speechSynthesis.cancel(); }catch(e){}
}

const CONN = [[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28]];
function drawPose(lm,W,H,good){
  octx.clearRect(0,0,W,H);
  if(!S.skeleton || !lm) return;
  octx.lineWidth = Math.max(5, W*0.008);
  octx.strokeStyle = good ? 'rgba(94,207,160,.95)' : 'rgba(255,179,198,.9)';
  octx.lineCap='round';
  CONN.forEach(([a,b])=>{
    if((lm[a].visibility??1)<0.35 || (lm[b].visibility??1)<0.35) return;
    octx.beginPath(); octx.moveTo(lm[a].x*W,lm[a].y*H); octx.lineTo(lm[b].x*W,lm[b].y*H); octx.stroke();
  });
  octx.fillStyle = good ? '#3fb98a' : '#ff7fa3';
  [11,12,13,14,15,16,23,24,25,26,27,28].forEach(i=>{
    if((lm[i].visibility??1)<0.35) return;
    octx.beginPath(); octx.arc(lm[i].x*W, lm[i].y*H, Math.max(6,W*0.009), 0, 7); octx.fill();
  });
}

let tickAt=0;
function loop(){
  raf = requestAnimationFrame(loop);
  if(!landmarker || video.readyState < 2) return;
  const W=video.videoWidth, H=video.videoHeight;
  if(!W) return;
  if(ovl.width!==W){ ovl.width=W; ovl.height=H; }

  const ts = performance.now();
  if(ts === lastTs) return; lastTs = ts;
  let res; try{ res = landmarker.detectForVideo(video, ts); }catch(e){ return; }
  const lm = res.landmarks && res.landmarks[0];

  if(!lm){ drawPose(null,W,H,false); setHint('몸 전체가 화면에 보이게 서 주세요'); resetHold(); return; }

  const f = features(lm,W,H);
  if(!f.ok){ drawPose(lm,W,H,false); setHint('조금 뒤로 물러서서 팔이 다 보이게 해 주세요'); resetHold(); return; }
  if(cur && cur.legs && !f.legsVisible){
    drawPose(lm,W,H,false); setHint('다리까지 보이게 뒤로 물러서 주세요'); resetHold(); return;
  }

  const list = cur.cond(f, S.tol);
  const met = list.filter(c=>c[1]).length;
  const all = met === list.length;
  drawPose(lm,W,H,all);

  if(passed){ setHint('잘했어요!'); return; }

  if(all){
    if(!holdStart) holdStart = ts;
    const p = Math.min(1,(ts-holdStart)/S.holdMs);
    gfill.style.width = (p*100).toFixed(0)+'%';
    setHint(`그대로 유지! ${Math.max(0,((S.holdMs-(ts-holdStart))/1000)).toFixed(1)}초`);
    if(ts-tickAt > 320){ tickAt=ts; sndTick(); }
    if(p>=1) succeed();
  }else{
    resetHold();
    const miss = list.find(c=>!c[1]);
    gfill.style.width = ((met/list.length)*45).toFixed(0)+'%';
    setHint(miss ? miss[0] : cur.guide);
  }
}
function resetHold(){ holdStart=0; if(!passed) gfill.style.width='0%'; }
let hintTxt='';
function setHint(t){ if(t!==hintTxt){ hintTxt=t; camhint.textContent=t; } }

/* ══════════════════════════════════════════════════════
   10. 폭죽
   ══════════════════════════════════════════════════════ */
const bcv=$('#burst'), bctx=bcv.getContext('2d');
let parts=[], braf=0;
function confetti(){
  bcv.width=innerWidth; bcv.height=innerHeight; bcv.classList.add('on');
  const cols=['#ffb3c6','#a8e6cf','#a8d8ff','#ffe6a7','#d9c7ff'];
  for(let i=0;i<90;i++) parts.push({
    x:innerWidth/2, y:innerHeight*0.42,
    vx:(Math.random()-0.5)*16, vy:Math.random()*-14-3,
    s:6+Math.random()*8, c:cols[i%cols.length], r:Math.random()*6, vr:(Math.random()-.5)*.4, life:1
  });
  if(!braf) braf=requestAnimationFrame(bloop);
}
function bloop(){
  bctx.clearRect(0,0,bcv.width,bcv.height);
  parts.forEach(p=>{ p.vy+=0.45; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.life-=0.011; });
  parts = parts.filter(p=>p.life>0 && p.y<bcv.height+40);
  parts.forEach(p=>{
    bctx.save(); bctx.globalAlpha=Math.max(0,p.life); bctx.translate(p.x,p.y); bctx.rotate(p.r);
    bctx.fillStyle=p.c; bctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.6); bctx.restore();
  });
  if(parts.length) braf=requestAnimationFrame(bloop);
  else { braf=0; bcv.classList.remove('on'); bctx.clearRect(0,0,bcv.width,bcv.height); }
}

  }finally{ b.disabled=false; b.textContent='시작하기'; }
};
$('#failBack').onclick = ()=>show('home');
addEventListener('pagehide', stopCam);
</script>
