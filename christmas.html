<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0c1a33">
<title>자연쌤의 크리스마스 사진관</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh"></script>
<link rel="stylesheet" href="playkit.css">
<style>
@font-face{font-family:'MemomentKkukkukk';src:url('./fonts/MemomentKkukkukk.ttf') format('truetype');font-display:swap}
:root{
  --ink:#f2f8ff; --dim:#a9c4e0;
  --orange:#d6232f; --orange2:#ff6b6b;      /* 산타 빨강 */
  --gold:#ffd86b;
  --line:rgba(255,216,107,.38);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0; background:#0c1a33; color:var(--ink);
  font-family:'MemomentKkukkukk','Noto Sans KR',sans-serif;
  overflow:hidden; user-select:none;
}
/* 눈 내리는 밤하늘 */
body::before{
  content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(circle at 80% 12%, rgba(255,240,190,.20) 0 12%, transparent 40%),
    radial-gradient(2.4px 2.4px at 14% 20%, #ffffffcc 0 50%, transparent 51%),
    radial-gradient(2px 2px   at 33% 8%,   #ffffffaa 0 50%, transparent 51%),
    radial-gradient(2.6px 2.6px at 57% 30%, #ffffffbb 0 50%, transparent 51%),
    radial-gradient(2px 2px   at 88% 46%,  #ffffff99 0 50%, transparent 51%),
    radial-gradient(2.4px 2.4px at 46% 62%, #ffffff88 0 50%, transparent 51%),
    radial-gradient(2px 2px   at 22% 78%,  #ffffff77 0 50%, transparent 51%),
    radial-gradient(2.6px 2.6px at 70% 84%, #ffffff88 0 50%, transparent 51%),
    linear-gradient(#17345c 0%, #0f2347 52%, #081529 100%);
}

.screen{position:fixed;inset:0;z-index:1;display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;padding:18px;overflow:auto}
.screen.on{display:flex}

h1{margin:0;font-size:clamp(28px,7vw,52px);color:var(--gold);
   text-shadow:0 3px 0 #7a4a00, 0 0 26px rgba(255,216,107,.5);letter-spacing:1px}
.sub{margin:0;color:var(--dim);font-size:clamp(15px,3.4vw,20px);text-align:center;word-break:keep-all}

/* 큰 단추 */
.big{
  border:0; border-radius:26px; cursor:pointer;
  font-family:inherit; font-size:clamp(22px,5vw,34px); font-weight:700;
  padding:20px 34px; color:#fff;
  background:linear-gradient(180deg,var(--orange2),var(--orange));
  box-shadow:0 8px 0 #8c1118, 0 14px 30px rgba(214,35,47,.35);
  transition:transform .09s ease, box-shadow .09s ease;
  display:flex; align-items:center; gap:12px; justify-content:center;
}
.big:active{transform:translateY(6px);box-shadow:0 2px 0 #8c1118}
.big.ghost{background:linear-gradient(180deg,#3fae72,#1f7a4a);color:#fff;
  box-shadow:0 8px 0 #0f4a2b, 0 14px 30px rgba(31,122,74,.4)}
.big.ghost:active{box-shadow:0 2px 0 #0f4a2b}
.big.small{font-size:clamp(17px,3.6vw,22px);padding:14px 22px;border-radius:20px}
.big[disabled]{opacity:.45;pointer-events:none}

.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

/* 모은 선물 */
.candy{display:flex;align-items:center;gap:8px;font-size:clamp(17px,3.6vw,22px);
  color:var(--gold);background:rgba(255,255,255,.08);border:2px solid var(--line);
  border-radius:999px;padding:8px 18px}

/* 카메라 */
.camwrap{position:relative;width:min(92vw,620px);aspect-ratio:4/3;border-radius:22px;
  overflow:hidden;background:#000;border:3px solid var(--line);
  box-shadow:0 12px 40px rgba(0,0,0,.6)}
.camwrap video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.camwrap canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.camstate{position:absolute;left:0;right:0;bottom:0;padding:8px 12px;font-size:15px;
  color:#e8f2ff;background:linear-gradient(transparent,rgba(0,0,0,.75));text-align:center}
.count{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  font-size:min(42vw,260px);font-weight:900;color:#fff;
  text-shadow:0 0 40px #ffd86b,0 0 90px #d6232f}
.count.on{display:flex}
.flash{position:fixed;inset:0;z-index:30;background:#fff;opacity:0;pointer-events:none}

/* 테마 고르기 */
.themes{display:grid;grid-template-columns:repeat(2,minmax(130px,1fr));gap:12px;width:min(92vw,620px)}
.th{border:3px solid var(--line);border-radius:20px;background:rgba(255,255,255,.06);
  color:var(--ink);font-family:inherit;font-size:clamp(16px,3.6vw,21px);padding:16px 10px;
  cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}
.th .em{font-size:clamp(34px,8vw,52px);line-height:1}
.th.on{border-color:var(--gold);background:rgba(255,216,107,.2);
  box-shadow:0 0 0 4px rgba(255,216,107,.18)}

/* 결과 */
.shotbox{position:relative;width:auto;max-width:96vw;border-radius:22px;overflow:hidden;
  border:3px solid var(--gold);box-shadow:0 14px 44px rgba(0,0,0,.6);background:#081529}
.shotbox canvas{display:block;width:auto;height:auto;max-width:96vw;
  max-height:calc(100vh - 230px);cursor:zoom-in}

/* 저장될 모습 그대로 화면 가득 보기 */
.viewer{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;
  background:rgba(4,8,16,.95);padding:8px}
.viewer.on{display:flex}
.viewer img{max-width:100%;max-height:100%;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.viewer .x{position:fixed;top:14px;right:14px;z-index:41}
.busy{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(8,21,41,.74);font-size:clamp(18px,4vw,24px);color:var(--gold)}
.busy.on{display:flex}

/* 설정 */
.gear{position:fixed;top:12px;right:12px;z-index:5;width:52px;height:52px;border-radius:50%;
  border:2px solid var(--line);background:rgba(255,255,255,.08);color:var(--ink);
  font-size:24px;cursor:pointer}
.sheet{position:fixed;inset:0;z-index:20;display:none;align-items:flex-end;justify-content:center;
  background:rgba(4,12,26,.72)}
.sheet.on{display:flex}
.panel{width:min(96vw,560px);max-height:88vh;overflow:auto;background:#123055;
  border:3px solid var(--line);border-radius:24px 24px 12px 12px;padding:18px}
.panel h2{margin:2px 0 14px;font-size:22px;color:var(--gold)}
.field{margin-bottom:14px}
.field > label{display:block;margin-bottom:7px;color:var(--dim);font-size:16px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:2px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);
  font-family:inherit;font-size:16px;padding:9px 15px;border-radius:14px;cursor:pointer}
.opt.on{background:var(--orange);border-color:var(--gold);color:#fff;font-weight:700}
select{font-family:inherit;font-size:15px;padding:9px;border-radius:12px;width:100%;
  background:#0d2342;color:var(--ink);border:2px solid var(--line)}
.note{color:#9fb8d4;font-size:14px;line-height:1.5;word-break:keep-all}
</style>
<script src="guard.js"></script>
</head>
<body>

<button class="gear" id="btnGear" title="설정">⚙️</button>

<!-- ═══════════ 홈 ═══════════ -->
<section id="home" class="screen on">
  <div style="font-size:clamp(60px,16vw,120px);line-height:1">🎄</div>
  <h1>크리스마스 사진관</h1>
  <p class="sub">사진을 찍으면 크리스마스 나라로 바뀌어요!</p>
  <button class="big" id="btnGo">📸 &nbsp;사진 찍기</button>
  <div class="candy">🎁 <span id="candyN">0</span>개 모았어요</div>
  <p class="sub" style="font-size:14px;color:#9b84ae" id="loadNote">그림을 불러오는 중…</p>
</section>

<!-- ═══════════ 촬영 ═══════════ -->
<section id="shoot" class="screen">
  <h1 style="font-size:clamp(22px,5vw,34px)" id="shootTitle">🎅 산타 할아버지</h1>
  <div class="camwrap" id="camwrap">
    <video id="cam" autoplay playsinline muted></video>
    <canvas id="ovl"></canvas>
    <div class="count" id="count">3</div>
    <div class="camstate" id="camstate">카메라를 준비하고 있어요…</div>
  </div>
  <button class="big" id="btnShot">📸 &nbsp;찰칵!</button>
  <div class="row">
    <button class="big ghost small" id="btnTheme">🎨 다른 테마</button>
    <button class="big ghost small" id="btnRetryCam">🔄 카메라 다시</button>
    <button class="big ghost small" id="btnBack1">🏠 그만</button>
  </div>
  <p class="sub" style="font-size:14px;color:#9b84ae">화면을 아무 데나 눌러도 찍혀요 · 스페이스/엔터</p>
</section>

<!-- ═══════════ 결과 ═══════════ -->
<section id="done" class="screen" style="gap:10px;padding:10px">
  <h1 style="font-size:clamp(17px,3.6vw,24px);margin:2px 0">✨ 완성! <span style="font-size:.7em;opacity:.75">사진을 누르면 크게 보여요</span></h1>
  <div class="shotbox">
    <canvas id="art"></canvas>
    <div class="busy" id="busy">🎃 꾸미는 중…</div>
  </div>
  <div class="row">
    <button class="big" id="btnSave">💾 &nbsp;저장하기</button>
    <button class="big ghost" id="btnNext">🎨 &nbsp;다른 모습으로</button>
  </div>
  <div class="row">
    <button class="big ghost small" id="btnBig">🔍 크게 보기</button>
    <button class="big ghost small" id="btnAgain">📸 다시 찍기</button>
    <button class="big ghost small" id="btnBack2">🏠 그만</button>
  </div>
</section>

<!-- ═══════════ 설정 ═══════════ -->
<div class="sheet" id="sheet">
  <div class="panel">
    <h2>설정</h2>

    <div class="field"><label>테마 고르기</label>
      <div class="opts" id="optPick">
        <button class="opt" data-v="auto">차례대로</button>
        <button class="opt" data-v="choose">내가 고르기</button>
      </div>
    </div>

    <div class="field"><label>셋 셀까요?</label>
      <div class="opts" id="optCount">
        <button class="opt" data-v="0">바로 찍기</button>
        <button class="opt" data-v="3">3초</button>
        <button class="opt" data-v="5">5초</button>
      </div>
    </div>

    <div class="field"><label>배경 바꾸기</label>
      <div class="opts" id="optCut">
        <button class="opt" data-v="true">크리스마스 배경으로</button>
        <button class="opt" data-v="false">찍은 그대로</button>
      </div>
      <p class="note">배경이 이상하게 잘리면 ‘찍은 그대로’ 를 골라 보세요.<br>망토는 몸 뒤에 들어가서 ‘크리스마스 배경으로’ 일 때만 보입니다.</p>
    </div>

    <div class="field"><label>소리</label>
      <div class="opts" id="optSound">
        <button class="opt" data-v="true">켜기</button>
        <button class="opt" data-v="false">끄기</button>
      </div>
    </div>

    <div class="field"><label>말로 알려주기</label>
      <div class="opts" id="optVoice">
        <button class="opt" data-v="true">켜기</button>
        <button class="opt" data-v="false">끄기</button>
      </div>
    </div>

    <div class="field"><label>카메라 고르기</label>
      <select id="camSel"><option value="">자동으로 고르기</option></select>
      <p class="note" id="camInfo"></p>
    </div>

    <div class="row">
      <button class="big small" id="btnClose">닫기</button>
      <button class="big ghost small" id="btnResetCandy">🎁 선물 지우기</button>
    </div>
  </div>
</div>

<div class="viewer" id="viewer">
  <img id="viewImg" alt="완성한 사진">
  <button class="big small x" id="btnViewClose">✕ 닫기</button>
</div>

<div class="flash" id="flash"></div>

<script src="playkit.js"></script>
<script>
/* ══════════════════════════════════════════════════════
   자연쌤의 크리스마스 사진관
   사진을 찍으면 ① 배경을 크리스마스 풍경으로 바꾸고
                ② 얼굴을 찾아 산타 모자·사슴 뿔·빨간 코를 얹고
                ③ 망토를 입히고 눈을 내려 한 장을 완성합니다.
   그림은 모두 openclipart.org 의 CC0(퍼블릭 도메인) 자료입니다.
   ══════════════════════════════════════════════════════ */
const $ = s => document.querySelector(s);
const A = 'christmas/';

/* ---------- 1. 테마 ----------
   back  : 사람 뒤에 깔리는 그림
   head  : 얼굴을 찾으면 머리 위에 얹을 그림
   front : 사람 앞에 올리는 꾸밈
   face  : 코·입에 붙일 그림 (빨간 코, 당근 코)
   wear  : 몸 뒤에 입히는 망토 / coat : 몸 앞에 입는 옷 / belt : 허리띠
   fit   : 'cover' 화면 가득(zoom 으로 더 당겨 자르기)
   그 밖에는 x, y(가운데 위치 비율) 또는 b(아래끝 위치) + w(가로 비율) + rot(기울기)
   ground: 바닥에 눈을 깔기 / snow: 눈 내리기 */
const THEMES = [
  { id:'santa', name:'산타 할아버지', em:'🎅', say:'산타 할아버지로 변신!',
    sky:['#1b3a6b','#0a1730'],
    back:[ {src:'bg-cabin.svg', fit:'cover', zoom:1.05} ],
    head:{ src:'hat-santa.svg', w:2.7, gap:-0.04, ax:0.38, ay:0.55 },
    wear:{ src:'cape.svg', w:7.2, y:2.5 },
    coat:{ src:'coat.svg', w:5.0, y:0.30, ax:0.50, ay:0.06 },
    belt:{ src:'belt.svg', w:3.4, y:2.40 },
    front:[ {src:'gift.svg',  x:.11,y:.87,w:.19,rot:-5},
            {src:'gift2.svg', x:.90,y:.90,w:.17,rot:6},
            {src:'deer.svg',  x:.79,y:.21,w:.22,rot:-8} ],
    snow:true },

  { id:'rudolph', name:'루돌프', em:'🦌', say:'루돌프가 되었어요!',
    sky:['#bfe3f5','#f2f9fd'], ground:true,
    back:[ {src:'sil-mount.svg', x:.50,y:.57,w:.96},
           {src:'sil-pine.svg',  x:.10,b:.84,w:.15},
           {src:'sil-pine.svg',  x:.24,b:.88,w:.10},
           {src:'sil-pine.svg',  x:.79,b:.86,w:.13},
           {src:'sil-pine.svg',  x:.93,b:.82,w:.09} ],
    head:{ src:'antlers.svg', w:3.5, gap:-0.14, tint:'#8a5a2e' },
    face:{ src:'nose-red.svg', w:0.46, y:0.00, at:'nose', ay:0.36 },
    coat:{ src:'vest.svg', w:4.2, y:0.30, ax:0.50, ay:0.03, color:'#9a5324', lift:'#4a4a4a' },
    front:[ {src:'pine.svg',     x:.07,b:1.03,w:.18},
            {src:'rudolph.svg',  x:.89,y:.79,w:.17},
            {src:'snowflake.svg',x:.16,y:.17,w:.10} ],
    snow:true },

  { id:'snow', name:'눈사람 친구', em:'⛄', say:'눈사람 친구가 왔어요!',
    sky:['#9ec9ea','#eaf5fc'], ground:true,
    back:[ {src:'sil-pine.svg', x:.07,b:.86,w:.13},
           {src:'sil-pine.svg', x:.19,b:.82,w:.09},
           {src:'sil-pine.svg', x:.93,b:.85,w:.12} ],
    face:{ src:'nose-carrot.svg', w:0.52, y:0.00, at:'nose', rot:-101, ax:0.88, ay:0.12 },
    wear:{ src:'cape.svg', w:7.0, y:2.5, color:'#3f8fd0', lift:'#6e6e6e' },
    coat:{ src:'coat.svg', w:5.0, y:0.30, ax:0.50, ay:0.06, color:'#4aa3e0', lift:'#3a3a3a' },
    front:[ {src:'snowman.svg',  x:.85,y:.73,w:.26},
            {src:'gift.svg',     x:.12,y:.89,w:.17,rot:-6},
            {src:'snowflake.svg',x:.14,y:.19,w:.11} ],
    snow:true },

  { id:'elf', name:'꼬마 요정', em:'🧝', say:'크리스마스 요정이 되었어요!',
    sky:['#2c8057','#0a2a1c'], ground:true,
    back:[ {src:'tree.svg', x:.86,b:.98,w:.30},
           {src:'tree.svg', x:.11,b:.94,w:.21} ],
    head:{ src:'hat-elf.svg', w:2.5, gap:-0.04, ax:0.55, ay:0.86 },
    wear:{ src:'cape.svg', w:7.0, y:2.5, color:'#2fa05a', lift:'#4e4e4e' },
    coat:{ src:'vest.svg', w:4.2, y:0.30, ax:0.50, ay:0.03, color:'#2aa35b', lift:'#3a3a3a' },
    belt:{ src:'belt.svg', w:3.0, y:2.20 },
    front:[ {src:'gift.svg',  x:.10,y:.88,w:.20,rot:-6},
            {src:'gift2.svg', x:.29,y:.94,w:.15,rot:5},
            {src:'elf.svg',   x:.91,y:.78,w:.13},
            {src:'candy.svg', x:.95,y:.34,w:.10,rot:12} ],
    snow:true },

  { id:'tree', name:'크리스마스 트리', em:'🎄', say:'반짝반짝 트리가 되었어요!',
    sky:['#4b358f','#15113a'], ground:true,
    back:[ {src:'tree.svg', x:.17,b:.98,w:.33},
           {src:'tree.svg', x:.86,b:.95,w:.27} ],
    head:{ src:'star.svg', w:1.7, gap:0.18, ay:0.90 },
    wear:{ src:'cape.svg', w:7.0, y:2.5, color:'#1f9150', lift:'#3e3e3e' },
    coat:{ src:'coat.svg', w:5.0, y:0.30, ax:0.50, ay:0.06, color:'#1f9150', lift:'#3a3a3a' },
    front:[ {src:'ball.svg',     x:.13,y:.40,w:.10},
            {src:'ball.svg',     x:.89,y:.51,w:.08},
            {src:'gift.svg',     x:.12,y:.89,w:.18},
            {src:'gift2.svg',    x:.88,y:.91,w:.15},
            {src:'snowflake.svg',x:.77,y:.17,w:.11} ],
    snow:true }
];

/* ---------- 2. 그림 불러오기 ---------- */
const imgCache = new Map();   // 이름 → 약속
const ready    = new Map();   // 이름 → 다 받아 둔 그림
function loadImg(name){
  if(imgCache.has(name)) return imgCache.get(name);
  const p = new Promise((res, rej) => {
    const im = new Image();
    im.onload  = () => { ready.set(name, im); res(im); };
    im.onerror = () => rej(new Error(name));
    im.src = A + name;
  });
  imgCache.set(name, p);
  return p;
}
/* 이미 받아 둔 그림만 꺼내 씁니다(기다리지 않음) */
const peek = name => ready.get(name) || null;
/* 작은 그림은 미리, 큰 배경은 쓸 때 받습니다 */
const EAGER = ['hat-santa.svg','hat-elf.svg','antlers.svg','star.svg',
               'nose-red.svg','nose-carrot.svg','cape.svg','bg-cabin.svg',
               'sil-pine.svg','sil-mount.svg','pine.svg','tree.svg','snowman.svg',
               'gift.svg','gift2.svg','snowflake.svg','rudolph.svg','deer.svg',
               'elf.svg','ball.svg','candy.svg','coat.svg','vest.svg','belt.svg'];
let eagerDone = 0;
Promise.allSettled(EAGER.map(n => loadImg(n).finally(() => {
  eagerDone++;
  $('#loadNote').textContent = eagerDone >= EAGER.length ? '준비 끝! 🎃'
    : `그림을 불러오는 중… ${eagerDone}/${EAGER.length}`;
}))).then(() => { setTimeout(() => $('#loadNote').textContent = '', 1200); });

function themeImgs(t){
  const names = [...t.back.map(l=>l.src), ...t.front.map(l=>l.src)];
  if(t.head) names.push(t.head.src);
  if(t.face) names.push(t.face.src);
  if(t.wear) names.push(t.wear.src);
  if(t.coat) names.push(t.coat.src);
  if(t.belt) names.push(t.belt.src);
  if(t.neck) names.push(t.neck.src);
  names.push('snowflake.svg');   // 모서리 눈송이
  return Promise.allSettled([...new Set(names)].map(loadImg));
}

/* ══════════════════════════════════════════════════════
   5. 카메라
   까맣게 나오는 일이 없도록 play() 오류를 삼키지 않고,
   멈춰 있으면 알려 주고 다시 시도할 수 있게 합니다.
   ══════════════════════════════════════════════════════ */
const video = $('#cam'), ovl = $('#ovl'), octx = ovl.getContext('2d');
const camstate = $('#camstate');
let stream = null, camTimer = 0;

function setState(t){ camstate.textContent = t; }

async function listCams(){
  try{
    const ds = await navigator.mediaDevices.enumerateDevices();
    const cams = ds.filter(d => d.kind === 'videoinput');
    const sel = $('#camSel');
    sel.innerHTML = '<option value="">자동으로 고르기</option>' +
      cams.map((c,i) => `<option value="${c.deviceId}">${(c.label||('카메라 '+(i+1)))}</option>`).join('');
    sel.value = CFG.camId || '';
    $('#camInfo').textContent = cams.length ? `찾은 카메라 ${cams.length}대` : '카메라를 못 찾았어요';
  }catch(e){}
}

async function startCam(){
  stopCam();
  setState('카메라를 켜는 중…');
  $('#btnShot').disabled = true;
  const want = CFG.camId
    ? { deviceId:{ exact:CFG.camId }, width:{ideal:960}, height:{ideal:720} }
    : { facingMode:'user', width:{ideal:960}, height:{ideal:720} };
  try{
    stream = await navigator.mediaDevices.getUserMedia({ video:want, audio:false });
  }catch(err){
    if(CFG.camId){                       // 고른 카메라가 안 되면 자동으로 한 번 더
      try{ stream = await navigator.mediaDevices.getUserMedia({ video:{facingMode:'user'}, audio:false }); }
      catch(e2){ return camFail(e2); }
    }else return camFail(err);
  }
  video.srcObject = stream;
  try{ await video.play(); }
  catch(err){ return camFail(err); }
  listCams();
  initMP();
  watchStall();
  setState('얼굴을 찾는 중…');
  $('#btnShot').disabled = false;
}
function camFail(err){
  const why = ({
    NotAllowedError:'카메라를 쓰도록 허락해 주세요',
    NotFoundError:'카메라를 찾지 못했어요',
    NotReadableError:'다른 앱이 카메라를 쓰고 있어요. 그 앱을 닫고 다시 눌러 주세요',
    OverconstrainedError:'이 카메라는 쓸 수 없어요. 설정에서 다른 카메라를 골라 보세요'
  })[err && err.name] || '카메라를 열 수 없어요';
  setState('⚠️ ' + why);
  $('#btnShot').disabled = true;
  listCams();
}
/* 화면이 까맣게 멈춰 있는지 지켜봅니다 */
function watchStall(){
  clearInterval(camTimer);
  let last = -1, still = 0;
  camTimer = setInterval(() => {
    if(!stream) return;
    const t = video.currentTime;
    if(t === last){ if(++still === 4) setState('⚠️ 화면이 멈춰 있어요. ‘카메라 다시’ 를 눌러 주세요'); }
    else { still = 0; }
    last = t;
  }, 700);
}
function stopCam(){
  clearInterval(camTimer);
  if(stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
  video.srcObject = null;
  octx.clearRect(0, 0, ovl.width, ovl.height);
}

/* ---------- 6. 얼굴 찾기 · 배경 오리기 ---------- */
let faceMesh = null, seg = null, faces = null, segReady = false, raf = 0, tick = 0;
const segCanvas = document.createElement('canvas');

function initMP(){
  const cdn = n => f => `https://cdn.jsdelivr.net/npm/@mediapipe/${n}/${f}`;
  if(typeof FaceMesh === 'function' && !faceMesh){
    try{
      faceMesh = new FaceMesh({ locateFile: cdn('face_mesh') });
      faceMesh.setOptions({ maxNumFaces:3, refineLandmarks:false,
                            minDetectionConfidence:.5, minTrackingConfidence:.5 });
      faceMesh.onResults(r => { faces = (r.multiFaceLandmarks && r.multiFaceLandmarks.length)
                                        ? r.multiFaceLandmarks : null; });
    }catch(e){ faceMesh = null; }
  }
  if(typeof SelfieSegmentation === 'function' && !seg){
    try{
      seg = new SelfieSegmentation({ locateFile: cdn('selfie_segmentation') });
      seg.setOptions({ modelSelection:1 });
      seg.onResults(r => {
        const m = r.segmentationMask; if(!m) return;
        segCanvas.width = m.width; segCanvas.height = m.height;
        const c = segCanvas.getContext('2d');
        c.clearRect(0, 0, m.width, m.height); c.drawImage(m, 0, 0);
        segReady = true;
      });
    }catch(e){ seg = null; }
  }
  startLoop();
}
let fmBusy = false, segBusy = false;
function startLoop(){
  if(raf) return;
  const step = () => {
    raf = requestAnimationFrame(step);
    if(!stream || video.readyState < 2) return;
    tick++;
    if(faceMesh && !fmBusy){
      fmBusy = true;
      try{ faceMesh.send({ image:video }).catch(()=>{}).finally(()=>{ fmBusy = false; }); }
      catch(e){ fmBusy = false; }
    }
    if(seg && !segBusy && CFG.cutout && tick % 4 === 0){
      segBusy = true;
      try{ seg.send({ image:video }).catch(()=>{}).finally(()=>{ segBusy = false; }); }
      catch(e){ segBusy = false; }
    }
    drawPreview();
  };
  step();
}

/* 미리보기 : 머리 장식만 얹어서 보여 줍니다(가볍게) */
let hintAt = 0;
function drawPreview(){
  const vw = video.videoWidth, vh = video.videoHeight;
  if(!vw) return;
  if(ovl.width !== vw){ ovl.width = vw; ovl.height = vh; }
  octx.clearRect(0, 0, vw, vh);
  const t = THEMES[themeIdx];
  if(faces){
    const hraw = t.head && peek(t.head.src);
    const hi = (hraw && t.head.tint) ? recolor(hraw, null, t.head.tint) : hraw;
    if(hi) faces.forEach(lm => placeHead(octx, hi, t.head, lm, vw, vh));
    const fi = t.face && peek(t.face.src);
    if(fi) faces.forEach(lm => placeFace(octx, fi, t.face, lm, vw, vh));
  }
  const now = performance.now();
  if(now - hintAt > 900){
    hintAt = now;
    setState(faces ? `좋아요! ${t.em} ${t.name} · 찰칵을 눌러요` : '얼굴이 보이게 서 주세요');
  }
}

/* ══════════════════════════════════════════════════════
   7. 머리 장식 얹기
   두 눈으로 얼굴의 크기와 기울기를, 10번 점으로 이마 끝을 잡습니다.
   (미리보기·완성 사진 모두 거울처럼 좌우를 뒤집어 그립니다)
   ══════════════════════════════════════════════════════ */
function headInfo(lm, W, H){
  if(!lm || !lm[33] || !lm[263] || !lm[10]) return null;
  const P = i => ({ x:(1 - lm[i].x) * W, y:lm[i].y * H });
  const a = P(33), b = P(263);
  const Lp = a.x <= b.x ? a : b, Rp = a.x <= b.x ? b : a;
  const d = Math.hypot(Rp.x - Lp.x, Rp.y - Lp.y) || 1;
  const ang = Math.atan2(Rp.y - Lp.y, Rp.x - Lp.x);
  const up = { x:Math.sin(ang), y:-Math.cos(ang) };
  /* 10번 점은 이마 끝이라 정수리보다 한참 아래입니다.
     여기서 더 올려 잡지 않으면 모자가 이마·눈을 덮습니다. */
  const brow = P(10);
  const top = { x:brow.x + up.x * 0.62 * d, y:brow.y + up.y * 0.62 * d };
  return { top, brow, d, ang, up };
}
function placeHead(ctx, im, spec, lm, W, H){
  const f = headInfo(lm, W, H);
  if(!f) return;
  let w = spec.w * f.d;
  let h = w * (im.naturalHeight || im.height) / (im.naturalWidth || im.width);
  /* 화면 위로 잘릴 것 같으면 얼굴 쪽으로 내리지 않고 그림을 조금 줄입니다.
     (내리면 얼굴을 가리고, 그냥 두면 모자 끝이 잘립니다) */
  const room = Math.max(1, f.top.y - spec.gap * f.d);
  const need = h * (spec.ay !== undefined ? spec.ay : 1.0);
  if(need > room){
    const k = Math.max(0.55, room / need);
    w *= k; h *= k;
  }
  /* ax, ay = 그림 안에서 머리에 닿는 지점(가로·세로 비율). 기본은 아래 가운데 */
  const ax = spec.ax !== undefined ? spec.ax : 0.5;
  const ay = spec.ay !== undefined ? spec.ay : 1.0;
  const right = { x:Math.cos(f.ang), y:Math.sin(f.ang) };
  const off = spec.gap * f.d + (ay - 0.5) * h;
  const cx = f.top.x + f.up.x * off - right.x * (ax - 0.5) * w;
  const cy = f.top.y + f.up.y * off - right.y * (ax - 0.5) * w;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(f.ang);
  ctx.drawImage(im, -w / 2, -h / 2, w, h);
  ctx.restore();
}

/* ---------- 7-1-2. 얼굴에 붙이는 것 (빨간 코·당근 코) ----------
   입꼬리 두 점으로 얼굴의 기울기를 재고,
   at:'nose' 면 코끝(1번 점)에 얼굴 크기에 맞춰 놓습니다. */
function placeFace(ctx, im, spec, lm, W, H){
  if(!lm || !lm[61] || !lm[291]) return;
  const P = i => ({ x:(1 - lm[i].x) * W, y:lm[i].y * H });
  const a = P(61), b = P(291);
  const Lp = a.x <= b.x ? a : b, Rp = a.x <= b.x ? b : a;
  const m = Math.hypot(Rp.x - Lp.x, Rp.y - Lp.y) || 1;
  const ang = Math.atan2(Rp.y - Lp.y, Rp.x - Lp.x);
  const up = { x:Math.sin(ang), y:-Math.cos(ang) };
  let base = { x:(Lp.x + Rp.x) / 2, y:(Lp.y + Rp.y) / 2 }, unit = m;
  if(spec.at === 'nose'){                      // 코끝(1번 점)에, 얼굴 크기에 맞춰
    const f = headInfo(lm, W, H);
    if(!f || !lm[1]) return;
    base = P(1); unit = f.d;
  }
  const w = spec.w * unit;
  const h = w * (im.naturalHeight || im.height) / (im.naturalWidth || im.width);
  const rot = (spec.rot || 0) * Math.PI / 180;
  const ax = spec.ax !== undefined ? spec.ax : 0.5;
  const ay = spec.ay !== undefined ? spec.ay : 0.5;
  /* 그림 안의 (ax,ay) 지점이 코(또는 입) 에 오도록 돌려서 뺍니다 */
  const dx = (ax - 0.5) * w, dy = (ay - 0.5) * h;
  const ca = Math.cos(ang + rot), sa = Math.sin(ang + rot);
  const cx = base.x + up.x * spec.y * unit - (dx * ca - dy * sa);
  const cy = base.y + up.y * spec.y * unit - (dx * sa + dy * ca);
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(ang + rot);
  ctx.drawImage(im, -w / 2, -h / 2, w, h);
  ctx.restore();
}

/* ---------- 7-2. 옷 색 바꾸기 ----------
   주름(밝고 어두움)은 그대로 두고 색만 입혀서, 망토 하나로 여러 색을 씁니다. */
const painted = new Map();
function recolor(im, color, lift){
  const key = im.src + '|' + color + '|' + (lift || '-');
  if(painted.has(key)) return painted.get(key);
  const W = im.naturalWidth, H = im.naturalHeight;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const x = c.getContext('2d');
  x.drawImage(im, 0, 0);
  if(lift){                                    // 옷감을 조금 밝게 (진한 색 그림이라 그냥 칠하면 어두워집니다)
    x.globalCompositeOperation = 'screen';
    x.fillStyle = lift; x.fillRect(0, 0, W, H);
  }
  if(color){                                 // 색만 덮어쓰기
    x.globalCompositeOperation = 'color';
    x.fillStyle = color; x.fillRect(0, 0, W, H);
  }
  x.globalCompositeOperation = 'destination-in';   // 원래 비어 있던 곳은 그대로
  x.drawImage(im, 0, 0);
  painted.set(key, c);
  return c;
}

/* ---------- 7-3. 몸에 옷 입히기 ----------
   턱 아래로 내려가며 어깨를 덮도록, 얼굴 크기에 맞춰 놓습니다. */
function placeWear(ctx, im, spec, lm, W, H){
  const f = headInfo(lm, W, H);
  if(!f || !lm[152]) return;
  const chin = { x:(1 - lm[152].x) * W, y:lm[152].y * H };
  const w = spec.w * f.d;
  const h = w * (im.naturalHeight || im.height) / (im.naturalWidth || im.width);
  /* ax, ay = 그림 안에서 턱 아래 기준점에 맞출 자리 (기본은 한가운데) */
  const ax = spec.ax !== undefined ? spec.ax : 0.5;
  const ay = spec.ay !== undefined ? spec.ay : 0.5;
  const dx = (ax - 0.5) * w, dy = (ay - 0.5) * h;
  const ca = Math.cos(f.ang), sa = Math.sin(f.ang);
  const cx = chin.x - f.up.x * spec.y * f.d - (dx * ca - dy * sa);
  const cy = chin.y - f.up.y * spec.y * f.d - (dx * sa + dy * ca);
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(f.ang);
  ctx.drawImage(im, -w / 2, -h / 2, w, h);
  ctx.restore();
}

/* ---------- 7-5. 눈 ----------
   바닥에 쌓인 눈과, 하늘에서 내리는 눈송이를 그립니다. */
function drawGround(c, W, H){
  const g = c.createLinearGradient(0, H * 0.62, 0, H);
  g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#dce9f4');
  c.fillStyle = g;
  c.beginPath();
  c.moveTo(0, H);
  c.lineTo(0, H * 0.80);
  c.bezierCurveTo(W * 0.22, H * 0.73, W * 0.42, H * 0.84, W * 0.60, H * 0.78);
  c.bezierCurveTo(W * 0.78, H * 0.72, W * 0.90, H * 0.80, W, H * 0.76);
  c.lineTo(W, H);
  c.closePath(); c.fill();
}
function drawSnow(c, W, H, n, maxR, alpha, keepOff){
  c.save();
  for(let i = 0; i < n; i++){
    const x = Math.random() * W, y = Math.random() * H;
    const r = (0.35 + Math.random() * 0.65) * maxR;
    /* 얼굴 위에는 눈을 뿌리지 않습니다 */
    if(keepOff && keepOff.some(f => Math.hypot(x - f.x, y - f.y) < f.r + r)) continue;
    c.globalAlpha = alpha * (0.45 + Math.random() * 0.55);
    c.fillStyle = '#ffffff';
    c.beginPath(); c.arc(x, y, r, 0, 7); c.fill();
  }
  c.restore();
}

/* 얼굴이 있는 자리(동그라미)를 알려 줍니다 */
function faceZones(W, H){
  if(!shot.faces) return null;
  const out = [];
  shot.faces.forEach(lm => {
    const f = headInfo(lm, W, H);
    if(!f) return;
    const eye = { x:(f.top.x - f.up.x * 0.62 * f.d), y:(f.top.y - f.up.y * 0.62 * f.d) };
    out.push({ x:eye.x + f.up.x * -0.45 * f.d, y:eye.y + f.up.y * -0.45 * f.d, r:1.55 * f.d });
  });
  return out.length ? out : null;
}

/* ---------- 8. 꾸밈 그림 한 장 그리기 ---------- */
function drawLayer(ctx, im, L, W, H){
  const r = (im.naturalWidth || im.width) / (im.naturalHeight || im.height);
  if(L.fit === 'cover'){
    const s = Math.max(W / im.naturalWidth, H / im.naturalHeight) * (L.zoom || 1);
    const w = im.naturalWidth * s, h = im.naturalHeight * s;
    ctx.drawImage(im, (W - w) / 2, (H - h) / 2, w, h);
    return;
  }
  const w = W * L.w, h = w / r;
  const cx = W * L.x;
  const cy = (L.b !== undefined) ? H * L.b - h / 2 : H * L.y;
  ctx.save();
  ctx.translate(cx, cy);
  if(L.rot) ctx.rotate(L.rot * Math.PI / 180);
  ctx.drawImage(im, -w / 2, -h / 2, w, h);
  ctx.restore();
}

/* ══════════════════════════════════════════════════════
   9. 찰칵 : 그 순간을 얼려 둡니다
   ══════════════════════════════════════════════════════ */
const shot = { w:0, h:0, frame:document.createElement('canvas'),
               mask:document.createElement('canvas'), faces:null, hasMask:false };
function freeze(){
  const vw = video.videoWidth, vh = video.videoHeight;
  shot.w = vw; shot.h = vh;
  shot.frame.width = vw; shot.frame.height = vh;
  const fc = shot.frame.getContext('2d');
  fc.save(); fc.translate(vw, 0); fc.scale(-1, 1);     // 거울처럼
  fc.drawImage(video, 0, 0, vw, vh);
  fc.restore();

  shot.hasMask = segReady && CFG.cutout;
  if(shot.hasMask){
    shot.mask.width = vw; shot.mask.height = vh;
    const mc = shot.mask.getContext('2d');
    mc.clearRect(0, 0, vw, vh);
    mc.save(); mc.translate(vw, 0); mc.scale(-1, 1);
    try{ mc.filter = 'blur(3px)'; }catch(e){}           // 오려낸 가장자리를 부드럽게
    mc.drawImage(segCanvas, 0, 0, vw, vh);
    mc.filter = 'none'; mc.restore();
  }
  shot.faces = faces ? faces.map(f => f.map(p => ({ x:p.x, y:p.y }))) : null;
}

/* ---------- 10. 한 장 완성하기 ---------- */
const art = $('#art');
async function compose(){
  const t = THEMES[themeIdx];
  $('#busy').classList.add('on');
  art.getContext('2d').clearRect(0, 0, art.width, art.height);
  await themeImgs(t);
  try{ await document.fonts.ready; }catch(e){}

  const W = shot.w || 960, H = shot.h || 720;
  art.width = W; art.height = H;
  const c = art.getContext('2d');
  c.clearRect(0, 0, W, H);

  if(shot.hasMask){
    /* 밤하늘 → 뒤 풍경 → 오려낸 사람 */
    const g = c.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, t.sky[0]); g.addColorStop(1, t.sky[1]);
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    if(t.ground) drawGround(c, W, H);
    t.back.forEach(L => { const im = peek(L.src); if(im) drawLayer(c, im, L, W, H); });
    if(t.snow) drawSnow(c, W, H, Math.round(W * 0.06), W * 0.008, .5);     // 멀리 내리는 눈(사람 뒤)

    /* 망토·날개는 몸 뒤에 */
    const wi = t.wear && peek(t.wear.src);
    if(wi && shot.faces){
      const dressed = t.wear.color ? recolor(wi, t.wear.color, t.wear.lift) : wi;
      shot.faces.forEach(lm => placeWear(c, dressed, t.wear, lm, W, H));
    }

    const cut = document.createElement('canvas');
    cut.width = W; cut.height = H;
    const cc = cut.getContext('2d');
    cc.drawImage(shot.mask, 0, 0, W, H);
    cc.globalCompositeOperation = 'source-in';
    cc.drawImage(shot.frame, 0, 0, W, H);
    c.drawImage(cut, 0, 0);
  }else{
    c.drawImage(shot.frame, 0, 0, W, H);
    c.fillStyle = 'rgba(30,80,140,.16)'; c.fillRect(0, 0, W, H);  // 겨울 느낌의 푸른빛
  }

  /* 몸 앞에 입는 옷 : 코트·조끼 그리고 허리띠 */
  const ci = t.coat && peek(t.coat.src);
  if(ci && shot.faces){
    const worn = t.coat.color ? recolor(ci, t.coat.color, t.coat.lift) : ci;
    shot.faces.forEach(lm => placeWear(c, worn, t.coat, lm, W, H));
  }
  const bi = t.belt && peek(t.belt.src);
  if(bi && shot.faces) shot.faces.forEach(lm => placeWear(c, bi, t.belt, lm, W, H));

  /* 목에 거는 것(있으면) 은 몸 앞에 */
  const ni = t.neck && peek(t.neck.src);
  if(ni && shot.faces) shot.faces.forEach(lm => placeWear(c, ni, t.neck, lm, W, H));

  /* 코에 붙이는 것 */
  const fi = t.face && peek(t.face.src);
  if(fi && shot.faces) shot.faces.forEach(lm => placeFace(c, fi, t.face, lm, W, H));

  /* 머리 장식 (없는 테마도 있습니다) */
  const hraw = t.head && peek(t.head.src);
  const hi = (hraw && t.head.tint) ? recolor(hraw, null, t.head.tint) : hraw;
  if(hi && shot.faces) shot.faces.forEach(lm => placeHead(c, hi, t.head, lm, W, H));

  /* 앞쪽 꾸밈 */
  t.front.forEach(L => { const im = peek(L.src); if(im) drawLayer(c, im, L, W, H); });

  /* 가까이 내리는 눈은 얼굴을 피해서 성글게 */
  if(t.snow) drawSnow(c, W, H, Math.round(W * 0.018), W * 0.011, .7, faceZones(W, H));

  drawFrame(c, W, H, t);
  $('#busy').classList.remove('on');
}

/* ---------- 11. 사진 테두리 ---------- */
function drawFrame(c, W, H, t){
  /* 아래쪽을 살짝 어둡게 해서 글자가 잘 보이게 합니다 */
  const sg = c.createLinearGradient(0, H * 0.78, 0, H);
  sg.addColorStop(0, 'rgba(6,18,36,0)');
  sg.addColorStop(1, 'rgba(6,18,36,.62)');
  c.fillStyle = sg; c.fillRect(0, H * 0.78, W, H * 0.22);

  /* 위쪽 두 모서리에 눈송이 */
  const fl = peek('snowflake.svg');
  if(fl){
    const sz = W * 0.17;
    c.save(); c.globalAlpha = .75;
    c.drawImage(fl, -sz * 0.34, -sz * 0.34, sz, sz);
    c.save(); c.translate(W, 0); c.scale(-1, 1);
    c.drawImage(fl, -sz * 0.34, -sz * 0.34, sz, sz);
    c.restore(); c.restore();
  }

  /* 빨강·초록 줄무늬 테두리 (지팡이 사탕처럼) */
  const pad = Math.round(W * 0.012), lw = Math.max(6, W * 0.013);
  const half = lw / 2;
  const rect = [pad + half, pad + half, W - 2 * pad - lw, H - 2 * pad - lw];
  c.lineWidth = lw; c.lineCap = 'butt';
  c.strokeStyle = '#ffffff';
  c.strokeRect(rect[0], rect[1], rect[2], rect[3]);
  c.save();
  c.setLineDash([lw * 2.2, lw * 2.2]);
  c.strokeStyle = '#d6232f'; c.strokeRect(rect[0], rect[1], rect[2], rect[3]);
  c.lineDashOffset = lw * 2.2;
  c.strokeStyle = '#1f9150'; c.strokeRect(rect[0], rect[1], rect[2], rect[3]);
  c.restore();

  const txt = 'MERRY CHRISTMAS';
  const fs2 = Math.round(W * 0.052);
  c.font = `700 ${fs2}px 'MemomentKkukkukk','Noto Sans KR',sans-serif`;
  c.textAlign = 'center'; c.textBaseline = 'alphabetic';
  const y = H - Math.round(H * 0.055);
  c.lineWidth = Math.max(4, fs2 * 0.22); c.strokeStyle = 'rgba(8,20,40,.85)';
  c.lineJoin = 'round'; c.strokeText(txt, W / 2, y);
  c.fillStyle = '#ffd86b'; c.fillText(txt, W / 2, y);
}


/* ══════════════════════════════════════════════════════
   12. 버튼과 흐름
   ══════════════════════════════════════════════════════ */
let themeIdx = 0, counting = false;

function setTheme(i, speak){
  themeIdx = (i + THEMES.length) % THEMES.length;
  const t = THEMES[themeIdx];
  $('#shootTitle').textContent = `${t.em} ${t.name}`;
  themeImgs(t);
  paintThemes();
  if(speak) PK.say(t.name);
}
function paintThemes(){
  const box = $('#themeBox');
  if(box) [...box.children].forEach((b, i) => b.classList.toggle('on', i === themeIdx));
}

/* 테마 고르기 판 (설정 안이 아니라 촬영 화면에서 바로) */
(function buildThemePicker(){
  const wrap = document.createElement('div');
  wrap.className = 'themes'; wrap.id = 'themeBox';
  wrap.innerHTML = THEMES.map(t =>
    `<button class="th"><span class="em">${t.em}</span>${t.name}</button>`).join('');
  wrap.style.display = 'none';
  $('#shoot').insertBefore(wrap, $('#btnShot'));
  wrap.addEventListener('click', e => {
    const b = e.target.closest('.th'); if(!b) return;
    setTheme([...wrap.children].indexOf(b), true);
    PK.beep('pick');
  });
})();
function toggleThemeBox(){
  const w = $('#themeBox');
  w.style.display = w.style.display === 'none' ? 'grid' : 'none';
  PK.beep('tap');
}

/* ---------- 찍기 ---------- */
function shoot(){
  if(counting || where !== 'shoot' || $('#btnShot').disabled) return;
  counting = true;
  const n = +CFG.count;
  if(!n) return void fire();
  const box = $('#count');
  let k = n;
  box.classList.add('on'); box.textContent = k;
  PK.say(String(k)); PK.beep('hint');
  const iv = setInterval(() => {
    k--;
    if(k <= 0){ clearInterval(iv); box.classList.remove('on'); fire(); return; }
    box.textContent = k; PK.say(String(k)); PK.beep('hint');
  }, 1000);
}
function fire(){
  freeze();
  const f = $('#flash');
  f.style.transition = 'none'; f.style.opacity = '1';
  requestAnimationFrame(() => { f.style.transition = 'opacity .45s ease'; f.style.opacity = '0'; });
  PK.beep('good'); PK.buzz([40]);
  counting = false;
  candy++; localStorage.setItem('pk-christmas-gift', candy); paintCandy();
  show('done');
  compose().then(() => {
    PK.cheer(THEMES[themeIdx].em, THEMES[themeIdx].say, 1500);
  });
}

/* ---------- 저장 ---------- */
function save(){
  art.toBlob(b => {
    if(!b){ PK.say('저장할 수 없어요'); return; }
    const d = new Date();
    const p = n => String(n).padStart(2, '0');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = `크리스마스_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.png`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    PK.beep('win'); PK.say('저장했어요');
  }, 'image/png');
}

/* ---------- 버튼 연결 ---------- */
$('#btnGo').onclick = async () => {
  show('shoot');
  if(CFG.pick === 'auto') setTheme(themeIdx, false);
  $('#themeBox').style.display = CFG.pick === 'choose' ? 'grid' : 'none';
  PK.say('얼굴이 보이게 서 주세요');
  await startCam();
};
$('#btnShot').onclick = shoot;
$('#btnTheme').onclick = toggleThemeBox;
$('#btnRetryCam').onclick = () => { PK.beep('tap'); startCam(); };
$('#btnBack1').onclick = () => { stopCam(); PK.hush(); show('home'); };
$('#btnBack2').onclick = () => { stopCam(); PK.hush(); show('home'); };
$('#btnAgain').onclick = async () => {
  show('shoot');
  if(CFG.pick === 'auto') setTheme(themeIdx + 1, true);
  if(!stream) await startCam();
};
$('#btnNext').onclick = () => { PK.beep('pick'); setTheme(themeIdx + 1, true); compose(); };
$('#btnSave').onclick = save;

/* ---------- 저장될 모습 그대로 크게 보기 ---------- */
function openViewer(){
  if(!art.width) return;
  try{ $('#viewImg').src = art.toDataURL('image/png'); }catch(e){ return; }
  $('#viewer').classList.add('on'); PK.beep('tap');
}
function closeViewer(){ $('#viewer').classList.remove('on'); }
$('#btnBig').onclick = openViewer;
art.onclick = openViewer;
$('#viewer').onclick = closeViewer;
$('#btnViewClose').onclick = e => { e.stopPropagation(); closeViewer(); };
addEventListener('keydown', e => { if(e.key === 'Escape') closeViewer(); });

/* 화면 아무 데나 눌러도 찍히게 (스위치 사용 학생용) */
$('#camwrap').addEventListener('click', shoot);
addEventListener('keydown', e => {
  if(e.code === 'Space' || e.code === 'Enter'){
    if(where === 'shoot'){ e.preventDefault(); shoot(); }
    else if(where === 'home'){ e.preventDefault(); $('#btnGo').click(); }
  }
});

/* ---------- 설정 ---------- */
$('#btnGear').onclick = () => { $('#sheet').classList.add('on'); listCams(); PK.beep('tap'); };
$('#btnClose').onclick = () => { $('#sheet').classList.remove('on'); PK.beep('tap'); };
$('#sheet').addEventListener('click', e => { if(e.target === $('#sheet')) $('#btnClose').click(); });
$('#btnResetCandy').onclick = () => {
  candy = 0; localStorage.setItem('pk-christmas-gift', 0); paintCandy(); PK.beep('tap');
};
$('#camSel').onchange = e => { CFG.camId = e.target.value; PK.save('christmas', CFG); if(stream) startCam(); };

PK.bindOpts([['optPick','pick'], ['optCount','count'], ['optCut','cutout'],
             ['optSound','sound'], ['optVoice','voice']], CFG, 'christmas', k => {
  if(k === 'pick') $('#themeBox').style.display = CFG.pick === 'choose' ? 'grid' : 'none';
});

setTheme(0, false);
</script>
